<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动物大战 v0.2 · 竖屏版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #3a2f28;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
    user-select: none; -webkit-user-select: none;
    padding: 8px; touch-action: manipulation;
  }
  .title {
    color: #f5deb3; font-size: clamp(18px,4vw,22px);
    margin: 2px 0; letter-spacing: 3px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  #game {
    border-radius: 10px; box-shadow: 0 2px 16px rgba(0,0,0,0.5);
    max-width: 100%; display: block;
  }
  .panel {
    margin-top: 8px; background: #4a3828; border-radius: 10px;
    padding: 10px 12px; display: flex; flex-direction: column;
    gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    width: 100%; max-width: 420px;
  }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
  .row label { color:#d4c5b2; font-size:13px; white-space:nowrap; min-width:36px; }
  .row select {
    flex:1; min-width:80px; padding:8px 6px; border-radius:6px;
    border:1px solid #6b5a48; background:#5c4a38; color:#f5deb3;
    font-size:14px; font-family:inherit; -webkit-appearance:none;
    text-align:center;
  }
  .vs-text { color:#e8a87c; font-weight:bold; font-size:15px; }
  .btn {
    padding:10px 14px; border-radius:8px; border:none; cursor:pointer;
    font-size:14px; font-family:inherit; font-weight:bold;
    transition: all 0.15s; white-space:nowrap;
    -webkit-tap-highlight-color: transparent;
    min-height: 42px; min-width: 44px;
  }
  .btn:active { transform:scale(0.95); }
  .btn-fight {
    background: linear-gradient(135deg,#d4745c,#b8533f);
    color:#fff; font-size:16px; padding:12px 24px; flex:1;
    box-shadow: 0 2px 8px rgba(180,80,60,0.4);
  }
  .btn-reset { background:#5c4a38; color:#c4b5a2; }
  .btn-random { background: linear-gradient(135deg,#7b6b5a,#5c4a38); color:#f5deb3; }
  .speed-btn {
    padding:6px 12px; border-radius:5px; border:1px solid #6b5a48;
    background:transparent; color:#a09080; cursor:pointer;
    font-size:13px; font-family:inherit; min-width:36px;
  }
  .speed-btn.active { background:#e8a87c; color:#3a2f28; border-color:#e8a87c; font-weight:bold; }
  .info {
    color:#8a7a6a; font-size:10px; text-align:center;
    letter-spacing:1px; margin-top:2px;
  }
</style>
</head>
<body>

<div class="title">⚔️ 动物大战</div>

<canvas id="game"></canvas>

<div class="panel">
  <div class="row">
    <label>🔴红方</label>
    <select id="leftSelect"></select>
    <span class="vs-text">VS</span>
    <label>🔵蓝方</label>
    <select id="rightSelect"></select>
  </div>
  <div class="row">
    <button class="btn btn-random" id="btnRandom">🎲随机</button>
    <button class="btn btn-fight" id="btnFight">⚡开始对战</button>
    <button class="btn btn-reset" id="btnReset">🔄重置</button>
  </div>
  <div class="row">
    <span style="color:#8a7a6a;font-size:12px;">速度:</span>
    <button class="speed-btn" data-speed="1">1x</button>
    <button class="speed-btn active" data-speed="2">2x</button>
    <button class="speed-btn" data-speed="3">3x</button>
  </div>
</div>

<div class="info">v0.2 · 竖屏版 · 空格开始 R重置 F随机 1/2/3调速</div>

<script>
// ==================== 画布自适应 ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const maxW = Math.min(window.innerWidth - 16, 420);
  const ratio = 1.55;
  canvas.width = maxW;
  canvas.height = Math.floor(maxW * ratio);
  // 高DPI适配
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = maxW + 'px';
  canvas.style.height = Math.floor(maxW * ratio) + 'px';
  if (dpr > 1) {
    canvas.width = maxW * dpr;
    canvas.height = Math.floor(maxW * ratio) * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  W = maxW; H = Math.floor(maxW * ratio);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 300));
resize();

// ==================== 常量 ====================
const WALL = 12;                   // 边界距离
const DIR_MIN = 600, DIR_MAX = 2200; // 方向变化间隔(ms)
const ATK_CD = 800;               // 普攻冷却(ms)
const KB = 3;                      // 击退力度
const MAX_MINIONS = 3;            // 最大帮手数量

// ==================== 动物数据 ====================
const ANIMALS = {
  chicken: {
    id:'chicken', name:'母鸡', emoji:'🐔',
    hp:100, speed:0.9, damage:5, atkRange:32, size:22,
    color:'#f4a460', desc:'近战啄击·远程撒米·下蛋孵化',
    ranged:true,                    // 同时拥有远程攻击
    rangedDmg:10, rangedCD:2200, rangedRange:150,
    rangedEmoji:'🍚', rangedSpeed:7,
    skills:[{
      name:'下蛋', emoji:'🥚', cd:7500, type:'lay_egg',
      desc:'下一颗蛋，经过蛋→小鸡→青年鸡→成年鸡，孵化后协助战斗'
    }]
  },
  bear: {
    id:'bear', name:'棕熊', emoji:'🐻',
    hp:160, speed:0.7, damage:15, atkRange:44, size:30,
    color:'#8B7355', desc:'高伤普攻·眩晕拍击',
    skills:[{
      name:'眩晕拍击', emoji:'💫', cd:6500, type:'stun',
      duration:1800, desc:'下一次攻击眩晕对手1.8秒'
    }]
  },
  wolf: {
    id:'wolf', name:'狼', emoji:'🐺',
    hp:105, speed:1.5, damage:9, atkRange:40, size:23,
    color:'#a0a0a0', desc:'高速移动·流血撕咬',
    skills:[{
      name:'流血撕咬', emoji:'🩸', cd:5000, type:'bleed',
      damage:5, duration:3500, tickInterval:700, desc:'命中后造成持续3.5秒流血'
    }]
  },
  bull: {
    id:'bull', name:'公牛', emoji:'🐂',
    hp:145, speed:0.8, damage:11, atkRange:42, size:28,
    color:'#c4a882', desc:'皮厚耐打·冲锋击退',
    skills:[{
      name:'冲锋', emoji:'💨', cd:5500, type:'charge',
      damage:20, knockback:10, desc:'猛冲造成20伤害并大幅击退'
    }]
  },
  eagle: {
    id:'eagle', name:'鹰', emoji:'🦅',
    hp:80, speed:1.4, damage:13, atkRange:42, size:22,
    color:'#f5f5f5', desc:'高速高伤·俯冲暴击',
    skills:[{
      name:'俯冲暴击', emoji:'⚡', cd:4800, type:'crit',
      multiplier:2.3, desc:'下一次攻击造成2.3倍伤害'
    }]
  },
  snake: {
    id:'snake', name:'蛇', emoji:'🐍',
    hp:90, speed:1.0, damage:8, atkRange:36, size:21,
    color:'#5dade2', desc:'灵活走位·毒液注入',
    skills:[{
      name:'毒液', emoji:'🧪', cd:3800, type:'poison',
      damage:5, duration:4500, tickInterval:900, desc:'命中后使对手中毒4.5秒'
    }]
  },
  lion: {
    id:'lion', name:'狮子', emoji:'🦁',
    hp:125, speed:1.0, damage:13, atkRange:44, size:27,
    color:'#e8a87c', desc:'均衡战士·咆哮减益',
    skills:[{
      name:'咆哮', emoji:'🦁', cd:6000, type:'roar',
      weakenPct:0.4, duration:3000, desc:'咆哮使对手攻击力降低40%持续3秒(AOE)'
    }]
  },
  elephant: {
    id:'elephant', name:'大象', emoji:'🐘',
    hp:190, speed:0.6, damage:13, atkRange:48, size:34,
    color:'#b0a090', desc:'血牛坦克·地动山摇',
    skills:[{
      name:'地动山摇', emoji:'🌍', cd:8500, type:'quake',
      damage:12, stunDuration:2000, desc:'踩地造成12伤害并眩晕2秒(AOE)'
    }]
  },
  turtle: {
    id:'turtle', name:'乌龟', emoji:'🐢',
    hp:115, speed:0.5, damage:7, atkRange:32, size:22,
    color:'#6b8e6b', desc:'极慢高防·缩壳减伤',
    skills:[{
      name:'缩壳', emoji:'🐢', cd:7500, type:'shield',
      reducePct:0.7, duration:3000, desc:'缩入壳中减伤70%持续3秒'
    }]
  }
};

// 小鸡帮手配置
const MINION_CFG = {
  name:'小鸡', emoji:'🐔', hp:45, speed:0.8,
  damage:5, atkRange:34, size:16, color:'#f4c460',
  isMinion:true, ranged:false
};

// ==================== 游戏状态 ====================
let gameSpeed = 2;
let animals = [];        // 所有战斗单位(含帮手)
let eggs = [];           // 蛋实体
let effects = [];
let gameState = 'idle';
let winner = null;
let lastTime = 0;
let frameId = null;

// ==================== 实体类 ====================
class Animal {
  constructor(cfg, x, team, facingRight) {
    Object.assign(this, cfg);
    this.maxHp = cfg.hp;
    this.x = x;
    this.y = H * 0.3 + Math.random() * H * 0.35;
    this.team = team;
    this.facingRight = facingRight;
    const spd = cfg.speed * 90 * (0.6 + Math.random() * 0.8);
    this.vx = (facingRight ? 1 : -1) * spd;
    this.vy = (Math.random() - 0.5) * spd * 1.5;
    this.atkTimer = Math.random() * ATK_CD;
    this.dirTimer = Math.random() * DIR_MAX;
    this.stunned = false; this.stunTimer = 0;
    this.flashTimer = 0; this.dead = false;
    // 技能状态
    this.skills = (cfg.skills||[]).map(s=>({...s,cdTimer:Math.random()*s.cd*0.4}));
    // 远程攻击状态
    this.rangedTimer = cfg.ranged ? Math.random() * cfg.rangedCD : 99999;
    // Buff
    this.dotEffects = [];
    this.shieldActive = false; this.shieldTimer = 0; this.shieldReduce = 0;
    this.weakenPct = 0; this.weakenTimer = 0;
    this.critNext = false;
    this.stunNext = false;
    this.bleedNext = false;
    this.poisonNext = false;
    this.chargeReady = false;
  }

  update(dt) {
    if (this.dead) return;
    const rd = dt;
    if (this.stunned) { this.stunTimer-=rd; if(this.stunTimer<=0)this.stunned=false; return; }
    if (this.shieldActive) { this.shieldTimer-=rd; if(this.shieldTimer<=0){this.shieldActive=false;this.shieldReduce=0;} }
    if (this.weakenTimer>0) { this.weakenTimer-=rd; if(this.weakenTimer<=0)this.weakenPct=0; }
    if (this.flashTimer>0) this.flashTimer-=rd;
    if (this.atkTimer>0) this.atkTimer-=rd;
    if (this.rangedTimer>0) this.rangedTimer-=rd;
    this.skills.forEach(s=>{if(s.cdTimer>0)s.cdTimer-=rd;});

    this.dirTimer-=rd;
    if (this.dirTimer<=0) { this._newDir(); this.dirTimer=DIR_MIN+Math.random()*(DIR_MAX-DIR_MIN); }

    this.x+=this.vx*rd/1000; this.y+=this.vy*rd/1000;
    this._wallBounce();
  }

  _newDir() {
    const a=Math.random()*Math.PI*2, s=this.speed*90*(0.5+Math.random());
    this.vx=Math.cos(a)*s; this.vy=Math.sin(a)*s;
    if(Math.random()<0.25){const cx=W/2,cy=H*0.45,dx=cx-this.x,dy=cy-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;this.vx=this.vx*0.7+(dx/dist)*s*0.3;this.vy=this.vy*0.7+(dy/dist)*s*0.3;}
    this.facingRight=this.vx>0;
  }

  _wallBounce() {
    const r=this.size,ml=WALL+r,mr=W-WALL-r,mt=WALL+r+50,mb=H-WALL-r;let hit=false;
    if(this.x<ml){this.x=ml;this.vx=Math.abs(this.vx)*(0.5+Math.random()*0.6);this.facingRight=true;hit=true;}
    if(this.x>mr){this.x=mr;this.vx=-Math.abs(this.vx)*(0.5+Math.random()*0.6);this.facingRight=false;hit=true;}
    if(this.y<mt){this.y=mt;this.vy=Math.abs(this.vy)*(0.5+Math.random()*0.6);hit=true;}
    if(this.y>mb){this.y=mb;this.vy=-Math.abs(this.vy)*(0.5+Math.random()*0.6);hit=true;}
    if(hit)for(let i=0;i<3;i++)spawnFX('particle',this.x,this.y,null,this.color,0.5);
  }

  effDmg() {
    let d=this.damage; if(this.weakenPct>0)d*=(1-this.weakenPct);
    if(this.critNext){d*=this.skills.find(s=>s.type==='crit')?.multiplier||2;this.critNext=false;}
    return Math.round(Math.max(1,d));
  }

  dealDmg(target) {
    const isCrit=this.critNext,willStun=this.stunNext,willBleed=this.bleedNext,willPoison=this.poisonNext,isCharge=this.chargeReady;
    let dmg=this.effDmg();
    if(target.shieldActive)dmg=Math.round(dmg*(1-target.shieldReduce));
    if(willStun){target.stunned=true;target.stunTimer=this.skills.find(s=>s.type==='stun')?.duration||1800;this.stunNext=false;spawnFX('text',target.x,target.y-25,'眩晕!','#ffd700');}
    if(willBleed){target.dotEffects.push({dmg:this.skills.find(s=>s.type==='bleed')?.damage||5,dur:this.skills.find(s=>s.type==='bleed')?.duration||3500,tick:this.skills.find(s=>s.type==='bleed')?.tickInterval||700,elapsed:0,tickAcc:0});this.bleedNext=false;spawnFX('text',target.x,target.y-25,'流血!','#e74c3c');}
    if(willPoison){target.dotEffects.push({dmg:this.skills.find(s=>s.type==='poison')?.damage||5,dur:this.skills.find(s=>s.type==='poison')?.duration||4500,tick:this.skills.find(s=>s.type==='poison')?.tickInterval||900,elapsed:0,tickAcc:0});this.poisonNext=false;spawnFX('text',target.x,target.y-25,'中毒!','#8e44ad');}
    target.hp-=dmg;target.flashTimer=120;target.atkTimer=Math.min(target.atkTimer,150);
    const dx=target.x-this.x,dy=target.y-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    const kb=isCharge?(this.skills.find(s=>s.type==='charge')?.knockback||10):KB;
    target.vx+=(dx/dist)*kb*25;target.vy+=(dy/dist)*kb*18;
    this.chargeReady=false;
    spawnFX('damage',target.x,target.y-18,dmg,isCrit?'#ff6b6b':'#fff',isCrit?1.3:1);
    if(target.hp<=0){target.hp=0;target.dead=true;}
  }

  useSkill(skill, enemies) {
    skill.cdTimer=skill.cd;
    const target = enemies.length>0 ? enemies[0] : null;
    switch(skill.type) {
      case 'stun': this.stunNext=true; spawnFX('text',this.x,this.y-25,skill.name+'!','#ff6b6b'); break;
      case 'bleed': this.bleedNext=true; spawnFX('text',this.x,this.y-25,skill.name+'!','#e74c3c'); break;
      case 'poison': this.poisonNext=true; spawnFX('text',this.x,this.y-25,skill.name+'!','#8e44ad'); break;
      case 'crit': this.critNext=true; spawnFX('text',this.x,this.y-25,skill.name+'!','#ffd700'); break;
      case 'charge': this.chargeReady=true; if(target){const dx=target.x-this.x,dy=target.y-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;this.vx=(dx/dist)*this.speed*350;this.vy=(dy/dist)*this.speed*250;} spawnFX('text',this.x,this.y-25,skill.name+'!','#cd853f'); break;
      case 'roar': if(target){target.weakenPct=skill.weakenPct;target.weakenTimer=skill.duration;spawnFX('text',target.x,target.y-25,'攻击↓','#8e44ad');} spawnFX('text',this.x,this.y-25,'咆哮!','#e8a87c'); break;
      case 'quake':
        enemies.forEach(e=>{e.hp-=(skill.damage||0);if(e.hp<=0){e.hp=0;e.dead=true;}e.flashTimer=150;e.stunned=true;e.stunTimer=skill.stunDuration;spawnFX('damage',e.x,e.y-18,skill.damage,'#cd853f');spawnFX('text',e.x,e.y-35,'眩晕!','#ffd700');});
        spawnFX('text',this.x,this.y-25,skill.name+'!','#cd853f'); break;
      case 'shield': this.shieldActive=true;this.shieldTimer=skill.duration;this.shieldReduce=skill.reducePct;spawnFX('text',this.x,this.y-25,'缩壳!','#6b8e6b'); break;
      case 'lay_egg':
        if(eggs.filter(e=>e.owner===this).length<MAX_MINIONS){
          eggs.push(new Egg(this.x,this.y,this));
          spawnFX('text',this.x,this.y-25,'下蛋!','#f4a460');
        }
        break;
    }
  }

  rangedAttack(target) {
    if (!target||target.dead) return;
    this.rangedTimer = this.rangedCD;
    spawnFX('projectile',this.x,this.y-8,{
      emoji:this.rangedEmoji,damage:this.rangedDmg,
      speed:this.rangedSpeed,target:target
    },'#f4a460');
  }

  draw(ctx) {
    if(this.dead) return;
    // 眩晕星星
    if(this.stunned){for(let i=0;i<3;i++){const a=(Date.now()/300+i*Math.PI*2/3)%(Math.PI*2);ctx.font='14px serif';ctx.fillText('⭐',this.x+Math.cos(a)*(this.size+10)-7,this.y+Math.sin(a)*(this.size+6)-8);}}
    // 护盾光环
    if(this.shieldActive){ctx.strokeStyle='rgba(107,142,107,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.size+8,0,Math.PI*2);ctx.stroke();}
    // 暴击光环
    if(this.critNext){ctx.strokeStyle='rgba(255,215,0,0.5)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(this.x,this.y,this.size+5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
    // 底圆
    const fc=this.flashTimer>0?'#fff':this.color;
    ctx.fillStyle=fc;ctx.globalAlpha=0.3;
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=this.flashTimer>0?'#fff':'rgba(255,255,255,0.25)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.stroke();
    // emoji
    const es=this.isMinion?this.size*1.2:this.size*1.4;
    ctx.font=`${es}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(this.emoji,this.x,this.y);
    // 名字
    ctx.font=`bold ${this.isMinion?9:10}px "PingFang SC","Microsoft YaHei"`;ctx.fillStyle='#fff';
    ctx.fillText(this.name,this.x,this.y+this.size+12);
    // 血条
    const bw=this.isMinion?30:46,bh=this.isMinion?4:5,by=this.y-this.size-12;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(this.x-bw/2,by,bw,bh);
    const r=this.hp/this.maxHp;
    ctx.fillStyle=r>0.5?'#5cb85c':r>0.25?'#f0ad4e':'#d9534f';
    ctx.fillRect(this.x-bw/2,by,bw*r,bh);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=0.5;ctx.strokeRect(this.x-bw/2,by,bw,bh);
    // 技能指示灯
    if(!this.isMinion)this.skills.forEach((s,i)=>{
      const dx=this.x-6+i*10,dy=by+bh+7,rdy=s.cdTimer<=0;
      ctx.fillStyle=rdy?'#5cb85c':'#555';ctx.beginPath();ctx.arc(dx,dy,3,0,Math.PI*2);ctx.fill();
      if(!rdy){const p=1-s.cdTimer/s.cd;ctx.strokeStyle='#ffd700';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(dx,dy,3,-Math.PI/2,-Math.PI/2+p*Math.PI*2);ctx.stroke();}
    });
    // 减益标记
    if(this.weakenPct>0){ctx.font='11px serif';ctx.fillStyle='#8e44ad';ctx.fillText('🔻',this.x,this.y-this.size-22);}
    if(this.dotEffects.length>0){ctx.font='11px serif';ctx.fillStyle='#e74c3c';ctx.fillText('💔',this.x+this.size+4,this.y-2);}
  }
}

// ==================== 蛋实体 ====================
class Egg {
  constructor(x, y, owner) {
    this.x = x; this.y = y;
    this.owner = owner; // 母鸡引用
    this.stage = 0;      // 0蛋 1雏鸡 2青年 3成年
    this.stageTime = [2800, 2800, 3500]; // 每个阶段时间(ms)
    this.accTime = 0;
    this.emojis = ['🥚','🐣','🐤','🐔'];
    this.sizes = [8,12,16,20];
    this.dead = false;
    this.bobOffset = 0;
  }

  update(dt) {
    if(this.dead) return;
    this.accTime += dt;
    this.bobOffset = Math.sin(this.accTime/300)*2;
    if(this.stage < 3 && this.accTime >= this.stageTime[this.stage]) {
      this.accTime -= this.stageTime[this.stage];
      this.stage++;
      if(this.stage >= 3) {
        this.dead = true;
        // 孵化帮手
        animals.push(new Animal(MINION_CFG, this.x, this.owner.team, Math.random()>0.5));
        spawnFX('text', this.x, this.y-20, '孵化!', '#f4a460');
        for(let i=0;i<6;i++) spawnFX('particle',this.x,this.y,null,'#f4c460',0.8);
      }
    }
  }

  draw(ctx) {
    if(this.dead) return;
    const s = this.sizes[this.stage];
    const alpha = this.stage===0?1:0.8;
    ctx.globalAlpha = alpha;
    // 地面阴影
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(this.x, this.y+s+2, s*0.6, 2, 0, 0, Math.PI*2); ctx.fill();
    // 蛋/小鸡
    ctx.font = `${s*1.4}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.emojis[this.stage], this.x, this.y+this.bobOffset);
    // 进度指示(小圆环)
    if(this.stage<3){
      const p = this.accTime / this.stageTime[this.stage];
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(this.x, this.y-s-4, s*0.5, -Math.PI/2, -Math.PI/2+p*Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

// ==================== 特效 ====================
function spawnFX(type,x,y,data,color,scale=1){
  effects.push({type,x,y,data,color,scale,life:type==='particle'?350:900,age:0,dead:false,
    vx:type==='particle'?(Math.random()-0.5)*70:0,
    vy:type==='particle'?(Math.random()-0.5)*70-25:0});
}

function updateFX(dt){
  effects.forEach(e=>{
    e.age+=dt; if(e.age>=e.life){e.dead=true;return;}
    switch(e.type){
      case'damage':e.y-=35*dt/1000;break;
      case'text':e.y-=25*dt/1000;break;
      case'particle':e.x+=(e.vx||0)*dt/1000;e.y+=(e.vy||0)*dt/1000;break;
      case'projectile':
        const t=e.data.target;
        if(t&&!t.dead){const dx=t.x-e.x,dy=t.y-e.y,dist=Math.sqrt(dx*dx+dy*dy)||1,sp=e.data.speed*90;e.x+=(dx/dist)*sp*dt/1000;e.y+=(dy/dist)*sp*dt/1000;if(dist<22){t.hp-=e.data.damage;if(t.hp<=0){t.hp=0;t.dead=true;}t.flashTimer=120;spawnFX('damage',t.x,t.y-18,e.data.damage,'#f4a460');e.dead=true;}}else{e.dead=true;}
        break;
    }
  });
  effects=effects.filter(e=>!e.dead);
}

function drawFX(ctx){
  effects.forEach(e=>{
    const a=Math.max(0,1-e.age/e.life);ctx.globalAlpha=a;
    switch(e.type){
      case'damage':ctx.font=`bold ${Math.round(18*e.scale)}px "PingFang SC"`;ctx.fillStyle=e.color;ctx.textAlign='center';ctx.fillText(`-${e.data}`,e.x+(Math.random()-0.5)*3,e.y);break;
      case'text':ctx.font='bold 14px "PingFang SC"';ctx.fillStyle=e.color;ctx.textAlign='center';ctx.fillText(e.data,e.x,e.y);break;
      case'particle':ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,2.5*e.scale*a,0,Math.PI*2);ctx.fill();break;
      case'projectile':ctx.font='20px serif';ctx.textAlign='center';ctx.fillText(e.data.emoji,e.x,e.y);ctx.globalAlpha=a*0.4;ctx.fillText(e.data.emoji,e.x-3,e.y-3);break;
    }
    ctx.globalAlpha=1;
  });
}

// ==================== 背景绘制 ====================
function drawBG(ctx){
  // 天空 — 暖色黄昏
  const sky=ctx.createLinearGradient(0,0,0,H*0.55);
  sky.addColorStop(0,'#d4c5a0'); sky.addColorStop(0.4,'#c4b590');
  sky.addColorStop(1,'#b8a878');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  // 远山
  ctx.fillStyle='#a09070'; ctx.beginPath(); ctx.moveTo(0,H*0.52);
  for(let x=0;x<=W;x+=40)ctx.lineTo(x,H*0.48-Math.sin(x*0.01)*18-Math.sin(x*0.025)*12);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

  // 地面
  const gnd=ctx.createLinearGradient(0,H*0.54,0,H);
  gnd.addColorStop(0,'#8a7a58'); gnd.addColorStop(0.3,'#7a6a48');
  gnd.addColorStop(1,'#5a4a30');
  ctx.fillStyle=gnd; ctx.fillRect(0,H*0.54,W,H*0.46);

  // 草地纹理
  ctx.fillStyle='#9a8a60';
  for(let x=0;x<W;x+=18)for(let y=H*0.55;y<H;y+=14){
    if(Math.random()<0.15){ctx.fillRect(x,y,8,4);ctx.fillRect(x+10,y+1,6,3);}
  }

  // 木围栏
  ctx.fillStyle='#6b4a30';
  for(let x=WALL;x<=W-WALL;x+=35){ctx.fillRect(x,H*0.52,3,H*0.06);ctx.fillStyle='#7b5a3a';}
  ctx.fillStyle='#6b4a30'; ctx.fillRect(WALL,H*0.52,W-WALL*2,2); ctx.fillRect(WALL,H*0.535,W-WALL*2,2);

  // 角落小草
  ctx.fillStyle='#7a9a50';
  for(let i=0;i<5;i++){const bx=20+i*30+Math.sin(i)*15,by=H*0.57+Math.cos(i)*8;ctx.beginPath();ctx.arc(bx,by,10+Math.random()*5,0,Math.PI*2);ctx.fill();}
  for(let i=0;i<5;i++){const bx=W-20-i*30+Math.sin(i+1)*15,by=H*0.57+Math.cos(i+1)*8;ctx.beginPath();ctx.arc(bx,by,10+Math.random()*5,0,Math.PI*2);ctx.fill();}
}

// ==================== 主循环 ====================
function loop(ts){
  if(!lastTime)lastTime=ts;
  let dt=Math.min(ts-lastTime,100)*gameSpeed;lastTime=ts;

  ctx.clearRect(0,0,W,H);
  drawBG(ctx);

  if(gameState==='fighting'){
    // 更新所有单位
    animals.forEach(a=>a.update(dt));
    eggs.forEach(e=>e.update(dt));
    updateFX(dt);

    // 分组
    const t0=animals.filter(a=>a.team===0&&!a.dead);
    const t1=animals.filter(a=>a.team===1&&!a.dead);

    // DOT处理
    animals.forEach(a=>{
      a.dotEffects.forEach(d=>{
        d.elapsed+=dt;d.tickAcc+=dt;
        if(d.tickAcc>=d.tick){d.tickAcc-=d.tick;a.hp-=d.dmg;if(a.hp<=0){a.hp=0;a.dead=true;}spawnFX('damage',a.x+(Math.random()-0.5)*16,a.y-14-Math.random()*8,d.dmg,'#e74c3c');}
      });
      a.dotEffects=a.dotEffects.filter(d=>d.elapsed<d.dur);
    });

    // 物理推挤 + 攻击/技能
    const allAlive = [...t0,...t1];
    for(let i=0;i<allAlive.length;i++){
      for(let j=i+1;j<allAlive.length;j++){
        const a=allAlive[i],b=allAlive[j];
        const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
        const minD=a.size+b.size;
        if(dist<minD){const ov=minD-dist,nx=dx/dist,ny=dy/dist;a.x-=nx*ov*0.5;a.y-=ny*ov*0.5;b.x+=nx*ov*0.5;b.y+=ny*ov*0.5;}
        // 不同队伍才攻击
        if(a.team!==b.team&&!a.dead&&!b.dead&&!a.stunned&&!b.stunned){
          const atkD=(a.atkRange+b.atkRange)/2;
          if(dist<atkD){
            if(a.atkTimer<=0){a.dealDmg(b);a.atkTimer=ATK_CD;}
            if(!b.dead&&b.atkTimer<=0){b.dealDmg(a);b.atkTimer=ATK_CD;}
          }
          // 远程攻击(仅a)
          if(a.ranged&&a.rangedTimer<=0&&!a.dead&&!a.stunned){
            const rd=a.rangedRange||150;
            if(dist<rd)a.rangedAttack(b);
          }
          if(b.ranged&&b.rangedTimer<=0&&!b.dead&&!b.stunned){
            const rd=b.rangedRange||150;
            if(dist<rd)b.rangedAttack(a);
          }
        }
      }
    }

    // 技能自动释放
    allAlive.forEach(a=>{
      if(a.dead||a.stunned||a.isMinion) return;
      const enemies = a.team===0?t1:t0;
      a.skills.forEach(s=>{
        if(s.cdTimer<=0) a.useSkill(s, enemies);
      });
    });

    // 清理死亡帮手
    animals=animals.filter(a=>!a.dead||!a.isMinion);
    eggs=eggs.filter(e=>!e.dead);

    // 胜负判定
    const alive0=t0.filter(a=>!a.dead).length,alive1=t1.filter(a=>!a.dead).length;
    if(alive0===0||alive1===0){
      gameState='ended';
      winner=alive0>0?t0.find(a=>!a.dead):t1.find(a=>!a.dead);
      document.getElementById('btnFight').disabled=false;
    }
  }

  // 渲染
  eggs.forEach(e=>e.draw(ctx));
  animals.forEach(a=>a.draw(ctx));
  drawFX(ctx);

  // 结束/等待文字
  if(gameState==='ended'&&winner){
    const alpha=0.5+Math.sin(Date.now()/500)*0.4;
    ctx.globalAlpha=alpha;ctx.font='bold 36px "PingFang SC"';ctx.fillStyle='#ffd700';ctx.textAlign='center';
    ctx.fillText(`${winner.emoji}${winner.name}获胜!`,W/2,H/2);ctx.globalAlpha=1;
  }
  if(gameState==='idle'){
    const alpha=0.3+Math.sin(Date.now()/700)*0.2;
    ctx.globalAlpha=alpha;ctx.font='bold 18px "PingFang SC"';ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.fillText('选择动物，点击开始对战',W/2,H/2);ctx.globalAlpha=1;
  }

  frameId=requestAnimationFrame(loop);
}

// ==================== 控制 ====================
function populateUI(){
  const ls=document.getElementById('leftSelect'),rs=document.getElementById('rightSelect');
  const keys=Object.keys(ANIMALS);
  [ls,rs].forEach(sel=>{sel.innerHTML='';keys.forEach(k=>{const a=ANIMALS[k];sel.innerHTML+=`<option value="${k}">${a.emoji}${a.name}</option>`;});});
  ls.value='chicken';rs.value='bear';randomSelect();
}
populateUI();

function randomSelect(){
  const keys=Object.keys(ANIMALS);
  document.getElementById('leftSelect').value=keys[Math.floor(Math.random()*keys.length)];
  document.getElementById('rightSelect').value=keys[Math.floor(Math.random()*keys.length)];
}

function startBattle(){
  const lk=document.getElementById('leftSelect').value,rk=document.getElementById('rightSelect').value;
  const ca=ANIMALS[lk],cb=ANIMALS[rk];
  animals=[new Animal(ca,W*0.25,0,true),new Animal(cb,W*0.75,1,false)];
  eggs=[];effects=[];gameState='fighting';winner=null;lastTime=0;
  document.getElementById('btnFight').disabled=true;
}

function resetBattle(){
  animals=[];eggs=[];effects=[];gameState='idle';winner=null;lastTime=0;
  document.getElementById('btnFight').disabled=false;
}

document.getElementById('btnFight').addEventListener('click',startBattle);
document.getElementById('btnReset').addEventListener('click',resetBattle);
document.getElementById('btnRandom').addEventListener('click',()=>{randomSelect();resetBattle();});

document.querySelectorAll('.speed-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.speed-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');gameSpeed=parseInt(b.dataset.speed);
}));

document.addEventListener('keydown',e=>{
  switch(e.key.toLowerCase()){
    case' ':e.preventDefault();if(gameState==='fighting')resetBattle();startBattle();break;
    case'r':resetBattle();break;
    case'f':randomSelect();resetBattle();break;
    case'1':setSpd(1);break;case'2':setSpd(2);break;case'3':setSpd(3);break;
  }
});
function setSpd(s){gameSpeed=s;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.speed)===s));}

// ==================== 启动 ====================
frameId=requestAnimationFrame(loop);
</script>
