<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动物大战 v3.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#3a2f28;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'PingFang SC','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none;padding:3px;touch-action:manipulation}
.title{color:#f5deb3;font-size:clamp(14px,3.5vw,18px);margin:1px 0;letter-spacing:2px}
#game{border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.5);max-width:100%;display:block}
.panel{margin-top:3px;background:#4a3828;border-radius:10px;padding:5px 7px;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 8px rgba(0,0,0,0.3);width:100%;max-width:420px}
.row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.row label{color:#d4c5b2;font-size:10px;white-space:nowrap}
.row select{flex:1;min-width:50px;padding:5px 2px;border-radius:6px;border:1px solid #6b5a48;background:#5c4a38;color:#f5deb3;font-size:11px;font-family:inherit;-webkit-appearance:none;text-align:center}
.btn{padding:7px 9px;border-radius:7px;border:none;cursor:pointer;font-size:11px;font-family:inherit;font-weight:bold;transition:all 0.15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;min-height:34px}
.btn:active{transform:scale(0.95)}
.btn-fight{background:linear-gradient(135deg,#d4745c,#b8533f);color:#fff;font-size:13px;padding:8px 14px;flex:1}
.btn-reset{background:#5c4a38;color:#c4b5a2}
.btn-random{background:linear-gradient(135deg,#7b6b5a,#5c4a38);color:#f5deb3}
.speed-btn{padding:3px 6px;border-radius:5px;border:1px solid #6b5a48;background:transparent;color:#a09080;cursor:pointer;font-size:9px;font-family:inherit}
.speed-btn.active{background:#e8a87c;color:#3a2f28;border-color:#e8a87c;font-weight:bold}
.info{color:#8a7a6a;font-size:8px;text-align:center;letter-spacing:1px}
.tag-row{display:flex;flex-wrap:wrap;gap:3px;min-height:20px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:2px;background:#5c4a38;color:#f5deb3;padding:2px 6px;border-radius:4px;font-size:10px;cursor:pointer}
.tag:hover{background:#d4745c}
.tag .x{color:#d4745c;font-weight:bold;margin-left:2px}
.tag:hover .x{color:#fff}
.mute-tag{color:#8a7a6a;font-size:9px}
.comment-bar{background:#1a1a0a;border-radius:0 0 10px 10px;padding:4px 10px;width:100%;max-width:420px;min-height:22px;overflow:hidden;margin-bottom:2px}
.comment-bar .comment-item{color:#ccc;font-size:9px;padding:2px 0;animation:commentIn 0.3s ease-out;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes commentIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#ffd700;padding:8px 18px;border-radius:8px;font-size:13px;font-family:inherit;z-index:100;pointer-events:none;transition:opacity 0.3s}
.toast.hidden{opacity:0}
</style>
</head>
<body>
<div class="title">⚔️ 动物大战 v3.2</div>
<canvas id="game"></canvas>
<div id="toast" class="toast hidden"></div>
<div class="comment-bar" id="commentBar"><span class="comment-item">选择动物，点击开始对战</span></div>
<div class="panel">
  <div class="row">
    <label>🎯</label><select id="asel"></select>
    <button class="btn btn-random" id="badd" style="font-size:10px;padding:4px 8px;min-height:26px">+添加</button>
  </div>
  <div class="tag-row" id="tags"></div>
  <div class="row" style="margin-top:2px">
    <label>🗺️</label><select id="msel"></select>
  </div>
  <div class="row">
    <button class="btn btn-random" id="br">🎲随机</button>
    <button class="btn btn-fight" id="bf">⚡开始</button>
    <button class="btn btn-reset" id="bx">🔄重置</button>
  </div>
  <div class="row">
    <span style="color:#8a7a6a;font-size:9px">速度:</span>
    <button class="speed-btn" data-s="1">0.5x</button>
    <button class="speed-btn active" data-s="2">1x</button>
    <button class="speed-btn" data-s="4">2x</button>
    <button class="speed-btn" data-s="8">4x</button>
  </div>
</div>
<div class="info">v3.2 · 10种动物 · 空格开始 R重置 F随机 数字调速</div>

<script>
// ==================== 画布 ====================
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,arenaL,arenaR,arenaT,arenaB,arenaScale=1;
const BASE_MAXW=420,RATIO=1.55;
function resize(scaleOverride){
  const sc=scaleOverride||arenaScale;
  const mw=Math.min(window.innerWidth-12,Math.floor(BASE_MAXW*sc)),ratio=RATIO;
  canvas.width=mw;canvas.height=Math.floor(mw*ratio);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.style.width=mw+'px';canvas.style.height=Math.floor(mw*ratio)+'px';
  if(dpr>1){canvas.width=mw*dpr;canvas.height=Math.floor(mw*ratio)*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  W=mw;H=Math.floor(mw*ratio);
  arenaL=14;arenaR=W-14;arenaT=50;arenaB=H-14;
}
window.addEventListener('resize',()=>resize());
window.addEventListener('orientationchange',()=>setTimeout(()=>resize(),300));
resize(1);

// ==================== 注释系统 ====================
let commentLog=[];
const MAX_COMMENTS=5;
function showComment(text,color='#ccc'){
  commentLog.unshift({text,color,age:0});
  if(commentLog.length>MAX_COMMENTS)commentLog.length=MAX_COMMENTS;
  updateCommentBar();
}
function showToast(text,dur=3000){
  const t=document.getElementById('toast');
  t.textContent=text;t.classList.remove('hidden');
  clearTimeout(t._to);t._to=setTimeout(()=>t.classList.add('hidden'),dur);
}
function updateCommentBar(){
  const bar=document.getElementById('commentBar');
  if(commentLog.length===0){bar.innerHTML='<span class="comment-item">...</span>';return;}
  bar.innerHTML=commentLog.map(c=>`<div class="comment-item" style="color:${c.color}">${c.text}</div>`).join('');
}

// ==================== 背景 ====================
let grassSpots=[],mapParticles=[],mapHazards=[],vinePatches=[],blizzards=[];
function initGrass(){grassSpots=[];const rng=s=>{let x=Math.sin(s)*10000;return x-Math.floor(x);};for(let i=0;i<30;i++)grassSpots.push({x:arenaL+rng(i*7+1)*(arenaR-arenaL),y:arenaB-rng(i*13+3)*22,r:4+rng(i*17+5)*8});}
initGrass();

const MAPS={
  grassland:{name:'🌿草原',desc:'回血0.7HP/2s·藤蔓减速40%',color:'#7a9a50',bgTop:'#b8d890',bgBot:'#6a8a3a'},
  volcano:{name:'🌋火山',desc:'贯穿岩浆河·随机喷发',color:'#8b4513',bgTop:'#5a3020',bgBot:'#2a1005'},
  ice:{name:'❄️冰原',desc:'移速+15%·暴风雪龙卷风',color:'#a0c8e8',bgTop:'#c8ddf0',bgBot:'#7090a8'},
  wind:{name:'🌪️风谷',desc:'移速+20%·风向5秒切换',color:'#8a9a70',bgTop:'#b8c898',bgBot:'#5a7a40'},
  colosseum:{name:'🏛️竞技场',desc:'标准规则·无特殊效果',color:'#a09080',bgTop:'#d4c5a0',bgBot:'#8a7a58'}
};
let currentMap='colosseum';
let windDir={x:1,y:0},windTimer=0,windInterval=5000;
let lavaRiver=null; // 火山岩浆河

function drawBG(ctx){
  const m=MAPS[currentMap];
  const sky=ctx.createLinearGradient(0,0,0,arenaT+25);
  sky.addColorStop(0,m.bgTop);sky.addColorStop(1,m.bgTop);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const gnd=ctx.createLinearGradient(0,arenaT+6,0,H);
  gnd.addColorStop(0,m.bgTop);gnd.addColorStop(0.6,m.bgBot);gnd.addColorStop(1,'#2a1a0a');
  ctx.fillStyle=gnd;ctx.fillRect(0,arenaT+6,W,H-arenaT-6);

  if(currentMap==='grassland'){
    grassSpots.forEach(g=>{const gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r);gr.addColorStop(0,'#8ab84a');gr.addColorStop(1,'#5a8a30');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();});
    for(let i=0;i<8;i++){const fx=arenaL+((i*137+53)%(arenaR-arenaL)),fy=arenaT+10+((i*89+31)%(arenaB-arenaT-10));ctx.fillStyle=['#ffdd57','#ff88aa','#ffffff','#ffaa88'][i%4];ctx.beginPath();ctx.arc(fx,fy,2.5,0,Math.PI*2);ctx.fill();}
    // 藤蔓绘制
    vinePatches.forEach(v=>{
      const va=1-v.age/v.life;
      ctx.fillStyle='rgba(34,100,34,0.55)';ctx.fillRect(v.x,v.y,v.w,v.h);
      // 藤蔓纹理
      ctx.strokeStyle='rgba(20,70,20,0.7)';ctx.lineWidth=1.5;
      for(let vy=v.y+4;vy<v.y+v.h;vy+=10){
        const sway=Math.sin(vy*0.3+Date.now()/800)*4;
        ctx.beginPath();ctx.moveTo(v.x+2,vy);ctx.quadraticCurveTo(v.x+v.w/2+sway,vy+5,v.x+v.w-2,vy);ctx.stroke();
      }
      // 棘刺
      ctx.fillStyle='rgba(60,20,20,0.6)';
      for(let i=0;i<5;i++){const sx=v.x+Math.random()*v.w,sy=v.y+Math.random()*v.h;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-3,sy-5);ctx.lineTo(sx+3,sy-5);ctx.closePath();ctx.fill();}
    });
  }else if(currentMap==='volcano'){
    const vt=Date.now()/3000;
    // 岩浆河
    if(lavaRiver){
      const lg=ctx.createLinearGradient(lavaRiver.x,lavaRiver.y,lavaRiver.x+lavaRiver.w,lavaRiver.y);
      lg.addColorStop(0,'rgba(200,40,10,0.7)');lg.addColorStop(0.15,'#ff4400');lg.addColorStop(0.3,'#ff8800');lg.addColorStop(0.5,'#ffcc00');lg.addColorStop(0.7,'#ff8800');lg.addColorStop(0.85,'#ff4400');lg.addColorStop(1,'rgba(200,40,10,0.7)');
      ctx.fillStyle=lg;ctx.fillRect(lavaRiver.x,lavaRiver.y,lavaRiver.w,lavaRiver.h);
      // 岩浆气泡
      const bt2=Date.now()/400;
      for(let i=0;i<12;i++){const bx2=lavaRiver.x+8+(i*37+bt2*19)%(lavaRiver.w-16),by2=lavaRiver.y+4+(Math.sin(bt2+i)*lavaRiver.h*0.4);ctx.fillStyle='rgba(255,255,100,0.6)';ctx.beginPath();ctx.arc(bx2,by2,2.5+Math.sin(bt2*3+i)*1.5,0,Math.PI*2);ctx.fill();}
      // 边缘
      ctx.strokeStyle='rgba(255,100,20,0.5)';ctx.lineWidth=2;ctx.strokeRect(lavaRiver.x,lavaRiver.y,lavaRiver.w,lavaRiver.h);
    }
    for(let i=0;i<6;i++){const cx=arenaL+((i*173+31)%(arenaR-arenaL)),cy=arenaB-10-((i*97+17)%(arenaB-arenaT)*0.5);const sg=ctx.createLinearGradient(cx-8,cy,cx+8,cy);sg.addColorStop(0,'rgba(255,120,20,0)');sg.addColorStop(0.5,'rgba(255,80,10,0.5)');sg.addColorStop(1,'rgba(255,120,20,0)');ctx.strokeStyle=sg;ctx.lineWidth=2+Math.sin(vt+i)*1;ctx.beginPath();ctx.moveTo(cx-10,cy);ctx.quadraticCurveTo(cx,cy-4+Math.sin(vt+i)*3,cx+10,cy);ctx.stroke();}
    for(let i=0;i<4;i++){const sx=arenaL+((i*191+Date.now()/200)%(arenaR-arenaL)),sy=arenaT+15+((i*137+Date.now()/300)%(arenaB-arenaT-15));ctx.fillStyle='rgba(255,150,30,0.4)';ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();}
  }else if(currentMap==='ice'){
    ctx.fillStyle='rgba(220,235,250,0.7)';ctx.fillRect(arenaL,arenaT+6,arenaR-arenaL,arenaB-arenaT-6);
    const it=Date.now()/2000;
    for(let i=0;i<8;i++){const ix=arenaL+((i*151+41)%(arenaR-arenaL)),iy=arenaT+15+((i*113+59)%(arenaB-arenaT-15));ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ix,iy-8);ctx.lineTo(ix+Math.sin(it+i)*2,iy);ctx.lineTo(ix,iy+8);ctx.moveTo(ix-8,iy);ctx.lineTo(ix,iy+Math.cos(it+i)*2);ctx.lineTo(ix+8,iy);ctx.stroke();}
    // 暴风雪龙卷风绘制
    blizzards.forEach(b=>{
      const ba=1-b.age/b.life;
      // 主体旋转雪花
      const bCount=16;
      for(let i=0;i<bCount;i++){
        const angle=b.angle+i*Math.PI*2/bCount;
        const dist=b.radius*(0.35+0.65*(i%3)/2);
        const sx2=b.x+Math.cos(angle)*dist,sy2=b.y+Math.sin(angle)*dist*0.7;
        ctx.fillStyle=`rgba(200,230,255,${0.3+ba*0.3})`;ctx.beginPath();ctx.arc(sx2,sy2,2+Math.random()*2,0,Math.PI*2);ctx.fill();
      }
      // 外圈旋风
      ctx.strokeStyle=`rgba(180,220,255,${0.4*ba})`;ctx.lineWidth=3;ctx.setLineDash([3,7]);ctx.lineDashOffset=-Date.now()/30;
      ctx.beginPath();ctx.arc(b.x,b.y,b.radius*0.7,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle=`rgba(255,255,255,${0.25*ba})`;ctx.lineWidth=1.5;ctx.setLineDash([2,5]);ctx.lineDashOffset=Date.now()/40;
      ctx.beginPath();ctx.arc(b.x,b.y,b.radius*1.05,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      // 中心冰晶
      ctx.fillStyle=`rgba(255,255,255,${0.7*ba})`;ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('❄️',b.x,b.y);
    });
  }else if(currentMap==='wind'){
    const wt=Date.now()/600;
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
    for(let i=0;i<18;i++){const wx=arenaL+(i*29+wt*40)%(arenaR-arenaL),wy=arenaT+8+(i*33)%(arenaB-arenaT-8);ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx+Math.cos(wt+i*0.7)*22,wy+Math.sin(wt+i*0.7)*8);ctx.stroke();}
    for(let i=0;i<5;i++){const lx=arenaL+(i*111+wt*60)%(arenaR-arenaL+60)-30,ly=arenaT+15+(i*67+Math.sin(wt+i)*30)%(arenaB-arenaT-15);ctx.fillStyle='rgba(180,160,100,0.5)';ctx.beginPath();ctx.ellipse(lx,ly,3,1.5,wt*0.3,0,Math.PI*2);ctx.fill();}
  }else{
    ctx.fillStyle='#c0b098';ctx.fillRect(arenaL,arenaT+6,arenaR-arenaL,arenaB-arenaT-6);
    ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;
    for(let y=arenaT+20;y<arenaB;y+=35)for(let x=arenaL+10;x<arenaR;x+=55){ctx.strokeRect(x,y,55,35);}
  }
  ctx.fillStyle='#5a3820';ctx.fillRect(arenaL-3,arenaT-2,arenaR-arenaL+6,2.5);
  for(let x=arenaL;x<=arenaR;x+=34){ctx.fillStyle='#4a2a10';ctx.fillRect(x-2.5,arenaT-6,5,14);ctx.fillStyle='#3a1a08';ctx.fillRect(x-1,arenaT-8,2,4);}
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.setLineDash([4,12]);ctx.strokeRect(arenaL,arenaT,arenaR-arenaL,arenaB-arenaT);ctx.setLineDash([]);
}

function mapTick(dt){
  if(currentMap==='grassland'){
    // 回血：2s间隔，每次回0.7HP（原2的35%）
    if(!mapTick._grassCD)mapTick._grassCD=0;
    mapTick._grassCD+=dt;
    while(mapTick._grassCD>=2000){mapTick._grassCD-=2000;
      animals.forEach(a=>{if(!a.dead){a.hp=Math.min(a.maxHp,a.hp+0.7);
        for(let i=0;i<2;i++)spawnSpark(a.x+(Math.random()-0.5)*a.size,a.y+(Math.random()-0.5)*a.size,1,2+Math.random()*2,['#5cb85c'],300,{vx:(Math.random()-0.5)*8,vy:-5-Math.random()*4});
      }});
    }
    // 藤蔓生成 (20-40秒随机，每片占1/12场地)
    if(!mapTick._vineCD)mapTick._vineCD=20000+Math.random()*20000;
    mapTick._vineCD-=dt;
    if(mapTick._vineCD<=0&&vinePatches.length<4){mapTick._vineCD=20000+Math.random()*20000;
      const segW=(arenaR-arenaL)/4,segH=(arenaB-arenaT)/3;
      const col=Math.floor(Math.random()*4),row=Math.floor(Math.random()*3);
      vinePatches.push({x:arenaL+col*segW+2,y:arenaT+row*segH+2,w:segW-4,h:segH-4,life:25000,age:0});
      showComment('🌿 藤蔓在草地上生长开来！','#336633');
    }
    vinePatches.forEach(v=>{v.age+=dt;if(v.age>=v.life)v.dead=true;});
    vinePatches=vinePatches.filter(v=>!v.dead);
    // 藤蔓减速效果
    vinePatches.forEach(v=>{
      animals.forEach(a=>{
        if(a.dead||a.stunned)return;
        const ax=a.x,ay=a.y,ar=a.size*0.6;
        if(ax+ar>v.x&&ax-ar<v.x+v.w&&ay+ar>v.y&&ay-ar<v.y+v.h){
          if(!a._vined){a._vined=true;a._vineTimer=8000;a.slowPct=0.4;a.slowed=true;a.slowTimer=8000;}
        }
      });
    });
    animals.forEach(a=>{
      if(a._vined){a._vineTimer-=dt;if(a._vineTimer<=0){a._vined=false;a.slowed=false;a.slowPct=0;}}
      if(a._vined&&!a.slowed){a.slowed=true;a.slowPct=0.4;a.slowTimer=Math.max(a.slowTimer,1000);}
    });
  }else if(currentMap==='volcano'){
    // 岩浆河伤害检测（每秒20%最大HP，贯穿全场）
    if(lavaRiver){
      animals.forEach(a=>{
        if(a.dead)return;
        const ax=a.x,ay=a.y,ar=a.size*0.55;
        if(ax+ar>lavaRiver.x&&ax-ar<lavaRiver.x+lavaRiver.w&&ay+ar>lavaRiver.y&&ay-ar<lavaRiver.y+lavaRiver.h){
          a.hp-=a.maxHp*0.2*dt/1000;
          a.flashTimer=50;
          if(Math.random()<0.3)spawnSpark(a.x+(Math.random()-0.5)*a.size,a.y+(Math.random()-0.5)*a.size,1,2+Math.random()*3,['#ff4400','#ff8800'],400,{vx:(Math.random()-0.5)*15,vy:-8-Math.random()*8});
          if(a.hp<=0){a.hp=0;a.dead=true;showComment(`🔥 ${a.emoji}${a.displayName} 掉进岩浆！`,'#ff4400');}
        }
      });
    }
    if(!mapTick._volCD)mapTick._volCD=0;
    mapTick._volCD+=dt;
    if(mapTick._volCD>=7000+Math.random()*5000){mapTick._volCD=0;
      const ex=arenaL+40+Math.random()*(arenaR-arenaL-80),ey=arenaT+35+Math.random()*(arenaB-arenaT-70);
      mapHazards.push({x:ex,y:ey,life:1500,age:0,radius:45,phase:'warning'});
      showComment('🌋火山即将喷发！','#ff6600');
      setTimeout(()=>{if(gameState!=='fighting')return;
        mapHazards.push({x:ex,y:ey,life:800,age:0,radius:48,phase:'erupt'});
        for(let j=0;j<16;j++)spawnSpark(ex,ey,2,4+Math.random()*10,['#ff4500','#ff8800','#ffaa00','#ffcc00'],1800,{vx:(Math.random()-0.5)*50,vy:-20-Math.random()*40});
        triggerShake(6,300);
        animals.forEach(a=>{if(!a.dead&&Math.hypot(a.x-ex,a.y-ey)<48){a.hp-=15;if(a.hp<=0){a.hp=0;a.dead=true;}a.stunned=true;a.stunTimer=500;a.flashTimer=180;spawnFX('damage',a.x,a.y-18,15,'#ff4500');for(let i=0;i<6;i++)spawnSpark(a.x,a.y,2,3+Math.random()*6,['#ff4500','#ff8800'],800,{vx:(Math.random()-0.5)*25,vy:(Math.random()-0.5)*20-10});}});
      },500);
    }
  }else if(currentMap==='ice'){
    if(!mapTick._iceSnow)mapTick._iceSnow=0;
    mapTick._iceSnow+=dt;
    if(mapTick._iceSnow>400){mapTick._iceSnow=0;mapParticles.push({x:Math.random()*(arenaR-arenaL)+arenaL,y:arenaT,life:5000,age:0});}
    // 暴风雪龙卷风 (40-60秒刷新)
    if(!mapTick._blizCD)mapTick._blizCD=40000+Math.random()*20000;
    mapTick._blizCD-=dt;
    if(mapTick._blizCD<=0&&blizzards.length<3){mapTick._blizCD=40000+Math.random()*20000;
      const bx2=arenaL+40+Math.random()*(arenaR-arenaL-80),by2=arenaT+30+Math.random()*(arenaB-arenaT-60);
      const spd=Math.min(...ANIMALS.map(a=>ANIMALS[a].speed))*60*0.5;
      const ang=Math.random()*Math.PI*2;
      blizzards.push({x:bx2,y:by2,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:15000,age:0,radius:40,angle:0});
      showComment('❄️ 暴风雪龙卷风来袭！','#88ccff');
    }
    blizzards.forEach(b=>{b.age+=dt;b.angle+=dt*0.003;if(b.age>=b.life)b.dead=true;
      // 移动逻辑：像动物一样碰墙反弹
      b.x+=b.vx*dt/1000;b.y+=b.vy*dt/1000;
      if(b.x-b.radius<arenaL){b.x=arenaL+b.radius;b.vx*=-1;}
      if(b.x+b.radius>arenaR){b.x=arenaR-b.radius;b.vx*=-1;}
      if(b.y-b.radius<arenaT){b.y=arenaT+b.radius;b.vy*=-1;}
      if(b.y+b.radius>arenaB){b.y=arenaB-b.radius;b.vy*=-1;}
      // 伤害：0.5% maxHP/s
      animals.forEach(a=>{if(a.dead)return;if(Math.hypot(a.x-b.x,a.y-b.y)<b.radius+a.size*0.4){a.hp-=a.maxHp*0.005*dt/1000;if(Math.random()<0.2)spawnSpark(a.x+(Math.random()-0.5)*a.size,a.y+(Math.random()-0.5)*a.size,1,2+Math.random()*3,SPARK_COLORS.ice,400,{vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*10-6});if(a.hp<=0){a.hp=0;a.dead=true;}}});
    });
    blizzards=blizzards.filter(b=>!b.dead);
  }else if(currentMap==='wind'){
    windTimer+=dt;
    if(windTimer>=windInterval){windTimer=0;
      const a=Math.random()*Math.PI*2;windDir={x:Math.cos(a),y:Math.sin(a)};
      spawnFX('text',W/2,arenaT+35,'风向→','#ffdd57');
      for(let i=0;i<8;i++)spawnSpark(W/2,arenaT+40,1,3+Math.random()*5,['#ffdd57','#ffe080'],800,{vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*25-10});
    }
  }
  mapParticles.forEach(p=>{p.age+=dt;p.y+=(currentMap==='ice'?0.4:1)*dt/1000;if(p.age>=p.life)p.dead=true;});
  mapParticles=mapParticles.filter(p=>!p.dead);
  mapHazards.forEach(h=>{h.age+=dt;if(h.age>=h.life)h.dead=true;});
  mapHazards=mapHazards.filter(h=>!h.dead);
}

const EGG_CFG={emoji:'🥚',name:'蛋',incubateTime:18000,hp:5,size:27,color:'#fff8e0'};
class Egg{
  constructor(x,y,owner){this.x=x;this.y=y;this.owner=owner;this.hp=EGG_CFG.hp;this.maxHp=this.hp;this.accTime=0;this.incubateTime=EGG_CFG.incubateTime;this.flashTimer=0;this.hitCD=0;this.dead=false;this.bobOff=0;}
  get size(){return EGG_CFG.size;}
  update(dt){if(this.dead)return;this.accTime+=dt;this.bobOff=Math.sin(this.accTime/400)*1.5;if(this.hitCD>0)this.hitCD-=dt;if(this.flashTimer>0)this.flashTimer-=dt;if(this.accTime>=this.incubateTime){this.dead=true;const cfg={...CHICK_CFG};const chick=new Animal(cfg,this.x,this.owner.team,this.owner);chick.x=this.x;chick.y=this.y;chick._chickPhase=0;chick._chickTimer=0;chick.displayName='小鸡';chick.emoji='🐤';chick.isMinion=true;chick.ranged=false;animals.push(chick);spawnFX('text',this.x,this.y-16,'孵化!🐤','#ffd700',1.2);showComment('🐤 小鸡破壳而出！','#ffd700');}}
  takeDmg(dmg){if(this.hitCD>0)return;this.hp-=dmg;this.flashTimer=100;this.hitCD=350;spawnFX('damage',this.x,this.y-8,dmg,'#ff9966');if(this.hp<=0){this.hp=0;this.dead=true;spawnFX('text',this.x,this.y-10,'蛋碎了!','#ff6b6b',1.1);}}
  draw(ctx){
    if(this.dead)return;const s=this.size;
    // 地面阴影
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(this.x,this.y+s*0.12,s*0.32,s*0.07,0,0,Math.PI*2);ctx.fill();

    const eggGrad=ctx.createRadialGradient(this.x-s*0.06,this.y-s*0.04+this.bobOff,s*0.02,this.x,this.y+this.bobOff,s*0.28);
    eggGrad.addColorStop(0,'#ffffff');eggGrad.addColorStop(0.3,'#fffef5');eggGrad.addColorStop(0.6,'#fff8e0');eggGrad.addColorStop(0.85,'#f0e8c8');eggGrad.addColorStop(1,'#d8c898');
    ctx.fillStyle=eggGrad;
    ctx.beginPath();ctx.ellipse(this.x,this.y+this.bobOff,s*0.26,s*0.30,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(180,160,120,0.5)';ctx.lineWidth=1.5;ctx.stroke();
    // 高光
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.ellipse(this.x-s*0.07,this.y-s*0.07+this.bobOff,s*0.08,s*0.05,-0.3,0,Math.PI*2);ctx.fill();
    // 受击红闪
    if(this.flashTimer>0){ctx.fillStyle=`rgba(255,80,80,${0.3*this.flashTimer/100})`;ctx.beginPath();ctx.ellipse(this.x,this.y+this.bobOff,s*0.26,s*0.30,0,0,Math.PI*2);ctx.fill();}
    // 横进度条（蛋正上方，不重叠）
    const pbw=s*1.8,pbh=3.5,px=this.x-pbw/2,py=this.y-s*0.55;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(px-1,py-1,pbw+2,pbh+2);

    const prog=this.accTime/this.incubateTime;ctx.fillStyle=prog>0.7?'#5cb85c':prog>0.3?'#f0ad4e':'#d9534f';
    ctx.fillRect(px,py,pbw*prog,pbh);
    ctx.font='bold 7px "PingFang SC"';ctx.fillStyle='#fff';ctx.fillText(Math.round(prog*100)+'%',this.x,py-5);
  }
}

// ==================== 特效系统 ====================
function spawnSpark(x,y,count,life,colors,lifeMs,vel={vx:0,vy:0}){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2;const sp=3+Math.random()*life;effects.push({type:'spark',x,y,life:lifeMs,age:0,dead:false,data:{dx:Math.cos(a)*sp,dy:Math.sin(a)*sp,size:2+Math.random()*2,vx:vel.vx||0,vy:vel.vy||0,color:colors[Math.floor(Math.random()*colors.length)]}});}}
function spawnDust(x,y,radius,color,lifeMs,vel={vx:0,vy:0}){effects.push({type:'dust',x,y,life:lifeMs,age:0,dead:false,data:{radius,color,vx:vel.vx||0,vy:vel.vy||0}});}
function spawnFX(type,x,y,data,color,scale=1){const life=type==='ring'?(data.life||600):type==='projectile'?1500:3000;effects.push({type,x,y,data,color,scale,life,age:0,dead:false});}

function updateFX(dt){effects.forEach(e=>{e.age+=dt;if(e.age>=e.life){e.dead=true;return;}switch(e.type){case'damage':e.y-=32*dt/1000;break;case'text':e.y-=24*dt/1000;break;case'spark':if(e.data.vx!==undefined||e.data.vy!==undefined){e.x+=(e.data.vx||0)*dt/1000;e.y+=(e.data.vy||0)*dt/1000;}break;case'dust':if(e.data.vx!==undefined||e.data.vy!==undefined){e.x+=(e.data.vx||0)*dt/1000;e.y+=(e.data.vy||0)*dt/1000;}break;case'ring':break;case'projectile':if(e.data.target&&!e.data.target.dead){const t=e.data.target,dx=t.x-e.x,dy=t.y-e.y,dist=Math.sqrt(dx*dx+dy*dy)||1,sp=e.data.speed*60;e.x+=(dx/dist)*sp*dt/1000;e.y+=(dy/dist)*sp*dt/1000;if(dist<t.size*0.8){t.hp-=e.data.damage;if(t.hp<=0){t.hp=0;t.dead=true;}t.flashTimer=100;spawnFX('damage',t.x,t.y-16,e.data.damage,'#f4a460');e.dead=true;}}else if(e.data.vx!==undefined){e.x+=e.data.vx*dt/1000;e.y+=e.data.vy*dt/1000;if(e.x<arenaL-20||e.x>arenaR+20||e.y<arenaT-20||e.y>arenaB+20)e.dead=true;const nearby=animals.filter(a=>a.team!==e.data._team&&!a.dead&&Math.hypot(a.x-e.x,a.y-e.y)<a.size+8);if(nearby.length>0){const t=nearby[0];t.hp-=Math.round(e.data.damage*0.5)||3;t.flashTimer=100;spawnFX('damage',t.x,t.y-16,Math.round(e.data.damage*0.5)||3,'#999');e.dead=true;}}else{e.dead=true;}break;}});effects=effects.filter(e=>!e.dead);groundCracks.forEach(c=>{c.age+=dt;if(c.age>=c.life)c.dead=true;});groundCracks=groundCracks.filter(c=>!c.dead);}

function drawFX(ctx){groundCracks.forEach(c=>{const a=1-c.age/c.life;ctx.strokeStyle=`rgba(139,90,43,${a*0.6})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+Math.cos(c.angle)*c.len,c.y+Math.sin(c.angle)*c.len);ctx.stroke();});mapHazards.forEach(h=>{if(h.phase==='warning'){const wAlpha=0.3+Math.sin(Date.now()/100)*0.3;ctx.fillStyle=`rgba(255,80,0,${wAlpha})`;ctx.beginPath();ctx.arc(h.x,h.y,h.radius*0.3,0,Math.PI*2);ctx.fill();}else{const a=1-h.age/h.life;const g=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.radius*a);g.addColorStop(0,'rgba(255,180,40,0.7)');g.addColorStop(0.5,'rgba(255,60,10,0.4)');g.addColorStop(1,'rgba(255,20,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(h.x,h.y,h.radius*a,0,Math.PI*2);ctx.fill();}});mapParticles.forEach(p=>{const a=1-p.age/p.life;ctx.fillStyle=`rgba(255,255,255,${a*0.5})`;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();});effects.forEach(e=>{const a=Math.max(0,1-e.age/e.life);ctx.globalAlpha=a;switch(e.type){case'damage':ctx.font=`bold ${Math.round(18*e.scale)}px "PingFang SC"`;ctx.fillStyle=e.color;ctx.textAlign='center';ctx.fillText(`-${e.data}`,e.x,e.y);break;case'text':ctx.font=`bold ${Math.round(14*e.scale)}px "PingFang SC"`;ctx.fillStyle=e.color;ctx.textAlign='center';ctx.fillText(e.data,e.x,e.y);break;case'projectile':ctx.font='16px serif';ctx.textAlign='center';ctx.fillText(e.data.emoji,e.x,e.y);break;case'spark':{const sp=1-e.age/e.life;const sx=e.x+e.data.dx*(1-sp),sy=e.y+e.data.dy*(1-sp),ex=e.x+e.data.dx,ey=e.y+e.data.dy;ctx.strokeStyle=e.data.color;ctx.lineWidth=e.data.size*sp;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle=e.data.color;ctx.globalAlpha=a*0.8;ctx.beginPath();ctx.arc(ex,ey,e.data.size*0.6,0,Math.PI*2);ctx.fill();}break;case'dust':{const dprog=e.age/e.life,dr=e.data.radius*(0.5+0.5*dprog);const dgrad=ctx.createRadialGradient(e.x,e.y,dr*0.1,e.x,e.y,dr);dgrad.addColorStop(0,e.data.color);dgrad.addColorStop(1,'transparent');ctx.fillStyle=dgrad;ctx.globalAlpha=a*0.6;ctx.beginPath();ctx.arc(e.x,e.y,dr,0,Math.PI*2);ctx.fill();}break;case'ring':{const prog=e.age/e.life,r=e.data.maxRadius*prog;ctx.strokeStyle=e.data.color||e.color;ctx.lineWidth=4*(1-prog);ctx.globalAlpha=a*0.5;ctx.beginPath();if(e.data.jagged){for(let i=0;i<24;i++){const aa=Math.PI*2/24*i,jr=r*(0.8+Math.random()*0.2);i===0?ctx.moveTo(e.x+Math.cos(aa)*jr,e.y+Math.sin(aa)*jr):ctx.lineTo(e.x+Math.cos(aa)*jr,e.y+Math.sin(aa)*jr);}ctx.closePath();}else{ctx.arc(e.x,e.y,r,0,Math.PI*2);}ctx.stroke();}break;}ctx.globalAlpha=1;});}

// ==================== 主循环 ====================
function loop(ts){
  if(!lastTime)lastTime=ts;let dt=Math.min(ts-lastTime,100)*gameSpeed;lastTime=ts;
  ctx.clearRect(0,0,W,H);
  if(shakeTimer>0){shakeTimer-=dt;const r=shakeIntensity*(shakeTimer/shakeMax);shakeX=(Math.random()-0.5)*r*2;shakeY=(Math.random()-0.5)*r*2;if(shakeTimer<=0){shakeX=0;shakeY=0;shakeIntensity=0;}}
  ctx.save();if(shakeX||shakeY)ctx.translate(shakeX,shakeY);
  drawBG(ctx);
  if(gameState==='fighting'){
    mapTick(dt);animals.forEach(a=>a.update(dt));eggs.forEach(e=>e.update(dt));items.forEach(it=>it.update(dt));
    items=items.filter(it=>!it.dead);updateFX(dt);commentLog.forEach(c=>c.age+=dt);
    itemSpawnCD-=dt;if(itemSpawnCD<=0&&items.length<3){const ix=arenaL+40+Math.random()*(arenaR-arenaL-80),iy=arenaT+30+Math.random()*(arenaB-arenaT-60);items.push(new Item(ix,iy));itemSpawnCD=20000+Math.random()*20000;}
    animals.forEach(a=>{a.dotEffects.forEach(d=>{d.elapsed+=dt;d.tickAcc+=dt;if(d.tickAcc>=d.tick){d.tickAcc-=d.tick;let tickDmg=d.dmg;const sd=a.passives.find(p=>p.type==='shellDefense');if(sd){const sdReduce=(1-a.hp/a.maxHp)*sd.maxReduce;tickDmg=Math.round(tickDmg*(1-sdReduce));}tickDmg=Math.max(1,tickDmg);a.hp-=tickDmg;if(a.hp<=0){a.hp=0;a.dead=true;}spawnFX('damage',a.x+(Math.random()-0.5)*12,a.y-12,tickDmg,'#e74c3c');}});a.dotEffects=a.dotEffects.filter(d=>d.elapsed<d.dur);});
    const alive=animals.filter(a=>!a.dead);
    for(const it of items){if(it.dead)continue;for(const a of alive){if(Math.hypot(a.x-it.x,a.y-(it.y+it.bob))<a.size+14){it.type.apply(a);it.dead=true;break;}}}
    alive.forEach(a=>{const tram=a.passives.find(p=>p.type==='trample');if(!tram||a.stunned)return;const victims=alive.filter(e=>!e.dead&&e!==a&&e.size<a.size*0.7&&Math.hypot(e.x-a.x,e.y-a.y)<tram.radius);victims.forEach(v=>{v.hp-=tram.dps*dt/1000;v.flashTimer=50;if(v.hp<=0){v.hp=0;v.dead=true;}});});
    for(let i=0;i<alive.length;i++){for(let j=i+1;j<alive.length;j++){const a=alive[i],b=alive[j];if(a.team===b.team)continue;const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)||1;const bodyDist=a.size+b.size;if(dist<bodyDist){const ov=bodyDist-dist,nx=dx/dist,ny=dy/dist;a.x-=nx*ov*0.5;a.y-=ny*ov*0.5;b.x+=nx*ov*0.5;b.y+=ny*ov*0.5;if(!a.isMinion||a._chickPhase>=2||!a.owner||a.owner.dead){a._newDir();a.recoilTimer=RECOIL_TIME;}if(!b.isMinion||b._chickPhase>=2||!b.owner||b.owner.dead){b._newDir();b.recoilTimer=RECOIL_TIME;}}const atkDist=bodyDist+8;if(!a.dead&&!b.dead&&dist<atkDist){if(a.atkTimer<=0&&!a.ranged&&!a.stunned&&(a.recoilTimer<=0||a.divePhase>0)&&!(a._chickPhase===0)&&!a._hibernateV2){a.dealDmg(b);a.atkTimer=a.passives.some(p=>p.type==='frenzyCombo')?(a.hp/a.maxHp<0.3?700:a.hp/a.maxHp<0.7?900:1050):ATK_CD;}if(!b.dead&&b.atkTimer<=0&&!b.ranged&&!b.stunned&&(b.recoilTimer<=0||b.divePhase>0)&&!(b._chickPhase===0)&&!b._hibernateV2){b.dealDmg(a);b.atkTimer=b.passives.some(p=>p.type==='frenzyCombo')?(b.hp/b.maxHp<0.3?700:b.hp/b.maxHp<0.7?900:1050):ATK_CD;}}if(!a.dead&&!b.dead){if(!a.stunned&&!(a._chickPhase===0)&&!a._hibernateV2){if(a.ranged&&a.rangedTimer<=0&&dist<(a.rangedRange||160))a.rangedAttack(b);}if(!b.dead&&!b.stunned&&!(b._chickPhase===0)&&!b._hibernateV2){if(b.ranged&&b.rangedTimer<=0&&dist<(b.rangedRange||160))b.rangedAttack(a);}}}}
    alive.forEach(a=>{if(a.dead||a.stunned||a._hibernateV2)return;if(a.isMinion&&!a._canLay)return;const enemies=alive.filter(e=>e!==a&&!e.dead);a.skills.forEach(s=>{if(s.cdTimer<=0)a.useSkill(s,enemies);});});
    for(const egg of eggs){if(egg.dead)continue;for(const a of alive){if(a.team===egg.owner.team||a.dead||a.stunned)continue;if(Math.hypot(a.x-egg.x,a.y-egg.y)<a.size+egg.size){egg.takeDmg(a.effDmg());if(egg.dead)break;}}}
    animals=animals.filter(a=>!a.dead);eggs=eggs.filter(e=>!e.dead);const al2=animals.filter(a=>!a.dead);const hasEgg=eggs.some(e=>!e.dead);
    const allSameTeam=al2.length>0&&al2.every(a=>a.team===al2[0].team);
    if((al2.length<=1&&!hasEgg)||(al2.length>1&&allSameTeam&&!hasEgg)){gameState='ended';if(al2.length>0){const nonMinion=al2.find(a=>!a.isMinion)||al2[0];winner=nonMinion;}else winner=null;document.getElementById('bf').disabled=false;if(winner){showComment(`🏆 ${winner.emoji}${winner.displayName} 成为最后幸存者！`,'#ffd700');showToast(`🏆 ${winner.displayName} 获胜！`,5000);}else{showComment('⚔️ 平局！无人生还','#aaa');}}
  }
  eggs.forEach(e=>e.draw(ctx));animals.forEach(a=>a.draw(ctx));items.forEach(it=>it.draw(ctx));drawFX(ctx);
  if(gameState==='ended'){const alpha=0.5+Math.sin(Date.now()/500)*0.3;ctx.globalAlpha=alpha;ctx.font='bold 26px "PingFang SC"';ctx.fillStyle='#ffd700';ctx.textAlign='center';if(winner)ctx.fillText(`${winner.emoji}${winner.displayName}获胜!`,W/2,H/2-8);else ctx.fillText('平局!',W/2,H/2-8);ctx.globalAlpha=1;}
  if(gameState==='idle'){ctx.globalAlpha=0.28;ctx.font='bold 14px "PingFang SC"';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('选择动物，点击开始对战',W/2,H/2);ctx.globalAlpha=1;}
  ctx.restore();frameId=requestAnimationFrame(loop);
}

// ==================== UI ====================
const CIRCLES=['①','②','③','④','⑤','⑥'];
function populateUI(){const asel=document.getElementById('asel'),keys=Object.keys(ANIMALS);asel.innerHTML='';keys.forEach(k=>{const a=ANIMALS[k];asel.innerHTML+=`<option value="${k}">${a.emoji}${a.name}</option>`;});const msel=document.getElementById('msel');msel.innerHTML='';Object.keys(MAPS).forEach(k=>{msel.innerHTML+=`<option value="${k}">${MAPS[k].name}</option>`;});msel.value='colosseum';}
function renderTags(){const container=document.getElementById('tags');if(selectedAnimals.length===0){container.innerHTML='<span class="mute-tag">未选择动物(最少2只)</span>';return;}container.innerHTML=selectedAnimals.map((k,i)=>{const a=ANIMALS[k];let name=a.name;const sameKind=selectedAnimals.filter(x=>x===k).length;if(sameKind>1){let idx=0;for(let j=0;j<=i;j++)if(selectedAnimals[j]===k)idx++;name=a.name+CIRCLES[idx-1];}return `<span class="tag" onclick="removeAnimal(${i})">${a.emoji}${name}<span class="x">×</span></span>`;}).join('');}
function addAnimal(){if(selectedAnimals.length>=6)return;const k=document.getElementById('asel').value;selectedAnimals.push(k);renderTags();}
function removeAnimal(i){selectedAnimals.splice(i,1);renderTags();}
function randBattle(){const keys=Object.keys(ANIMALS);const count=2+Math.floor(Math.random()*5);selectedAnimals=[];for(let i=0;i<count;i++)selectedAnimals.push(keys[Math.floor(Math.random()*keys.length)]);renderTags();}
function getArenaScale(count){if(count<=3)return 1;if(count<=5)return 1.25;return 1.5;}
function startBattle(){
  if(selectedAnimals.length<2)return;currentMap=document.getElementById('msel').value;
  const count=selectedAnimals.length;arenaScale=getArenaScale(count);resize(arenaScale);initGrass();
  const nameCount={};animals=[];const cx=arenaL+(arenaR-arenaL)/2,cy=arenaT+(arenaB-arenaT)/2;const spawnR=Math.min(arenaR-arenaL,arenaB-arenaT)*0.35;
  for(let i=0;i<selectedAnimals.length;i++){const k=selectedAnimals[i];nameCount[k]=(nameCount[k]||0)+1;const cfg=ANIMALS[k];let dn=cfg.name;const sameKind=selectedAnimals.filter(x=>x===k).length;if(sameKind>1)dn=cfg.name+CIRCLES[nameCount[k]-1];const a=new Animal(cfg,0,i);a.displayName=dn;a.name=dn;const angle=Math.PI*2/count*i-Math.PI/2;a.x=cx+Math.cos(angle)*spawnR;a.y=cy+Math.sin(angle)*spawnR*0.7;animals.push(a);}
  eggs=[];effects=[];items=[];gameState='fighting';winner=null;lastTime=0;groundCracks=[];mapHazards=[];mapParticles=[];vinePatches=[];blizzards=[];commentLog=[];
  itemSpawnCD=20000+Math.random()*20000;windTimer=0;windDir={x:1,y:0};mapTick._grassCD=0;mapTick._volCD=0;mapTick._vineCD=20000+Math.random()*20000;mapTick._blizCD=40000+Math.random()*20000;
  // 火山：开局生成贯穿岩浆河
  if(currentMap==='volcano'){
    const lavaW=(arenaR-arenaL)/5;
    const lavaX=arenaL+Math.random()*(arenaR-arenaL-lavaW);
    lavaRiver={x:lavaX,y:arenaT+8,w:lavaW,h:arenaB-arenaT-16};
  }else{lavaRiver=null;}
  document.getElementById('bf').disabled=true;
  showComment(`⚔️ 大乱斗开始！${count}只动物争夺生存权`,'#ffd700');showToast('⚔️ 战斗开始！',2000);
}
function resetBattle(){animals=[];eggs=[];effects=[];items=[];gameState='idle';winner=null;lastTime=0;groundCracks=[];mapHazards=[];mapParticles=[];vinePatches=[];blizzards=[];commentLog=[];lavaRiver=null;arenaScale=1;resize(1);initGrass();document.getElementById('bf').disabled=false;updateCommentBar();}
populateUI();
document.getElementById('bf').addEventListener('click',startBattle);document.getElementById('bx').addEventListener('click',resetBattle);document.getElementById('br').addEventListener('click',()=>{randBattle();resetBattle();});document.getElementById('badd').addEventListener('click',addAnimal);
document.querySelectorAll('.speed-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.speed-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');gameSpeed=parseInt(b.dataset.s);}));
document.addEventListener('keydown',e=>{switch(e.key.toLowerCase()){case' ':e.preventDefault();if(gameState==='fighting')resetBattle();startBattle();break;case'r':resetBattle();break;case'f':randBattle();resetBattle();break;case'1':setSpd(1);break;case'2':setSpd(2);break;case'3':setSpd(3);break;case'4':setSpd(4);break;case'5':setSpd(5);break;case'6':setSpd(6);break;case'7':setSpd(7);break;case'8':setSpd(8);break;}});
function setSpd(s){gameSpeed=s;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.s)===s));}
frameId=requestAnimationFrame(loop);
</script>
