<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动物大战 v0.3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#3a2f28;display:flex;flex-direction:column;align-items:center;
    min-height:100vh;font-family:'PingFang SC','Microsoft YaHei',sans-serif;
    user-select:none;-webkit-user-select:none;padding:6px;touch-action:manipulation;
  }
  .title{color:#f5deb3;font-size:clamp(16px,3.5vw,20px);margin:2px 0;letter-spacing:2px}
  #game{border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.5);max-width:100%;display:block}
  .panel{
    margin-top:6px;background:#4a3828;border-radius:10px;padding:8px 10px;
    display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,0.3);
    width:100%;max-width:420px;
  }
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
  .row label{color:#d4c5b2;font-size:12px;white-space:nowrap;min-width:30px}
  .row select{
    flex:1;min-width:70px;padding:7px 4px;border-radius:6px;
    border:1px solid #6b5a48;background:#5c4a38;color:#f5deb3;
    font-size:13px;font-family:inherit;-webkit-appearance:none;text-align:center;
  }
  .vs-text{color:#e8a87c;font-weight:bold;font-size:14px}
  .btn{
    padding:9px 12px;border-radius:7px;border:none;cursor:pointer;
    font-size:13px;font-family:inherit;font-weight:bold;transition:all 0.15s;
    white-space:nowrap;-webkit-tap-highlight-color:transparent;min-height:40px;
  }
  .btn:active{transform:scale(0.95)}
  .btn-fight{background:linear-gradient(135deg,#d4745c,#b8533f);color:#fff;font-size:15px;padding:10px 20px;flex:1}
  .btn-reset{background:#5c4a38;color:#c4b5a2}
  .btn-random{background:linear-gradient(135deg,#7b6b5a,#5c4a38);color:#f5deb3}
  .speed-btn{
    padding:5px 10px;border-radius:5px;border:1px solid #6b5a48;
    background:transparent;color:#a09080;cursor:pointer;font-size:12px;font-family:inherit;
  }
  .speed-btn.active{background:#e8a87c;color:#3a2f28;border-color:#e8a87c;font-weight:bold}
  .info{color:#8a7a6a;font-size:10px;text-align:center;letter-spacing:1px;margin-top:2px}
</style>
</head>
<body>
<div class="title">⚔️ 动物大战</div>
<canvas id="game"></canvas>
<div class="panel">
  <div class="row">
    <label>🔴</label><select id="ls"></select>
    <span class="vs-text">VS</span>
    <label>🔵</label><select id="rs"></select>
  </div>
  <div class="row">
    <button class="btn btn-random" id="br">🎲随机</button>
    <button class="btn btn-fight" id="bf">⚡开始</button>
    <button class="btn btn-reset" id="bx">🔄重置</button>
  </div>
  <div class="row">
    <span style="color:#8a7a6a;font-size:11px">速度:</span>
    <button class="speed-btn" data-s="1">1x</button>
    <button class="speed-btn active" data-s="2">2x</button>
    <button class="speed-btn" data-s="3">3x</button>
  </div>
</div>
<div class="info">v0.3 · 空格开始 R重置 F随机 1-3调速</div>

<script>
// ==================== 画布 ====================
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,arenaL,arenaR,arenaT,arenaB;

function resize(){
  const mw=Math.min(window.innerWidth-16,420),ratio=1.55;
  canvas.width=mw;canvas.height=Math.floor(mw*ratio);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.style.width=mw+'px';canvas.style.height=Math.floor(mw*ratio)+'px';
  if(dpr>1){canvas.width=mw*dpr;canvas.height=Math.floor(mw*ratio)*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  W=mw;H=Math.floor(mw*ratio);
  // 竞技场边界(比画布小一圈)
  arenaL=30;arenaR=W-30;arenaT=65;arenaB=H-30;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,300));
resize();

// ==================== 静态背景元素(只生成一次) ====================
let grassSpots=[];
function initGrass(){
  grassSpots=[];
  const rng=(s)=>{let x=Math.sin(s)*10000;return x-Math.floor(x);};
  for(let i=0;i<30;i++){
    const gx=arenaL+rng(i*7+1)*(arenaR-arenaL);
    const gy=arenaB-rng(i*13+3)*20;
    grassSpots.push({x:gx,y:gy,r:6+rng(i*17+5)*8});
  }
}

function drawBG(ctx){
  // 天空——纯静态暖黄昏
  const sky=ctx.createLinearGradient(0,0,0,arenaT+20);
  sky.addColorStop(0,'#d4c5a0');sky.addColorStop(1,'#c4b590');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // 地面
  ctx.fillStyle='#8a7a58';ctx.fillRect(0,arenaT+10,W,H-arenaT-10);
  const gnd=ctx.createLinearGradient(0,arenaT+10,0,H);
  gnd.addColorStop(0,'#8a7a58');gnd.addColorStop(0.5,'#7a6a48');gnd.addColorStop(1,'#5a4a30');
  ctx.fillStyle=gnd;ctx.fillRect(0,arenaT+10,W,H-arenaT-10);

  // 静态草丛
  ctx.fillStyle='#7a9a50';
  grassSpots.forEach(g=>{ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();});

  // 围栏
  ctx.fillStyle='#6b4a30';
  ctx.fillRect(arenaL-4,arenaT,arenaR-arenaL+8,3);
  ctx.fillRect(arenaL-4,arenaT+4,arenaR-arenaL+8,2);
  // 围栏柱
  for(let x=arenaL;x<=arenaR;x+=40){
    ctx.fillRect(x-2,arenaT-4,4,16);
  }

  // 竞技场边界虚线(提示活动范围)
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
  ctx.setLineDash([4,8]);
  ctx.strokeRect(arenaL,arenaT,arenaR-arenaL,arenaB-arenaT);
  ctx.setLineDash([]);
}

// ==================== 动物数据(降速+重平衡) ====================
const ANIMALS={
  chicken:{
    id:'chicken',name:'母鸡',emoji:'🐔',
    hp:100,speed:0.55,damage:5,atkRange:34,size:22,
    color:'#f4a460',desc:'啄击·远程撒米·下蛋孵化',
    ranged:true,rangedDmg:9,rangedCD:2800,rangedRange:130,rangedEmoji:'🍚',rangedSpeed:5,
    skills:[{name:'下蛋',emoji:'🥚',cd:9000,type:'lay_egg',desc:'下蛋→孵出小鸡跟随'}]
  },
  bear:{
    id:'bear',name:'棕熊',emoji:'🐻',
    hp:160,speed:0.4,damage:16,atkRange:46,size:30,
    color:'#8B7355',desc:'高伤·眩晕拍击',
    skills:[{name:'眩晕拍击',emoji:'💫',cd:7000,type:'stun',duration:1800,desc:'下次攻击眩晕1.8秒'}]
  },
  wolf:{
    id:'wolf',name:'狼',emoji:'🐺',
    hp:105,speed:0.75,damage:8,atkRange:40,size:23,
    color:'#a0a0a0',desc:'高速·流血撕咬',
    skills:[{name:'流血撕咬',emoji:'🩸',cd:5500,type:'bleed',damage:5,duration:3500,tickInterval:700,desc:'命中后流血3.5秒'}]
  },
  bull:{
    id:'bull',name:'公牛',emoji:'🐂',
    hp:150,speed:0.45,damage:11,atkRange:42,size:28,
    color:'#c4a882',desc:'皮厚·冲锋击退',
    skills:[{name:'冲锋',emoji:'💨',cd:6000,type:'charge',damage:20,knockback:10,desc:'猛冲20伤+击退'}]
  },
  eagle:{
    id:'eagle',name:'鹰',emoji:'🦅',
    hp:80,speed:0.7,damage:12,atkRange:42,size:22,
    color:'#f5f5f5',desc:'高速高伤·俯冲暴击',
    skills:[{name:'俯冲暴击',emoji:'⚡',cd:5000,type:'crit',multiplier:2.3,desc:'下次攻击2.3倍伤害'}]
  },
  snake:{
    id:'snake',name:'蛇',emoji:'🐍',
    hp:90,speed:0.55,damage:7,atkRange:36,size:21,
    color:'#5dade2',desc:'灵活·毒液注入',
    skills:[{name:'毒液',emoji:'🧪',cd:4200,type:'poison',damage:5,duration:4500,tickInterval:900,desc:'命中后中毒4.5秒'}]
  },
  lion:{
    id:'lion',name:'狮子',emoji:'🦁',
    hp:125,speed:0.5,damage:13,atkRange:44,size:27,
    color:'#e8a87c',desc:'均衡·咆哮减益',
    skills:[{name:'咆哮',emoji:'🦁',cd:6500,type:'roar',weakenPct:0.4,duration:3000,desc:'咆哮降敌40%攻击3秒'}]
  },
  elephant:{
    id:'elephant',name:'大象',emoji:'🐘',
    hp:200,speed:0.35,damage:13,atkRange:48,size:34,
    color:'#b0a090',desc:'血牛·地动山摇',
    skills:[{name:'地动山摇',emoji:'🌍',cd:9000,type:'quake',damage:12,stunDuration:2000,desc:'AOE12伤+眩晕2秒'}]
  },
  turtle:{
    id:'turtle',name:'乌龟',emoji:'🐢',
    hp:120,speed:0.3,damage:6,atkRange:32,size:22,
    color:'#6b8e6b',desc:'慢速高防·缩壳',
    skills:[{name:'缩壳',emoji:'🐢',cd:8000,type:'shield',reducePct:0.7,duration:3000,desc:'减伤70%持续3秒'}]
  }
};

// 小鸡帮手——跟随母鸡,不自主移动
const MINION_CFG={
  name:'小鸡',emoji:'🐔',hp:40,speed:0.45,
  damage:4,atkRange:32,size:15,color:'#f4c460',
  isMinion:true,ranged:false
};

// ==================== 状态 ====================
let gameSpeed=2,animals=[],eggs=[],effects=[],gameState='idle',winner=null,lastTime=0,frameId=null;

// ==================== 动物类 ====================
class Animal{
  constructor(cfg,x,team,owner=null){
    Object.assign(this,cfg);this.maxHp=cfg.hp;
    this.x=x;this.y=arenaT+(arenaB-arenaT)*(0.25+Math.random()*0.5);
    this.team=team;this.owner=owner;
    // 统一降速: 基础速度×50
    const spd=cfg.speed*50*(0.8+Math.random()*0.4);
    this.vx=(team===0?1:-1)*spd;this.vy=(Math.random()-0.5)*spd;
    this.atkTimer=Math.random()*ATK_CD;this.dirTimer=Math.random()*DIR_MAX;
    this.stunned=false;this.stunTimer=0;this.flashTimer=0;this.dead=false;
    this.skills=(cfg.skills||[]).map(s=>({...s,cdTimer:Math.random()*s.cd*0.4}));
    this.rangedTimer=cfg.ranged?Math.random()*cfg.rangedCD:99999;
    this.dotEffects=[];this.shieldActive=false;this.shieldTimer=0;this.shieldReduce=0;
    this.weakenPct=0;this.weakenTimer=0;
    this.critNext=false;this.stunNext=false;this.bleedNext=false;this.poisonNext=false;this.chargeReady=false;
    // 跟随偏移(小鸡用)
    this.followOffsetX=(Math.random()-0.5)*40;this.followOffsetY=(Math.random()-0.5)*30;
  }

  update(dt){
    if(this.dead)return;const rd=dt;
    if(this.stunned){this.stunTimer-=rd;if(this.stunTimer<=0)this.stunned=false;return;}
    if(this.shieldActive){this.shieldTimer-=rd;if(this.shieldTimer<=0){this.shieldActive=false;this.shieldReduce=0;}}
    if(this.weakenTimer>0){this.weakenTimer-=rd;if(this.weakenTimer<=0)this.weakenPct=0;}
    if(this.flashTimer>0)this.flashTimer-=rd;
    if(this.atkTimer>0)this.atkTimer-=rd;
    if(this.rangedTimer>0)this.rangedTimer-=rd;
    this.skills.forEach(s=>{if(s.cdTimer>0)s.cdTimer-=rd;});

    // 移动逻辑
    if(this.isMinion&&this.owner&&!this.owner.dead){
      this._followOwner(); // 小鸡跟随妈妈
    }else{
      this.dirTimer-=rd;
      if(this.dirTimer<=0){this._newDir();this.dirTimer=DIR_MIN+Math.random()*(DIR_MAX-DIR_MIN);}
      this._wallBounce();
    }

    this.x+=this.vx*rd/1000;this.y+=this.vy*rd/1000;
    if(!this.isMinion||!this.owner||this.owner.dead)this._clampToArena();
  }

  _followOwner(){
    const ox=this.owner.x+this.followOffsetX,oy=this.owner.y+this.followOffsetY;
    const dx=ox-this.x,dy=oy-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    const spd=this.speed*50;
    if(dist>60){
      this.vx+=(dx/dist)*spd*0.15;this.vy+=(dy/dist)*spd*0.15;
      const mag=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
      if(mag>spd){this.vx=this.vx/mag*spd;this.vy=this.vy/mag*spd;}
    }else if(dist>20){
      this.vx+=(dx/dist)*spd*0.05;this.vy+=(dy/dist)*spd*0.05;
    }
    this.facingRight=this.vx>0;
    this._clampToArena();
  }

  _newDir(){
    // 40%概率朝向最近敌人,30%朝中心,30%随机
    const enemies=animals.filter(a=>a.team!==this.team&&!a.dead);
    const spd=this.speed*50*(0.7+Math.random()*0.6);
    let tx,ty;
    const r=Math.random();
    if(r<0.4&&enemies.length>0){
      // 朝最近敌人
      let best=null,bestD=Infinity;
      enemies.forEach(e=>{const d=Math.hypot(e.x-this.x,e.y-this.y);if(d<bestD){bestD=d;best=e;}});
      if(best){tx=best.x;ty=best.y;}
    }else if(r<0.7){
      tx=(arenaL+arenaR)/2;ty=(arenaT+arenaB)/2;
    }
    if(tx!==undefined){
      const dx=tx-this.x,dy=ty-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
      this.vx=(dx/dist)*spd;this.vy=(dy/dist)*spd;
    }else{
      const a=Math.random()*Math.PI*2;
      this.vx=Math.cos(a)*spd;this.vy=Math.sin(a)*spd;
    }
    this.facingRight=this.vx>0;
  }

  _wallBounce(){
    const r=this.size;
    if(this.x<arenaL+r){this.x=arenaL+r;this.vx=Math.abs(this.vx)*0.7;}
    if(this.x>arenaR-r){this.x=arenaR-r;this.vx=-Math.abs(this.vx)*0.7;}
    if(this.y<arenaT+r){this.y=arenaT+r;this.vy=Math.abs(this.vy)*0.7;}
    if(this.y>arenaB-r){this.y=arenaB-r;this.vy=-Math.abs(this.vy)*0.7;}
  }

  _clampToArena(){
    const r=this.size;
    this.x=Math.max(arenaL+r,Math.min(arenaR-r,this.x));
    this.y=Math.max(arenaT+r,Math.min(arenaB-r,this.y));
  }

  effDmg(){
    let d=this.damage;if(this.weakenPct>0)d*=(1-this.weakenPct);
    if(this.critNext){d*=this.skills.find(s=>s.type==='crit')?.multiplier||2;this.critNext=false;}
    return Math.round(Math.max(1,d));
  }

  dealDmg(target){
    const isCrit=this.critNext,willStun=this.stunNext,willBleed=this.bleedNext,willPoison=this.poisonNext,isCharge=this.chargeReady;
    let dmg=this.effDmg();
    if(target.shieldActive)dmg=Math.round(dmg*(1-target.shieldReduce));
    if(willStun){target.stunned=true;target.stunTimer=this.skills.find(s=>s.type==='stun')?.duration||1800;this.stunNext=false;spawnFX('text',target.x,target.y-25,'眩晕!','#ffd700');}
    if(willBleed){target.dotEffects.push({dmg:this.skills.find(s=>s.type==='bleed')?.damage||5,dur:this.skills.find(s=>s.type==='bleed')?.duration||3500,tick:this.skills.find(s=>s.type==='bleed')?.tickInterval||700,elapsed:0,tickAcc:0});this.bleedNext=false;spawnFX('text',target.x,target.y-25,'流血!','#e74c3c');}
    if(willPoison){target.dotEffects.push({dmg:this.skills.find(s=>s.type==='poison')?.damage||5,dur:this.skills.find(s=>s.type==='poison')?.duration||4500,tick:this.skills.find(s=>s.type==='poison')?.tickInterval||900,elapsed:0,tickAcc:0});this.poisonNext=false;spawnFX('text',target.x,target.y-25,'中毒!','#8e44ad');}
    target.hp-=dmg;target.flashTimer=100;target.atkTimer=Math.min(target.atkTimer,120);
    const dx=target.x-this.x,dy=target.y-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    const kb=isCharge?(this.skills.find(s=>s.type==='charge')?.knockback||10):KB;
    target.vx+=(dx/dist)*kb*20;target.vy+=(dy/dist)*kb*15;
    this.chargeReady=false;
    spawnFX('damage',target.x,target.y-16,dmg,isCrit?'#ff6b6b':'#fff',isCrit?1.2:1);
    if(target.hp<=0){target.hp=0;target.dead=true;}
  }

  useSkill(skill,enemies){
    skill.cdTimer=skill.cd;
    const t=enemies.length>0?enemies[0]:null;
    switch(skill.type){
      case'stun':this.stunNext=true;spawnFX('text',this.x,this.y-22,skill.name+'!','#ff6b6b');break;
      case'bleed':this.bleedNext=true;spawnFX('text',this.x,this.y-22,skill.name+'!','#e74c3c');break;
      case'poison':this.poisonNext=true;spawnFX('text',this.x,this.y-22,skill.name+'!','#8e44ad');break;
      case'crit':this.critNext=true;spawnFX('text',this.x,this.y-22,skill.name+'!','#ffd700');break;
      case'charge':this.chargeReady=true;if(t){const dx=t.x-this.x,dy=t.y-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;this.vx=(dx/dist)*this.speed*200;this.vy=(dy/dist)*this.speed*150;}spawnFX('text',this.x,this.y-22,skill.name+'!','#cd853f');break;
      case'roar':if(t){t.weakenPct=skill.weakenPct;t.weakenTimer=skill.duration;spawnFX('text',t.x,t.y-22,'攻击↓','#8e44ad');}spawnFX('text',this.x,this.y-22,'咆哮!','#e8a87c');break;
      case'quake':enemies.forEach(e=>{e.hp-=(skill.damage||0);if(e.hp<=0){e.hp=0;e.dead=true;}e.flashTimer=120;e.stunned=true;e.stunTimer=skill.stunDuration;spawnFX('damage',e.x,e.y-16,skill.damage,'#cd853f');});spawnFX('text',this.x,this.y-22,skill.name+'!','#cd853f');break;
      case'shield':this.shieldActive=true;this.shieldTimer=skill.duration;this.shieldReduce=skill.reducePct;spawnFX('text',this.x,this.y-22,'缩壳!','#6b8e6b');break;
      case'lay_egg':
        if(eggs.filter(e=>e.owner===this).length<MAX_MINIONS){
          eggs.push(new Egg(this.x,this.y,this));
          spawnFX('text',this.x,this.y-22,'下蛋!','#f4a460');
        }break;
    }
  }

  rangedAttack(target){
    if(!target||target.dead)return;
    this.rangedTimer=this.rangedCD;
    spawnFX('projectile',this.x,this.y-6,{emoji:this.rangedEmoji,damage:this.rangedDmg,speed:this.rangedSpeed,target},'#f4a460');
  }

  draw(ctx){
    if(this.dead)return;
    if(this.stunned)for(let i=0;i<3;i++){const a=(Date.now()/300+i*Math.PI*2/3)%(Math.PI*2);ctx.font='12px serif';ctx.fillText('⭐',this.x+Math.cos(a)*(this.size+8)-6,this.y+Math.sin(a)*(this.size+4)-8);}
    if(this.shieldActive){ctx.strokeStyle='rgba(107,142,107,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.size+6,0,Math.PI*2);ctx.stroke();}
    if(this.critNext){ctx.strokeStyle='rgba(255,215,0,0.4)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(this.x,this.y,this.size+4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
    const fc=this.flashTimer>0?'#fff':this.color;
    ctx.fillStyle=fc;ctx.globalAlpha=0.25;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=this.flashTimer>0?'#fff':'rgba(255,255,255,0.2)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.stroke();
    const es=this.isMinion?this.size*1.1:this.size*1.3;
    ctx.font=`${es}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.emoji,this.x,this.y);
    ctx.font=`bold ${this.isMinion?8:10}px "PingFang SC","Microsoft YaHei"`;ctx.fillStyle='#fff';ctx.fillText(this.name,this.x,this.y+this.size+10);
    const bw=this.isMinion?26:44,bh=this.isMinion?3:5,by=this.y-this.size-10;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(this.x-bw/2,by,bw,bh);
    const r=this.hp/this.maxHp;ctx.fillStyle=r>0.5?'#5cb85c':r>0.25?'#f0ad4e':'#d9534f';ctx.fillRect(this.x-bw/2,by,bw*r,bh);
    if(this.weakenPct>0){ctx.font='10px serif';ctx.fillStyle='#8e44ad';ctx.fillText('🔻',this.x,this.y-this.size-18);}
    if(this.dotEffects.length>0){ctx.font='10px serif';ctx.fillStyle='#e74c3c';ctx.fillText('💔',this.x+this.size+2,this.y-2);}
  }
}

// ==================== 蛋(长成长时间) ====================
class Egg{
  constructor(x,y,owner){this.x=x;this.y=y;this.owner=owner;this.stage=0;this.stageTime=[5500,5500,7000];this.accTime=0;this.emojis=['🥚','🐣','🐤','🐔'];this.sizes=[7,11,15,19];this.dead=false;this.bobOff=0}
  update(dt){
    if(this.dead)return;
    this.accTime+=dt;this.bobOff=Math.sin(this.accTime/400)*2;
    if(this.stage<3&&this.accTime>=this.stageTime[this.stage]){
      this.accTime-=this.stageTime[this.stage];this.stage++;
      if(this.stage>=3){this.dead=true;
        // 孵化小鸡——跟随母鸡
        const chick=new Animal(MINION_CFG,this.x,this.owner.team,this.owner);
        chick.x=this.x;chick.y=this.y;
        animals.push(chick);
        spawnFX('text',this.x,this.y-16,'孵化!','#f4a460');
      }
    }
  }
  draw(ctx){
    if(this.dead)return;
    const s=this.sizes[this.stage],alpha=0.85;
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.ellipse(this.x,this.y+s+1,s*0.5,2,0,0,Math.PI*2);ctx.fill();
    ctx.font=`${s*1.3}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.emojis[this.stage],this.x,this.y+this.bobOff);
    // 阶段名
    const names=['蛋','雏鸡','青年鸡','成年'];
    ctx.font='9px "PingFang SC"';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillText(names[this.stage],this.x,this.y-s-8);
    // 进度环
    if(this.stage<3){const p=this.accTime/this.stageTime[this.stage];ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(this.x,this.y-s-14,s*0.4,-Math.PI/2,-Math.PI/2+p*Math.PI*2);ctx.stroke();}
    ctx.globalAlpha=1;
  }
}

// ==================== 常量 ====================
const WALL=12,DIR_MIN=800,DIR_MAX=2500,ATK_CD=850,KB=3,MAX_MINIONS=3;

// ==================== 特效(精简,无粒子) ====================
function spawnFX(type,x,y,data,color,scale=1){
  effects.push({type,x,y,data,color,scale,life:type==='projectile'?1500:800,age:0,dead:false});
}
function updateFX(dt){
  effects.forEach(e=>{e.age+=dt;if(e.age>=e.life){e.dead=true;return;}
    switch(e.type){
      case'damage':e.y-=30*dt/1000;break;case'text':e.y-=20*dt/1000;break;
      case'projectile':const t=e.data.target;if(t&&!t.dead){const dx=t.x-e.x,dy=t.y-e.y,dist=Math.sqrt(dx*dx+dy*dy)||1,sp=e.data.speed*70;e.x+=(dx/dist)*sp*dt/1000;e.y+=(dy/dist)*sp*dt/1000;if(dist<20){t.hp-=e.data.damage;if(t.hp<=0){t.hp=0;t.dead=true;}t.flashTimer=100;spawnFX('damage',t.x,t.y-16,e.data.damage,'#f4a460');e.dead=true;}}else{e.dead=true;}break;
    }
  });
  effects=effects.filter(e=>!e.dead);
}
function drawFX(ctx){
  effects.forEach(e=>{const a=Math.max(0,1-e.age/e.life);ctx.globalAlpha=a;
    switch(e.type){
      case'damage':ctx.font=`bold ${Math.round(16*e.scale)}px "PingFang SC"`;ctx.fillStyle=e.color;ctx.textAlign='center';ctx.fillText(`-${e.data}`,e.x,e.y);break;
      case'text':ctx.font='bold 13px "PingFang SC"';ctx.fillStyle=e.color;ctx.textAlign='center';ctx.fillText(e.data,e.x,e.y);break;
      case'projectile':ctx.font='18px serif';ctx.textAlign='center';ctx.fillText(e.data.emoji,e.x,e.y);break;
    }
    ctx.globalAlpha=1;
  });
}

// ==================== 主循环 ====================
function loop(ts){
  if(!lastTime)lastTime=ts;
  let dt=Math.min(ts-lastTime,100)*gameSpeed;lastTime=ts;
  ctx.clearRect(0,0,W,H);
  drawBG(ctx);

  if(gameState==='fighting'){
    animals.forEach(a=>a.update(dt));
    eggs.forEach(e=>e.update(dt));
    updateFX(dt);

    // DOT
    animals.forEach(a=>{a.dotEffects.forEach(d=>{d.elapsed+=dt;d.tickAcc+=dt;if(d.tickAcc>=d.tick){d.tickAcc-=d.tick;a.hp-=d.dmg;if(a.hp<=0){a.hp=0;a.dead=true;}spawnFX('damage',a.x+(Math.random()-0.5)*12,a.y-12,d.dmg,'#e74c3c');}});a.dotEffects=a.dotEffects.filter(d=>d.elapsed<d.dur);});

    // 分组
    const alive=animals.filter(a=>!a.dead);
    const t0=alive.filter(a=>a.team===0),t1=alive.filter(a=>a.team===1);

    // 碰撞+攻击
    for(let i=0;i<alive.length;i++){
      for(let j=i+1;j<alive.length;j++){
        const a=alive[i],b=alive[j];
        const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
        // 物理推挤
        const minD=a.size+b.size;
        if(dist<minD){const ov=minD-dist,nx=dx/dist,ny=dy/dist;a.x-=nx*ov*0.5;a.y-=ny*ov*0.5;b.x+=nx*ov*0.5;b.y+=ny*ov*0.5;}
        // 不同队伍攻击
        if(a.team!==b.team&&!a.dead&&!b.dead&&!a.stunned&&!b.stunned){
          const atkD=(a.atkRange+b.atkRange)/2;
          if(dist<atkD){
            if(a.atkTimer<=0&&!a.ranged){a.dealDmg(b);a.atkTimer=ATK_CD;}
            if(!b.dead&&b.atkTimer<=0&&!b.ranged){b.dealDmg(a);b.atkTimer=ATK_CD;}
          }
          // 远程攻击
          if(a.ranged&&a.rangedTimer<=0&&!a.dead&&!a.stunned&&dist<(a.rangedRange||130))a.rangedAttack(b);
          if(b.ranged&&b.rangedTimer<=0&&!b.dead&&!b.stunned&&dist<(b.rangedRange||130))b.rangedAttack(a);
        }
      }
    }

    // 技能
    alive.forEach(a=>{if(a.dead||a.stunned||a.isMinion)return;const enemies=a.team===0?t1:t0;a.skills.forEach(s=>{if(s.cdTimer<=0)a.useSkill(s,enemies);});});

    // 清理
    animals=animals.filter(a=>!a.dead||!a.isMinion);
    eggs=eggs.filter(e=>!e.dead);

    // 胜负
    const al0=t0.filter(a=>!a.dead).length,al1=t1.filter(a=>!a.dead).length;
    if(al0===0||al1===0){gameState='ended';winner=al0>0?t0.find(a=>!a.dead):t1.find(a=>!a.dead);document.getElementById('bf').disabled=false;}
  }

  eggs.forEach(e=>e.draw(ctx));
  animals.forEach(a=>a.draw(ctx));
  drawFX(ctx);

  if(gameState==='ended'&&winner){
    const alpha=0.5+Math.sin(Date.now()/500)*0.3;
    ctx.globalAlpha=alpha;ctx.font='bold 32px "PingFang SC"';ctx.fillStyle='#ffd700';ctx.textAlign='center';
    ctx.fillText(`${winner.emoji}${winner.name}获胜!`,W/2,H/2);ctx.globalAlpha=1;
  }
  if(gameState==='idle'){
    ctx.globalAlpha=0.3;ctx.font='bold 16px "PingFang SC"';ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.fillText('选择动物，点击开始对战',W/2,H/2);ctx.globalAlpha=1;
  }

  frameId=requestAnimationFrame(loop);
}

// ==================== UI ====================
function populateUI(){
  const ls=document.getElementById('ls'),rs=document.getElementById('rs'),keys=Object.keys(ANIMALS);
  [ls,rs].forEach(sel=>{sel.innerHTML='';keys.forEach(k=>{const a=ANIMALS[k];sel.innerHTML+=`<option value="${k}">${a.emoji}${a.name}</option>`;});});
  ls.value='chicken';rs.value='bear';randSel();
}
function randSel(){const keys=Object.keys(ANIMALS);document.getElementById('ls').value=keys[Math.floor(Math.random()*keys.length)];document.getElementById('rs').value=keys[Math.floor(Math.random()*keys.length)];}
function startBattle(){
  const lk=document.getElementById('ls').value,rk=document.getElementById('rs').value,ca=ANIMALS[lk],cb=ANIMALS[rk];
  animals=[new Animal(ca,arenaL+(arenaR-arenaL)*0.2,0),new Animal(cb,arenaL+(arenaR-arenaL)*0.8,1)];
  eggs=[];effects=[];gameState='fighting';winner=null;lastTime=0;document.getElementById('bf').disabled=true;
}
function resetBattle(){animals=[];eggs=[];effects=[];gameState='idle';winner=null;lastTime=0;document.getElementById('bf').disabled=false;}

populateUI();initGrass();
document.getElementById('bf').addEventListener('click',startBattle);
document.getElementById('bx').addEventListener('click',resetBattle);
document.getElementById('br').addEventListener('click',()=>{randSel();resetBattle();});
document.querySelectorAll('.speed-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.speed-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');gameSpeed=parseInt(b.dataset.s);}));
document.addEventListener('keydown',e=>{switch(e.key.toLowerCase()){case' ':e.preventDefault();if(gameState==='fighting')resetBattle();startBattle();break;case'r':resetBattle();break;case'f':randSel();resetBattle();break;case'1':setSpd(1);break;case'2':setSpd(2);break;case'3':setSpd(3);break;}});
function setSpd(s){gameSpeed=s;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.s)===s));}

frameId=requestAnimationFrame(loop);
</script>
