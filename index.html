<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动物大战 v3.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#3a2f28;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'PingFang SC','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none;padding:3px;touch-action:manipulation}
.title{color:#f5deb3;font-size:clamp(14px,3.5vw,18px);margin:1px 0;letter-spacing:2px}
#game{border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.5);max-width:100%;display:block}
.panel{margin-top:3px;background:#4a3828;border-radius:10px;padding:5px 7px;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 8px rgba(0,0,0,0.3);width:100%;max-width:420px}
.row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.row label{color:#d4c5b2;font-size:10px;white-space:nowrap}
.row select{flex:1;min-width:50px;padding:5px 2px;border-radius:6px;border:1px solid #6b5a48;background:#5c4a38;color:#f5deb3;font-size:11px;font-family:inherit;-webkit-appearance:none;text-align:center}
.btn{padding:7px 9px;border-radius:7px;border:none;cursor:pointer;font-size:11px;font-family:inherit;font-weight:bold;transition:all 0.15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;min-height:34px}
.btn:active{transform:scale(0.95)}
.btn-fight{background:linear-gradient(135deg,#d4745c,#b8533f);color:#fff;font-size:13px;padding:8px 14px;flex:1}
.btn-reset{background:#5c4a38;color:#c4b5a2}
.btn-random{background:linear-gradient(135deg,#7b6b5a,#5c4a38);color:#f5deb3}
.speed-btn{padding:3px 6px;border-radius:5px;border:1px solid #6b5a48;background:transparent;color:#a09080;cursor:pointer;font-size:9px;font-family:inherit}
.speed-btn.active{background:#e8a87c;color:#3a2f28;border-color:#e8a87c;font-weight:bold}
.info{color:#8a7a6a;font-size:8px;text-align:center;letter-spacing:1px}
.tag-row{display:flex;flex-wrap:wrap;gap:3px;min-height:20px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:2px;background:#5c4a38;color:#f5deb3;padding:2px 6px;border-radius:4px;font-size:10px;cursor:pointer}
.tag:hover{background:#d4745c}
.tag .x{color:#d4745c;font-weight:bold;margin-left:2px}
.tag:hover .x{color:#fff}
.mute-tag{color:#8a7a6a;font-size:9px}
.comment-bar{background:#1a1a0a;border-radius:0 0 10px 10px;padding:4px 10px;width:100%;max-width:420px;min-height:22px;overflow:hidden;margin-bottom:2px}
.comment-bar .comment-item{color:#ccc;font-size:9px;padding:2px 0;animation:commentIn 0.3s ease-out;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes commentIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#ffd700;padding:8px 18px;border-radius:8px;font-size:13px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;z-index:100;pointer-events:none;transition:opacity 0.3s}
.toast.hidden{opacity:0}
</style>
</head>
<body>
<div class="title">⚔️ 动物大战 v3.0</div>
<canvas id="game"></canvas>
<div id="toast" class="toast hidden"></div>
<div class="comment-bar" id="commentBar"><span class="comment-item">选择动物，点击开始对战</span></div>
<div class="panel">
  <div class="row">
    <label>🎯</label><select id="asel"></select>
    <button class="btn btn-random" id="badd" style="font-size:10px;padding:4px 8px;min-height:26px">+添加</button>
  </div>
  <div class="tag-row" id="tags"></div>
  <div class="row" style="margin-top:2px">
    <label>🗺️</label><select id="msel"></select>
  </div>
  <div class="row">
    <button class="btn btn-random" id="br">🎲随机</button>
    <button class="btn btn-fight" id="bf">⚡开始</button>
    <button class="btn btn-reset" id="bx">🔄重置</button>
  </div>
  <div class="row">
    <span style="color:#8a7a6a;font-size:9px">速度:</span>
    <button class="speed-btn" data-s="1">0.5x</button>
    <button class="speed-btn active" data-s="2">1x</button>
    <button class="speed-btn" data-s="4">2x</button>
    <button class="speed-btn" data-s="8">4x</button>
  </div>
</div>
<div class="info">v3.0 · 10种动物 · 空格开始 R重置 F随机 数字调速</div>

<script>
// ==================== 画布 ====================
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,arenaL,arenaR,arenaT,arenaB,arenaScale=1;
const BASE_MAXW=420,RATIO=1.55;
function resize(scaleOverride){
  const sc=scaleOverride||arenaScale;
  const mw=Math.min(window.innerWidth-12,Math.floor(BASE_MAXW*sc)),ratio=RATIO;
  canvas.width=mw;canvas.height=Math.floor(mw*ratio);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.style.width=mw+'px';canvas.style.height=Math.floor(mw*ratio)+'px';
  if(dpr>1){canvas.width=mw*dpr;canvas.height=Math.floor(mw*ratio)*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  W=mw;H=Math.floor(mw*ratio);
  arenaL=14;arenaR=W-14;arenaT=50;arenaB=H-14;
}
window.addEventListener('resize',()=>resize());
window.addEventListener('orientationchange',()=>setTimeout(()=>resize(),300));
resize(1);

// ==================== 注释系统 ====================
let commentLog=[];
const MAX_COMMENTS=5;
function showComment(text,color='#ccc'){
  commentLog.unshift({text,color,age:0});
  if(commentLog.length>MAX_COMMENTS)commentLog.length=MAX_COMMENTS;
  updateCommentBar();
}
function showToast(text,dur=3000){
  const t=document.getElementById('toast');
  t.textContent=text;t.classList.remove('hidden');
  clearTimeout(t._to);t._to=setTimeout(()=>t.classList.add('hidden'),dur);
}
function updateCommentBar(){
  const bar=document.getElementById('commentBar');
  if(commentLog.length===0){bar.innerHTML='<span class="comment-item">...</span>';return;}
  bar.innerHTML=commentLog.map(c=>`<div class="comment-item" style="color:${c.color}">${c.text}</div>`).join('');
}

// ==================== 背景元素 ====================
let grassSpots=[],mapParticles=[],mapHazards=[];
function initGrass(){
  grassSpots=[];
  const rng=s=>{let x=Math.sin(s)*10000;return x-Math.floor(x);};
  for(let i=0;i<30;i++)grassSpots.push({x:arenaL+rng(i*7+1)*(arenaR-arenaL),y:arenaB-rng(i*13+3)*22,r:4+rng(i*17+5)*8});
}
initGrass();

// ==================== 地图定义 ====================
const MAPS={
  grassland:{name:'🌿草原',desc:'全场每2秒回血2HP',color:'#7a9a50',bgTop:'#b8d890',bgBot:'#6a8a3a'},
  volcano:{name:'🌋火山',desc:'随机喷发·命中扣15血+眩晕',color:'#8b4513',bgTop:'#5a3020',bgBot:'#2a1005'},
  ice:{name:'❄️冰原',desc:'移速+15%·碰墙滑行',color:'#a0c8e8',bgTop:'#c8ddf0',bgBot:'#7090a8'},
  wind:{name:'🌪️风谷',desc:'移速+20%·风向5秒切换',color:'#8a9a70',bgTop:'#b8c898',bgBot:'#5a7a40'},
  colosseum:{name:'🏛️竞技场',desc:'标准规则·无特殊效果',color:'#a09080',bgTop:'#d4c5a0',bgBot:'#8a7a58'}
};
let currentMap='colosseum';
let windDir={x:1,y:0},windTimer=0,windInterval=5000;

function drawBG(ctx){
  const m=MAPS[currentMap];
  const sky=ctx.createLinearGradient(0,0,0,arenaT+25);
  sky.addColorStop(0,m.bgTop);sky.addColorStop(1,m.bgTop);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const gnd=ctx.createLinearGradient(0,arenaT+6,0,H);
  gnd.addColorStop(0,m.bgTop);gnd.addColorStop(0.6,m.bgBot);gnd.addColorStop(1,'#2a1a0a');
  ctx.fillStyle=gnd;ctx.fillRect(0,arenaT+6,W,H-arenaT-6);
  if(currentMap==='grassland'){
    grassSpots.forEach(g=>{const gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r);gr.addColorStop(0,'#8ab84a');gr.addColorStop(1,'#5a8a30');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();});
    for(let i=0;i<12;i++){const fx=arenaL+((i*137+53)%(arenaR-arenaL)),fy=arenaT+10+((i*89+31)%(arenaB-arenaT-10));ctx.fillStyle=['#ffdd57','#ff88aa','#ffffff','#ffaa88','#ffcc44'][i%5];ctx.beginPath();ctx.arc(fx,fy,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(fx,fy,1.5,0,Math.PI*2);ctx.fill();}
    const bt=Date.now()/1500;
    for(let i=0;i<3;i++){const bx=arenaL+60+Math.sin(bt+i*2.1)*((arenaR-arenaL-120)*0.4),by=arenaT+20+Math.cos(bt*1.3+i*1.7)*30;ctx.fillStyle='#ff88cc';ctx.beginPath();ctx.arc(bx-3,by,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bx+3,by,2.5,0,Math.PI*2);ctx.fill();}
  }else if(currentMap==='volcano'){
    const vt=Date.now()/3000;
    for(let i=0;i<8;i++){const cx=arenaL+((i*173+31)%(arenaR-arenaL)),cy=arenaB-10-((i*97+17)%(arenaB-arenaT)*0.5);const sg=ctx.createLinearGradient(cx-8,cy,cx+8,cy);sg.addColorStop(0,'rgba(255,120,20,0)');sg.addColorStop(0.5,'rgba(255,80,10,0.5)');sg.addColorStop(1,'rgba(255,120,20,0)');ctx.strokeStyle=sg;ctx.lineWidth=2.5+Math.sin(vt+i)*1;ctx.beginPath();ctx.moveTo(cx-10,cy);ctx.quadraticCurveTo(cx,cy-4+Math.sin(vt+i)*3,cx+10,cy);ctx.stroke();}
    for(let i=0;i<6;i++){const sx=arenaL+((i*191+Date.now()/200)%(arenaR-arenaL)),sy=arenaT+15+((i*137+Date.now()/300)%(arenaB-arenaT-15));ctx.fillStyle='rgba(255,150,30,0.4)';ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();}
  }else if(currentMap==='ice'){
    ctx.fillStyle='rgba(220,235,250,0.7)';ctx.fillRect(arenaL,arenaT+6,arenaR-arenaL,arenaB-arenaT-6);
    const it=Date.now()/2000;
    for(let i=0;i<8;i++){const ix=arenaL+((i*151+41)%(arenaR-arenaL)),iy=arenaT+15+((i*113+59)%(arenaB-arenaT-15));ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ix,iy-8);ctx.lineTo(ix+Math.sin(it+i)*2,iy);ctx.lineTo(ix,iy+8);ctx.moveTo(ix-8,iy);ctx.lineTo(ix,iy+Math.cos(it+i)*2);ctx.lineTo(ix+8,iy);ctx.stroke();}
  }else if(currentMap==='wind'){
    const wt=Date.now()/600;
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
    for(let i=0;i<18;i++){const wx=arenaL+(i*29+wt*40)%(arenaR-arenaL),wy=arenaT+8+(i*33)%(arenaB-arenaT-8);ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx+Math.cos(wt+i*0.7)*22,wy+Math.sin(wt+i*0.7)*8);ctx.stroke();}
    for(let i=0;i<5;i++){const lx=arenaL+(i*111+wt*60)%(arenaR-arenaL+60)-30,ly=arenaT+15+(i*67+Math.sin(wt+i)*30)%(arenaB-arenaT-15);ctx.fillStyle='rgba(180,160,100,0.5)';ctx.beginPath();ctx.ellipse(lx,ly,3,1.5,wt*0.3,0,Math.PI*2);ctx.fill();}
  }else{
    ctx.fillStyle='#c0b098';ctx.fillRect(arenaL,arenaT+6,arenaR-arenaL,arenaB-arenaT-6);
    ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;
    for(let y=arenaT+20;y<arenaB;y+=35)for(let x=arenaL+10;x<arenaR;x+=55){ctx.strokeRect(x,y,55,35);}
    ctx.fillStyle='#a09080';
    for(let x=arenaL+50;x<arenaR;x+=90){ctx.beginPath();ctx.arc(x,arenaT+22,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=2;ctx.stroke();}
  }
  ctx.fillStyle='#5a3820';ctx.fillRect(arenaL-3,arenaT-2,arenaR-arenaL+6,2.5);
  for(let x=arenaL;x<=arenaR;x+=34){ctx.fillStyle='#4a2a10';ctx.fillRect(x-2.5,arenaT-6,5,14);ctx.fillStyle='#3a1a08';ctx.fillRect(x-1,arenaT-8,2,4);}
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.setLineDash([4,12]);ctx.strokeRect(arenaL,arenaT,arenaR-arenaL,arenaB-arenaT);ctx.setLineDash([]);
}

function mapTick(dt){
  if(currentMap==='grassland'){
    if(!mapTick._grassCD)mapTick._grassCD=0;
    mapTick._grassCD+=dt;
    while(mapTick._grassCD>=2000){mapTick._grassCD-=2000;
      animals.forEach(a=>{if(!a.dead){a.hp=Math.min(a.maxHp,a.hp+2);
        for(let i=0;i<3;i++)spawnSpark(a.x+(Math.random()-0.5)*a.size,a.y+(Math.random()-0.5)*a.size,1,2+Math.random()*3,['#5cb85c','#8fdf8f'],400,{vx:(Math.random()-0.5)*10,vy:-8-Math.random()*6});
      }});
    }
  }else if(currentMap==='volcano'){
    if(!mapTick._volCD)mapTick._volCD=0;
    mapTick._volCD+=dt;
    if(mapTick._volCD>=7000+Math.random()*5000){mapTick._volCD=0;
      const ex=arenaL+40+Math.random()*(arenaR-arenaL-80),ey=arenaT+35+Math.random()*(arenaB-arenaT-70);
      mapHazards.push({x:ex,y:ey,life:1500,age:0,radius:45,phase:'warning'});
      showComment('🌋火山即将喷发！','#ff6600');
      setTimeout(()=>{if(gameState!=='fighting')return;
        mapHazards.push({x:ex,y:ey,life:800,age:0,radius:48,phase:'erupt'});
        for(let j=0;j<16;j++)spawnSpark(ex,ey,2,4+Math.random()*10,['#ff4500','#ff8800','#ffaa00','#ffcc00'],1800,{vx:(Math.random()-0.5)*50,vy:-20-Math.random()*40});
        triggerShake(6,300);
        animals.forEach(a=>{if(!a.dead&&Math.hypot(a.x-ex,a.y-ey)<48){a.hp-=15;if(a.hp<=0){a.hp=0;a.dead=true;}a.stunned=true;a.stunTimer=500;a.flashTimer=180;spawnFX('damage',a.x,a.y-18,15,'#ff4500');for(let i=0;i<6;i++)spawnSpark(a.x,a.y,2,3+Math.random()*6,['#ff4500','#ff8800'],800,{vx:(Math.random()-0.5)*25,vy:(Math.random()-0.5)*20-10});}});
      },500);
    }
  }else if(currentMap==='ice'){
    if(!mapTick._iceSnow)mapTick._iceSnow=0;
    mapTick._iceSnow+=dt;
    if(mapTick._iceSnow>400){mapTick._iceSnow=0;mapParticles.push({x:Math.random()*(arenaR-arenaL)+arenaL,y:arenaT,life:5000,age:0});}
  }else if(currentMap==='wind'){
    windTimer+=dt;
    if(windTimer>=windInterval){windTimer=0;
      const a=Math.random()*Math.PI*2;windDir={x:Math.cos(a),y:Math.sin(a)};
      const dirName=a<-2.3||a>2.3?'→':a<-0.7?'↑':a<0.7?'←':'↓';
      spawnFX('text',W/2,arenaT+35,'风向'+dirName,'#ffdd57');
      for(let i=0;i<8;i++)spawnSpark(W/2,arenaT+40,1,3+Math.random()*5,['#ffdd57','#ffe080'],800,{vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*25-10});
    }
  }
  mapParticles.forEach(p=>{p.age+=dt;p.y+=(currentMap==='ice'?0.4:1)*dt/1000;if(p.age>=p.life)p.dead=true;});
  mapParticles=mapParticles.filter(p=>!p.dead);
  mapHazards.forEach(h=>{h.age+=dt;if(h.age>=h.life)h.dead=true;});
  mapHazards=mapHazards.filter(h=>!h.dead);
}

// ==================== 动物数据 v3.0 ====================
const ANIMALS={
  chicken:{id:'chicken',name:'母鸡',emoji:'🐔',bodyType:'bird',hp:144,speed:0.40,damage:4,size:48,color:'#faf0e0',bodyColor:'#e8d0a8',ranged:true,rangedDmg:7,rangedCD:2600,rangedRange:160,rangedEmoji:'🍚',rangedSpeed:4.5,rangedMiss:0.25,skills:[{name:'下蛋',emoji:'🥚',cd:28000,type:'lay_egg',desc:'下蛋→孵化→新生命'}]},
  bear:{id:'bear',name:'棕熊',emoji:'🐻',bodyType:'quad',hp:306,speed:0.34,damage:16,size:67,color:'#a07848',bodyColor:'#6b4a28',passives:[{type:'rage',threshold:0.3,dmgBonus:0.5,desc:'HP<30%伤害+50%'},{type:'hibernateV2',triggerHP:0.6,hpPctPerSec:0.01,duration:10000,cd:60000,desc:'HP<60%冬眠10秒·每秒回1%HP'}],skills:[{name:'眩晕拍击',emoji:'💫',cd:9000,type:'stun',duration:1500,windup:900,smartRange:80,desc:'蓄力→拍晕1.5秒'}]},
  wolf:{id:'wolf',name:'狼',emoji:'🐺',bodyType:'quad',hp:174,speed:0.72,damage:9,size:51,color:'#c0c0c0',bodyColor:'#707070',passives:[{type:'frenzyCombo',desc:'HP≥70%二连击(70%×2)·HP<30%三连击(60%×3)'}],skills:[{name:'流血撕咬',emoji:'🩸',cd:5000,type:'bleed',damage:6,duration:3500,tickInterval:700,desc:'命中后流血3.5秒'}]},
  bull:{id:'bull',name:'公牛',emoji:'🐂',bodyType:'quad',hp:282,speed:0.42,damage:11,size:61,color:'#d4b890',bodyColor:'#8a6040',passives:[{type:'berserkRage',maxBonus:0.8,desc:'血量越低伤害越高(最高+80%)'}],skills:[{name:'冲撞',emoji:'💨',cd:8000,type:'charge',duration:600,speedMult:2.5,dmgMult:1.8,smartRange:120,desc:'加速冲刺600ms→碰撞1.8倍伤害'}]},
  eagle:{id:'eagle',name:'鹰',emoji:'🦅',bodyType:'bird',hp:138,speed:0.72,damage:18,size:48,color:'#f0ead8',bodyColor:'#5a3a20',passives:[{type:'dodge',chance:0.18,desc:'18%闪避近战攻击'}],skills:[{name:'俯冲猎杀',emoji:'⚡',cd:8000,type:'diveV2',multiplier:3.0,lockRange:200,climbTime:300,circleTime:600,diveTime:400,desc:'升空→盘旋→俯冲3倍暴击'}]},
  snake:{id:'snake',name:'蛇',emoji:'🐍',bodyType:'snake',hp:162,speed:0.56,damage:6,size:45,color:'#5dade2',bodyColor:'#3d8d52',passives:[{type:'contagion',radius:54,spreadDmg:4,duration:3000,desc:'击杀→毒溅射周围敌人'},{type:'evolve',triggerHP:0.65,speedBonus:0.2,lifesteal:0.2,desc:'HP<65%蜕皮·移速+20%·吸血20%'}],skills:[{name:'毒液',emoji:'🧪',cd:4200,type:'poison',damage:5,duration:4500,tickInterval:900,poisonCloud:true,desc:'中毒4.5秒(5/秒·可被吸血)+毒雾'}]},
  tiger:{id:'tiger',name:'老虎',emoji:'🐯',bodyType:'quad',hp:220,speed:0.48,damage:17,size:60,color:'#f0a030',bodyColor:'#c06010',passives:[{type:'huntMode',triggerHP:0.8,pounceInterval:3000,pounceDist:0.4,minDist:80,dmgBonus:0.8,desc:'HP<80%猎杀形态·每3秒跳步'}],skills:[]},

function pickItemType(){
  const total=ITEM_TYPES.reduce((s,t)=>s+t.weight,0);
  let r=Math.random()*total;
  for(const t of ITEM_TYPES){r-=t.weight;if(r<=0)return t;}
  return ITEM_TYPES[0];
}

class Item{
  constructor(x,y){this.type=pickItemType();this.x=x;this.y=y;this.life=15000;this.age=0;this.dead=false;this.bob=0;}
  update(dt){this.age+=dt;this.bob=Math.sin(this.age/300)*3;if(this.age>=this.life)this.dead=true;}
  draw(ctx){
    const a=this.age>13000?1-(this.age-13000)/2000:1;ctx.globalAlpha=a;
    const rt=Date.now()/800;
    const glow=ctx.createRadialGradient(this.x,this.y+this.bob,3,this.x,this.y+this.bob,18);
    glow.addColorStop(0,this.type.color);glow.addColorStop(0.5,this.type.color+'88');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(this.x,this.y+this.bob,18,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=this.type.color;ctx.lineWidth=1.5;ctx.globalAlpha=a*0.7;ctx.setLineDash([4,3]);ctx.lineDashOffset=rt*30;
    ctx.beginPath();ctx.arc(this.x,this.y+this.bob,14,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=a;ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(this.type.icon,this.x,this.y+this.bob);

    ctx.fillText(this.type.name,this.x,this.y+this.bob+16);ctx.globalAlpha=1;
  }
}

// ==================== 动物类 ====================
class Animal{
  constructor(cfg,x,team,owner=null,displayName=null){
    Object.assign(this,cfg);this.maxHp=cfg.hp;
    this.x=x;this.y=arenaT+(arenaB-arenaT)*(0.2+Math.random()*0.6);
    this.team=team;this.owner=owner;
    this.displayName=displayName||cfg.name;
    const spd=cfg.speed*60*(0.92+Math.random()*0.16);
    const a=Math.random()*Math.PI*2;this.vx=Math.cos(a)*spd;this.vy=Math.sin(a)*spd;
    this.atkTimer=Math.random()*ATK_CD;this.dirTimer=Math.random()*DIR_MAX;
    this.stunned=false;this.stunTimer=0;this.flashTimer=0;this.dead=false;
    this.skills=(cfg.skills||[]).map(s=>({...s,cdTimer:Math.random()*s.cd*0.3}));
    this.rangedTimer=cfg.ranged?Math.random()*cfg.rangedCD:99999;
    this.dotEffects=[];this.shieldActive=false;this.shieldTimer=0;this.shieldReduce=0;
    this.weakenPct=0;this.weakenTimer=0;
    this.critNext=false;this.stunNext=false;this.bleedNext=false;this.poisonNext=false;
    this.slowed=false;this.slowPct=0;this.slowTimer=0;
    this.passives=cfg.passives||[];
    this.followOffsetX=(Math.random()-0.5)*this.size*0.6;this.followOffsetY=(Math.random()-0.5)*this.size*0.4+this.size*0.4;
    this.aliveTimer=0;
    this.lastHitTimer=3000;
    this.recoilTimer=0;this.stunImmune=0;
    // 冬眠 v2
    this._hibernateV2=false;this._hibernateV2Timer=0;this._hibernateV2CD=0;
    if(this.passives.some(p=>p.type==='hibernateV2')){const hv=this.passives.find(p=>p.type==='hibernateV2');this._hibernateV2CD=60000;}
    // 猎杀形态
    this._hunting=false;this._huntCD=0;
    // 进化
    this._evolved=false;
    // 攻击动画
    this.attackAnim=0;this.attackType=null;
    // 狼连击
    this.comboTimer=0;this.comboCount=0;this.comboNext=0;
    // 牛冲锋
    this.chargeTimer=0;this.chargeActive=false;
    // 野猪
    this.boarSpeedRes=0;
    // 鹰俯冲v2
    this.divePhase=0;this.divePhaseTimer=0;this.diveTarget=null;this.diveSkill=null;this.diveLockX=0;this.diveLockY=0;
    this.drawY=0;this.scaleBob=0;
    this.speedBoost=0;this.speedBoostTimer=0;
    this.dmgBoost=0;this.dmgBoostTimer=0;
    this._healFlash=0;this._speedFlash=0;this._powerFlash=0;this._shieldFlash=0;this._poisonFlash=0;
    this._frozen=false;this._frozenTimer=0;
    this._chickPhase=cfg._chickPhase;this._chickTimer=0;
    this._canLay=cfg._canLay||false;
  }

  update(dt){
    if(this.dead)return;const rd=dt;
    this.aliveTimer+=rd;
    if(this._healFlash>0)this._healFlash-=rd;
    if(this._speedFlash>0)this._speedFlash-=rd;
    if(this._powerFlash>0)this._powerFlash-=rd;
    if(this._shieldFlash>0)this._shieldFlash-=rd;
    if(this._poisonFlash>0)this._poisonFlash-=rd;
    if(this._frozen){this._frozenTimer-=rd;if(this._frozenTimer<=0)this._frozen=false;}
    if(this.attackAnim>0)this.attackAnim-=rd;
    if(this.boarSpeedRes>0)this.boarSpeedRes-=rd;

    // 狼连击状态机
    if(this.comboTimer>0){this.comboTimer-=rd;this.comboNext-=rd;
      if(this.comboCount>0&&this.comboNext<=0){this._doComboHit();}
      if(this.comboCount<=0){this.comboTimer=0;this.comboNext=0;}
    }

    // 鸡成长
    if(this._chickPhase===0){this._chickTimer+=rd;if(this._chickTimer>=10000)this._growTo(YOUNG_CFG);}
    else if(this._chickPhase===1){this._chickTimer+=rd;if(this._chickTimer>=12000)this._growTo(Math.random()<0.25?ROOSTER_CFG:HEN_CFG);}

    this.scaleBob=Math.sin(this.aliveTimer/600)*0.03;
    if(this.speedBoostTimer>0){this.speedBoostTimer-=rd;if(this.speedBoostTimer<=0)this.speedBoost=0;}
    if(this.dmgBoostTimer>0){this.dmgBoostTimer-=rd;if(this.dmgBoostTimer<=0)this.dmgBoost=0;}
    if(this.stunned){this.stunTimer-=rd;if(this.stunTimer<=0)this.stunned=false;if(this.stunned)return;}
    if(!this.shieldActive&&this.shieldTimer>0){this.shieldTimer-=rd;if(this.shieldTimer<=0)this.shieldReduce=0;}
    if(this.shieldActive&&this.shieldTimer>0){this.shieldTimer-=rd;if(this.shieldTimer<=0){this.shieldActive=false;this.shieldReduce=0;}}
    if(this.weakenTimer>0){this.weakenTimer-=rd;if(this.weakenTimer<=0)this.weakenPct=0;}
    if(this.slowTimer>0){this.slowTimer-=rd;if(this.slowTimer<=0){this.slowed=false;this.slowPct=0;}}
    if(this.flashTimer>0)this.flashTimer-=rd;
    if(this.atkTimer>0)this.atkTimer-=rd;
    if(this.rangedTimer>0)this.rangedTimer-=rd;
    if(this.recoilTimer>0)this.recoilTimer-=rd;
    if(this.stunImmune>0)this.stunImmune-=rd;
    if(shakeCD>0)shakeCD-=rd;
    this.skills.forEach(s=>{if(s.cdTimer>0)s.cdTimer-=rd;});

    // === 熊冬眠 v2 ===
    if(this.passives.some(p=>p.type==='hibernateV2')&&!this._hibernateV2){
      const hv=this.passives.find(p=>p.type==='hibernateV2');
      if(this._hibernateV2CD>0)this._hibernateV2CD-=rd;
      if(this._hibernateV2CD<=0&&this.hp/this.maxHp<hv.triggerHP&&!this.stunned){
        this._hibernateV2=true;this._hibernateV2Timer=hv.duration;
        this._hibernateV2CD=0;
        showComment(`🐻 ${this.displayName} 进入冬眠！每秒回复1%HP，持续10秒`,'#a07848');
        showToast('🐻 冬眠中...');
      }
    }
    if(this._hibernateV2){this._hibernateV2Timer-=rd;
      this.hp=Math.min(this.maxHp,this.hp+this.maxHp*0.01*rd/1000);
      if(this._hibernateV2Timer<=0){this._hibernateV2=false;this._hibernateV2CD=60000;this._newDir();
        showComment(`🐻 ${this.displayName} 冬眠结束！`,'#a07848');
        spawnFX('text',this.x,this.y-20,'醒来!','#ff6b6b');triggerShake(3,200);
      }
      this.vx*=0.85;this.vy*=0.85;this.x+=this.vx*rd/1000;this.y+=this.vy*rd/1000;this._clampToArena();return;
    }

    // === 老虎猎杀形态 ===
    const huntPs=this.passives.find(p=>p.type==='huntMode');
    if(huntPs&&this.hp/this.maxHp<huntPs.triggerHP&&!this._hunting){
      this._hunting=true;this._huntCD=huntPs.pounceInterval;
      showComment(`🐯 ${this.displayName} 进入猎杀形态！开始追踪猎物`,'#f0a030');
      showToast('🐯 猎杀形态！');
    }
    if(this._hunting&&!this.stunned){
      if(this._huntCD>0)this._huntCD-=rd;
      const foes=animals.filter(e=>!e.dead&&e!==this);
      if(foes.length===0){this.vx*=0.9;this.vy*=0.9;this.x+=this.vx*rd/1000;this.y+=this.vy*rd/1000;this._clampToArena();return;}
      if(this._huntCD<=0){
        this._huntCD=huntPs.pounceInterval;
        const t=foes.reduce((b,c)=>Math.hypot(c.x-this.x,c.y-this.y)<Math.hypot(b.x-this.x,b.y-this.y)?c:b);
        const dx=t.x-this.x,dy=t.y-this.y,dist=Math.hypot(dx,dy)||1;
        const pDist=Math.max(huntPs.minDist,dist*huntPs.pounceDist);
        this.vx=(dx/dist)*this.speed*100;this.vy=(dy/dist)*this.speed*80;
        this.hopActive=true;this.attackAnim=300;this.attackType='pounce';
        spawnFX('text',this.x,this.y-20,'猎杀跳步!','#f0a030');
        for(let i=0;i<8;i++)spawnDust(this.x,this.y+this.size*0.3,4+Math.random()*6,'#c4a882',800,{vx:(Math.random()-0.5)*20,vy:5+Math.random()*10});
      }
    }

    // === 蛇进化检测 ===
    const evPs=this.passives.find(p=>p.type==='evolve');
    if(evPs&&!this._evolved&&this.hp/this.maxHp<evPs.triggerHP){
      this._evolved=true;
      showComment(`🐍 ${this.displayName} 蜕皮进化！移速+20%，获得20%吸血`,'#3d8d52');
      showToast('🐍 蜕皮进化！');
      for(let i=0;i<12;i++)spawnSpark(this.x,this.y,2,3+Math.random()*8,['#3d8d52','#1a5a30','#ff0000'],1400,{vx:(Math.random()-0.5)*30,vy:(Math.random()-0.5)*25-10});
    }

    // === 牛冲锋 ===
    if(this.chargeTimer>0){this.chargeTimer-=rd;if(this.chargeTimer<=0){this.chargeActive=false;this.vx*=0.3;this.vy*=0.3;}}

    // === 龟回血 ===
    if(this.passives.some(p=>p.type==='regeneration')){
      const reg=this.passives.find(p=>p.type==='regeneration');
      this.lastHitTimer-=rd;
      if(this.lastHitTimer<=0&&this.hp<this.maxHp){this.hp=Math.min(this.maxHp,this.hp+reg.hpPerSec*rd/1000);}
    }

    // === 鹰俯冲 v2 ===
    if(this.divePhase>0){this._diveV2Update(rd);return;}

    if(this.isMinion&&this.owner&&!this.owner.dead&&this._chickPhase<2){this._followOwner();}

    let spdMult=1;if(this.slowed)spdMult*=(1-this.slowPct);
    if(this.speedBoost>0)spdMult*=(1+this.speedBoost);
    if(currentMap==='ice')spdMult*=1.15;
    if(currentMap==='wind')spdMult*=1.20;
    // 蛇进化加速
    if(evPs&&this._evolved)spdMult*=(1+evPs.speedBonus);
    // 野猪狂怒加速
    const furyPs=this.passives.find(p=>p.type==='furyCharge');
    if(furyPs){const furyBonus=Math.max(0,(1-this.hp/this.maxHp)*furyPs.speedBonus);spdMult*=(1+furyBonus);}
    const curSpd=Math.sqrt(this.vx*this.vx+this.vy*this.vy)||1;
    const maxSpd=this.speed*60*spdMult;
    if(curSpd>maxSpd&&this.divePhase===0&&!this.chargeActive){this.vx=this.vx/curSpd*maxSpd;this.vy=this.vy/curSpd*maxSpd;}
    if(currentMap==='wind'){this.vx+=windDir.x*20*rd/1000;this.vy+=windDir.y*20*rd/1000;}
    this.x+=this.vx*rd/1000;this.y+=this.vy*rd/1000;
    this._clampToArena();
  }

  _diveV2Update(rd){
    this.divePhaseTimer-=rd;
    if(this.divePhase===1){// 升空
      const prog=1-this.divePhaseTimer/this.diveSkill.climbTime;
      this.drawY=-this.size*prog*1.5;
      if(Math.random()<0.5)spawnSpark(this.x,this.y,1,2+Math.random()*4,SPARK_COLORS.sky,600,{vx:(Math.random()-0.5)*5,vy:-8-Math.random()*8});
      if(this.divePhaseTimer<=0){this.divePhase=2;this.divePhaseTimer=this.diveSkill.circleTime;}
    }else if(this.divePhase===2){// 盘旋
      this.drawY=-this.size*1.5;
      if(this.diveTarget&&!this.diveTarget.dead){
        const escDist=Math.hypot(this.diveTarget.x-this.diveLockX,this.diveTarget.y-this.diveLockY);
        if(escDist>this.diveSkill.lockRange*0.4){this._diveV2Abort('目标逃脱');return;}
      }else{this._diveV2Abort('目标丢失');return;}
      if(this.divePhaseTimer<=0){this.divePhase=3;this.divePhaseTimer=this.diveSkill.diveTime;
        if(this.diveTarget&&!this.diveTarget.dead){this.diveLockX=this.diveTarget.x;this.diveLockY=this.diveTarget.y;}
      }
    }else if(this.divePhase===3){// 俯冲
      const prog=1-this.divePhaseTimer/this.diveSkill.diveTime;
      this.drawY=-this.size*1.5*(1-prog);
      const dx=this.diveLockX-this.x,dy=this.diveLockY-this.y,dist=Math.hypot(dx,dy)||1;
      const spd=this.speed*this.diveSkill.multiplier*60*(0.5+prog*0.5);
      this.vx+=(dx/dist)*spd*0.2;this.vy+=(dy/dist)*spd*0.2;
      const mag=Math.hypot(this.vx,this.vy);if(mag>spd){this.vx=this.vx/mag*spd;this.vy=this.vy/mag*spd;}
      if(Math.random()<0.7)spawnSpark(this.x-this.vx*0.08,this.y-this.vy*0.08,1,2+Math.random()*4,SPARK_COLORS.sky,800,{vx:-this.vx*0.15,vy:-this.vy*0.15});
      this.x+=this.vx*rd/1000;this.y+=this.vy*rd/1000;
      if(this.divePhaseTimer<=0||dist<this.size+20){
        const hit=this.diveTarget&&!this.diveTarget.dead&&Math.hypot(this.diveTarget.x-this.x,this.diveTarget.y-this.y)<this.size+this.diveTarget.size+20;
        if(hit){this.dealDmg(this.diveTarget);this.divePhase=0;this.drawY=0;this.diveTarget=null;this.diveSkill=null;this._newDir();}
        else{this._diveV2Abort('扑空');}
      }
    }
    this._clampToArena();
  }
  _diveV2Abort(reason){
    this.divePhase=0;this.drawY=0;
    if(this.diveSkill){const sk=this.skills.find(s=>s.type==='diveV2');if(sk)sk.cdTimer=sk.cd*2;}
    this.stunned=true;this.stunTimer=1500;this.stunImmune=STUN_IMMUN;
    spawnFX('text',this.x,this.y-20,reason+'!','#ff6b6b');
    for(let i=0;i<10;i++)spawnSpark(this.x,this.y,2,3+Math.random()*8,['#ff6b6b','#ff8888'],900,{vx:(Math.random()-0.5)*35,vy:(Math.random()-0.5)*30-15});
    this.diveTarget=null;this.diveSkill=null;
  }

  _doComboHit(){
    this.comboCount--;
    const alive=animals.filter(e=>!e.dead);
    let t=null;let minD=Infinity;
    for(const e of alive){if(e===this||e.team===this.team)continue;const d=Math.hypot(e.x-this.x,e.y-this.y);if(d<minD&&d<this.size+e.size+15){minD=d;t=e;}}
    if(!t)return;
    const hpR=this.hp/this.maxHp;
    const dmgPct=hpR>=0.7?0.7:0.6;
    let dmg=Math.round(this.effDmg()*dmgPct);
    if(t.shieldActive)dmg=Math.round(dmg*(1-t.shieldReduce));
    // 龟硬壳免伤
    const sd=t.passives.find(p=>p.type==='shellDefense');
    if(sd){const sdReduce=(1-t.hp/t.maxHp)*sd.maxReduce;dmg=Math.round(dmg*(1-sdReduce));}
    dmg=Math.max(1,dmg);
    t.hp-=dmg;t.flashTimer=80;t.onHit();
    spawnFX('damage',t.x+(Math.random()-0.5)*10,t.y-14,dmg,'#e74c3c');
    for(let i=0;i<3;i++)spawnSpark(t.x+(Math.random()-0.5)*15,t.y+(Math.random()-0.5)*10,1,2+Math.random()*4,SPARK_COLORS.bleed,600,{vx:(Math.random()-0.5)*18,vy:(Math.random()-0.5)*15-8});
    // 爪击动画
    this.attackAnim=250;this.attackType='slash';
    // 蛇吸血
    const evPs=this.passives.find(p=>p.type==='evolve');
    if(evPs&&this._evolved){const heal=Math.round(dmg*evPs.lifesteal);this.hp=Math.min(this.maxHp,this.hp+heal);if(heal>0)spawnFX('text',this.x,this.y-20,'+'+heal,'#ff3333',0.9);}
    if(t.hp<=0){t.hp=0;t.dead=true;
      const al=animals.filter(a=>!a.dead);
      showComment(`💀 ${this.emoji}${this.displayName} 击杀了 ${t.emoji}${t.displayName}！还剩${al.length}只`,'#ff4444');
      showToast(`💀 ${this.displayName} 击杀 ${t.displayName}`);
    }
    if(this.comboCount>0)this.comboNext=hpR>=0.7?150:120;
  }

  _growTo(cfg){
    const ox=this.x,oy=this.y,oteam=this.team,oowner=this.owner,odn=this.displayName;
    Object.assign(this,cfg);this.maxHp=cfg.hp;this.hp=cfg.hp;
    this.x=ox;this.y=oy;this.team=oteam;this.owner=oowner;this.displayName=odn;
    this.skills=(cfg.skills||[]).map(s=>({...s,cdTimer:Math.random()*s.cd*0.3}));
    this.rangedTimer=cfg.ranged?Math.random()*cfg.rangedCD:99999;
    this._chickPhase=cfg._chickPhase;this._chickTimer=0;this._canLay=cfg._canLay||false;
    this.isMinion=cfg.isMinion!==false;this.atkTimer=300;this.flashTimer=200;this.drawY=0;
    spawnFX('text',this.x,this.y-20,cfg.name+'!','#ffd700',1.2);
    showComment(`🐤 ${this.displayName} 成长为 ${cfg.name}！`,'#ffd700');
  }

  _followOwner(){
    const ox=this.owner.x+this.followOffsetX,oy=this.owner.y+this.followOffsetY;
    const dx=ox-this.x,dy=oy-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    const spd=this.speed*60;
    if(dist>this.size*1.2){this.vx+=(dx/dist)*spd*0.12;this.vy+=(dy/dist)*spd*0.12;const mag=Math.sqrt(this.vx*this.vx+this.vy*this.vy);if(mag>spd){this.vx=this.vx/mag*spd;this.vy=this.vy/mag*spd;}}
    else if(dist>this.size*0.3){this.vx+=(dx/dist)*spd*0.04;this.vy+=(dy/dist)*spd*0.04;}
    this._clampToArena();
  }

  _newDir(){
    const spd=this.speed*60*(0.92+Math.random()*0.16);
    const a=Math.random()*Math.PI*2;this.vx=Math.cos(a)*spd;this.vy=Math.sin(a)*spd;
  }

  _clampToArena(){
    const r=this.size;let bounced=false;
    if(this.x<arenaL+r){this.x=arenaL+r;bounced=true;}
    if(this.x>arenaR-r){this.x=arenaR-r;bounced=true;}
    if(this.y<arenaT+r){this.y=arenaT+r;bounced=true;}
    if(this.y>arenaB-r){this.y=arenaB-r;bounced=true;}
    if(bounced&&currentMap!=='ice')this._newDir();
    else if(bounced&&currentMap==='ice'){if(this.x<=arenaL+r||this.x>=arenaR-r)this.vx*=-0.7;if(this.y<=arenaT+r||this.y>=arenaB-r)this.vy*=-0.7;}
  }

  effDmg(){
    let d=this.damage;
    if(this.weakenPct>0)d*=(1-this.weakenPct);
    const rage=this.passives.find(p=>p.type==='rage');
    if(rage&&this.hp/this.maxHp<rage.threshold)d*=(1+rage.dmgBonus);
    // 牛狂暴之怒
    const br=this.passives.find(p=>p.type==='berserkRage');
    if(br){d*=(1+(1-this.hp/this.maxHp)*br.maxBonus);}
    // 老虎猎杀跳步加成
    if(this._hunting&&this.hopActive)d*=(1+(this.passives.find(p=>p.type==='huntMode')?.dmgBonus||0.8));
    if(this.dmgBoost>0)d*=(1+this.dmgBoost);
    if(this.divePhase>0)d*=this.diveSkill?.multiplier||3.0;
    if(this.chargeActive)d*=(this.skills.find(s=>s.type==='charge')?.dmgMult||1.8);
    if(this.critNext){d*=(this.skills.find(s=>s.type==='crit')?.multiplier||2);this.critNext=false;}
    else if(Math.random()<BASE_CRIT){d*=2;this._baseCrit=true;}
    else this._baseCrit=false;
    return Math.round(Math.max(1,d));
  }

  onHit(){this.lastHitTimer=3000;}

  onKill(){
    const cont=this.passives.find(p=>p.type==='contagion');
    if(cont){
      const nearby=animals.filter(a=>!a.dead&&a!==this&&Math.hypot(a.x-this.x,a.y-this.y)<cont.radius);
      nearby.forEach(a=>{a.dotEffects.push({dmg:cont.spreadDmg,dur:cont.duration,tick:1000,elapsed:0,tickAcc:0});spawnFX('text',a.x,a.y-20,'毒爆!','#8e44ad');
        for(let i=0;i<10;i++)spawnSpark(a.x+(Math.random()-0.5)*24,a.y+(Math.random()-0.5)*24,3,3+Math.random()*7,SPARK_COLORS.poison,900,{vx:(Math.random()-0.5)*35,vy:(Math.random()-0.5)*30-25});});
    }
  }

  dealDmg(target){
    if(target.passives.some(p=>p.type==='dodge')){
      const dodge=target.passives.find(p=>p.type==='dodge');
      if(Math.random()<dodge.chance){spawnFX('text',target.x,target.y-20,'闪避!','#87CEEB',1.2);
        showComment(`🌀 ${target.emoji}${target.displayName} 闪避了攻击！`,'#87CEEB');
        return;
      }
    }
    let dmg=this.effDmg();
    // 龟硬壳免伤
    const sd=target.passives.find(p=>p.type==='shellDefense');
    if(sd){const sdReduce=(1-target.hp/target.maxHp)*sd.maxReduce;dmg=Math.round(dmg*(1-sdReduce));}
    if(target.shieldActive)dmg=Math.round(dmg*(1-target.shieldReduce));
    if(target.shieldActive){const refl=0.25;const rdmg=Math.round(dmg*refl);this.hp-=rdmg;this.flashTimer=100;spawnFX('damage',this.x,this.y-16,rdmg,'#6b8e6b');if(this.hp<=0){this.hp=0;this.dead=true;}}
    const tUnstop=target.passives.some(p=>p.type==='unstoppable');
    if(this.stunNext&&!tUnstop&&target.stunImmune<=0){
      target.stunned=true;target.stunTimer=this.skills.find(s=>s.type==='stun')?.duration||1500;target.stunImmune=STUN_IMMUN;
      spawnFX('text',target.x,target.y-24,'眩晕!','#ffd700',1.3);triggerShake(5,200);
      for(let i=0;i<4;i++)spawnSpark(target.x,target.y,3,3+Math.random()*6,SPARK_COLORS.gold,800,{vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*15-10});
      showComment(`💫 ${this.displayName} 眩晕了 ${target.displayName}！`,'#ffd700');
    }else if(this.stunNext&&tUnstop){spawnFX('text',target.x,target.y-24,'免疫!','#b0a090');this.stunNext=false;}
    else if(this.stunNext&&target.stunImmune>0){spawnFX('text',target.x,target.y-24,'抵抗!','#aaa');this.stunNext=false;}
    this.stunNext=false;
    this.bleedNext=false;
    if(this.poisonNext){
      const sk=this.skills.find(s=>s.type==='poison');
      target.dotEffects.push({dmg:sk.damage||5,dur:sk.duration||4500,tick:sk.tickInterval||900,elapsed:0,tickAcc:0,isPoison:true});
      spawnFX('text',target.x,target.y-24,'中毒!','#8e44ad',1.2);
      if(sk.poisonCloud){for(let i=0;i<18;i++)spawnSpark(target.x+(Math.random()-0.5)*40,target.y+(Math.random()-0.5)*40,3,3+Math.random()*10,SPARK_COLORS.poison,1200,{vx:(Math.random()-0.5)*35,vy:(Math.random()-0.5)*35-25});}
      this.poisonNext=false;
    }
    target.hp-=dmg;target.flashTimer=100;target.onHit();target.atkTimer=Math.min(target.atkTimer,150);
    const dx=target.x-this.x,dy=target.y-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    target.vx+=(dx/dist)*KB*18;target.vy+=(dy/dist)*KB*12;
    const wasCharge=this.chargeActive||this._hunting&&this.hopActive;
    if(wasCharge){spawnFX('text',target.x,target.y-30,'撞击!','#cd853f',1.2);triggerShake(4,200);
      for(let i=0;i<8;i++)spawnSpark(target.x,target.y,3,4+Math.random()*8,SPARK_COLORS.quake,800,{vx:(Math.random()-0.5)*35,vy:(Math.random()-0.5)*25-10});
    }
    // 触发攻击动画
    this.attackAnim=350;
    if(this.id==='bear')this.attackType='punch';
    else if(this.id==='wolf')this.attackType='slash';
    else if(this.id==='tiger')this.attackType='pounce';
    else if(this.id==='boar')this.attackType='charge';
    else if(this.id==='bull')this.attackType='charge';
    else if(this.id==='elephant')this.attackType='trample';
    else if(this.id==='snake')this.attackType='bite';
    else if(this.id==='turtle')this.attackType='bite';
    else if(this.bodyType==='bird')this.attackType='peck';
    // 野猪撞击重置
    const furyPs=this.passives.find(p=>p.type==='furyCharge');
    if(furyPs&&!this.boarSpeedRes){this.boarSpeedRes=2000;const spd=this.speed*60*furyPs.hitReset;const mag=Math.hypot(this.vx,this.vy)||1;this.vx=this.vx/mag*spd;this.vy=this.vy/mag*spd;
      spawnFX('text',this.x,this.y-24,'速度重置!','#6b4a2a',1.1);
    }
    // 蛇吸血
    const evPs=this.passives.find(p=>p.type==='evolve');
    if(evPs&&this._evolved){const heal=Math.round(dmg*evPs.lifesteal);this.hp=Math.min(this.maxHp,this.hp+heal);if(heal>0)spawnFX('text',this.x,this.y-20,'+'+heal,'#ff3333',1.0);}
    for(let i=0;i<4;i++)spawnSpark(target.x+(Math.random()-0.5)*20,target.y+(Math.random()-0.5)*15,2,3+Math.random()*6,SPARK_COLORS.hit,800,{vx:(Math.random()-0.5)*25,vy:(Math.random()-0.5)*20-10});
    spawnFX('damage',target.x,target.y-16,dmg,this._baseCrit?'#ff6b6b':'#fff',this._baseCrit?1.4:1);
    if(this._baseCrit){spawnFX('text',target.x,target.y-30,'暴击!','#ffd700',1.3);showComment(`💥 暴击！${this.displayName} 造成 ${dmg} 点伤害`,'#ffd700');
      for(let i=0;i<6;i++)spawnSpark(target.x,target.y,4,5+Math.random()*10,SPARK_COLORS.gold,800,{vx:(Math.random()-0.5)*35,vy:(Math.random()-0.5)*25-18});}
    // 狼连击触发
    const fcPs=this.passives.find(p=>p.type==='frenzyCombo');
    if(fcPs&&!this.comboTimer&&target.hp>0){
      const hpR=this.hp/this.maxHp;
      if(hpR>=0.7){this.comboTimer=400;this.comboCount=1;this.comboNext=150;this.attackAnim=400;this.attackType='slash';}
      else if(hpR<0.3){this.comboTimer=360;this.comboCount=2;this.comboNext=120;this.attackAnim=360;this.attackType='slash';}
    }
    if(target.hp<=0){target.hp=0;target.dead=true;this.onKill();
      const al=animals.filter(a=>!a.dead);
      showComment(`💀 ${this.emoji}${this.displayName} 击杀了 ${target.emoji}${target.displayName}！还剩${al.length}只`,'#ff4444');
      showToast(`💀 ${this.displayName} 击杀 ${target.displayName}`);
    }
  }

  useSkill(skill,enemies){
    if(this.isMinion&&!this._canLay)return;
    if(skill.smartRange&&enemies.filter(e=>!e.dead&&Math.hypot(e.x-this.x,e.y-this.y)<skill.smartRange).length===0)return;
    skill.cdTimer=skill.cd;
    const t=enemies.length>0?enemies[0]:null;
    switch(skill.type){
      case'stun':this.stunNext=true;spawnFX('text',this.x,this.y-20,skill.name+'!','#ff6b6b',1.3);showComment(`🐻 ${this.displayName} 举起巨掌——眩晕拍击！`,'#ffd700');break;
      case'bleed':this.bleedNext=true;spawnFX('text',this.x,this.y-20,skill.name+'!','#e74c3c',1.3);showComment(`🩸 ${this.displayName} 释放流血撕咬`,'#e74c3c');break;
      case'poison':this.poisonNext=true;spawnFX('text',this.x,this.y-20,skill.name+'!','#8e44ad',1.3);showComment(`🧪 ${this.displayName} 喷出毒液！`,'#8e44ad');break;
      case'crit':this.critNext=true;spawnFX('text',this.x,this.y-20,skill.name+'!','#ffd700',1.3);break;
      case'diveV2':
        if(t&&!t.dead){
          const ld=Math.hypot(t.x-this.x,t.y-this.y);
          if(ld>skill.lockRange){skill.cdTimer=skill.cd;break;}
          this.divePhase=1;this.divePhaseTimer=skill.climbTime;this.diveTarget=t;this.diveSkill=skill;
          this.diveLockX=t.x;this.diveLockY=t.y;
          spawnFX('text',this.x,this.y-24,'升空!','#87CEEB',1.3);
          showComment(`🦅 ${this.displayName} 升空盘旋，锁定目标！`,'#87CEEB');
        }
        break;
      case'charge':
        if(t&&!t.dead){
          this.chargeTimer=skill.duration;this.chargeActive=true;
          const dx=t.x-this.x,dy=t.y-this.y,dist=Math.hypot(dx,dy)||1;
          this.vx=(dx/dist)*this.speed*60*skill.speedMult;this.vy=(dy/dist)*this.speed*60*skill.speedMult;
          spawnFX('text',this.x,this.y-20,skill.name+'!','#cd853f',1.3);
          for(let i=0;i<8;i++)spawnDust(this.x,this.y+this.size*0.3,4+Math.random()*10,'#c4a882',900,{vx:(Math.random()-0.5)*25,vy:5+Math.random()*12});
          showComment(`🐂 ${this.displayName} 发起冲撞！`,'#cd853f');
        }
        break;
      case'roar':
        if(t){t.weakenPct=skill.weakenPct;t.weakenTimer=skill.duration;spawnFX('text',t.x,t.y-20,'攻击↓','#8e44ad',1.2);}
        spawnFX('text',this.x,this.y-20,'咆哮!','#e8a87c',1.3);triggerShake(4,200);break;
      case'quake':
        if(skill.shakeIntensity)triggerShake(skill.shakeIntensity,skill.shakeTime);
        const qr=skill.quakeRange||180;
        for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2,d=qr*(0.2+Math.random()*0.8);groundCracks.push({x:this.x+Math.cos(a)*d,y:this.y+Math.sin(a)*d,life:skill.shakeTime,age:0,len:15+Math.random()*25,angle:Math.random()*Math.PI*2});}
        for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2,d=qr*(0.1+Math.random()*0.9);spawnDust(this.x+Math.cos(a)*d,this.y+Math.sin(a)*d,5+Math.random()*12,'#8a7a58',skill.shakeTime,{vx:(Math.random()-0.5)*15,vy:-10-Math.random()*20});}
        enemies.forEach(e=>{if(Math.hypot(e.x-this.x,e.y-this.y)>qr)return;const dd=skill.damage||0;e.hp-=dd;if(e.hp<=0){e.hp=0;e.dead=true;}e.flashTimer=120;
          const eu=e.passives.some(p=>p.type==='unstoppable');if(!eu&&e.stunImmune<=0){e.stunned=true;e.stunTimer=skill.stunDuration;e.stunImmune=STUN_IMMUN;}
          spawnFX('damage',e.x,e.y-16,dd,'#cd853f',1.1);for(let i=0;i<4;i++)spawnSpark(e.x+(Math.random()-0.5)*20,e.y+(Math.random()-0.5)*15,2,3+Math.random()*6,SPARK_COLORS.quake,800,{vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*15-8});});
        spawnFX('text',this.x,this.y-20,skill.name+'!','#cd853f',1.3);showComment(`🌍 ${this.displayName} 发动地动山摇！`,'#cd853f');break;
      case'shield':this.shieldActive=true;this.shieldTimer=skill.duration;this.shieldReduce=skill.reducePct;spawnFX('text',this.x,this.y-20,'缩壳!','#6b8e6b',1.3);
        for(let i=0;i<8;i++)spawnSpark(this.x+(Math.random()-0.5)*this.size,this.y+(Math.random()-0.5)*this.size,2,3+Math.random()*5,SPARK_COLORS.green,800,{vx:(Math.random()-0.5)*15,vy:(Math.random()-0.5)*15-5});
        showComment(`🐢 ${this.displayName} 缩入壳中！`,'#6b8e6b');break;
      case'lay_egg':eggs.push(new Egg(this.x,this.y,this));spawnFX('text',this.x,this.y-20,'下蛋!','#f4a460',1.3);showComment(`🥚 ${this.displayName} 下了一个蛋！`,'#f4a460');break;
    }
  }

  rangedAttack(target){
    if(!target||target.dead)return;this.rangedTimer=this.rangedCD;
    const missChance=this.rangedMiss||0;const miss=Math.random()<missChance;
    let pdata;if(miss){const a=Math.random()*Math.PI*2,sp=this.rangedSpeed*55;pdata={emoji:this.rangedEmoji,damage:0,target:null,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1000,_team:this.team};}
    else{pdata={emoji:this.rangedEmoji,damage:this.rangedDmg,speed:this.rangedSpeed,target:target,_team:this.team};}
    spawnFX('projectile',this.x,this.y-6,pdata,miss?'#999':'#f4a460');
    if(miss)spawnFX('text',this.x,this.y-16,'偏了','#999');
  }

  // ==================== v3.0 身体绘制：3D渐变+攻击动画+阶段形态 ====================
  drawBody(ctx,renderY,bScale){
    const s=this.size,bs=s*bScale;
    const bx=this.x,by=renderY+s*0.18;
    const bodyType=this.bodyType||'quad';
    const id=this.id||'';
    const t=this.aliveTimer;

    // 地面阴影
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath();ctx.ellipse(bx,renderY+s*0.43+2,bs*0.44,bs*0.1,0,0,Math.PI*2);ctx.fill();

    // ========== 🐍蛇 ==========
    if(bodyType==='snake'){
      ctx.lineCap='round';ctx.lineJoin='round';
      const segCount=8;
      const evPs=this.passives.find(p=>p.type==='evolve');
      const isEvolved=evPs&&this._evolved;
      for(let i=segCount-1;i>=0;i--){
        const frac=i/segCount;
        const sx=bx+Math.sin(t/350+i*1.2)*bs*0.18;
        const sy=by-bs*0.45+frac*bs*0.85;
        const sw=bs*0.32*(1-frac*0.65);
        const hue=isEvolved?140:120;const sat=isEvolved?30:50;const lit=isEvolved?20:35;
        ctx.fillStyle=`hsl(${hue+frac*20},${sat-frac*20}%,${lit-frac*8}%)`;
        ctx.beginPath();
        for(let j=0;j<6;j++){const a=Math.PI*2/6*j;const px=sx+Math.cos(a)*sw,py=sy+Math.sin(a)*sw*0.8;j===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
        ctx.closePath();ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=0.8;ctx.stroke();
      }
      // 攻击动画：头部前冲
      const hxOff=this.attackType==='bite'&&this.attackAnim>0?atkOffset*(this.comboCount>0?1.5:1):0;
      const hs=isEvolved?1.1:1;
      const hx=bx+Math.sin(t/350)*bs*0.15+hxOff,hy=by-bs*0.45;
      ctx.fillStyle=isEvolved?'#1a5a30':'#3d8d52';ctx.beginPath();
      ctx.moveTo(hx,hy-bs*0.25*hs);ctx.lineTo(hx+bs*0.18*hs,hy);ctx.lineTo(hx,hy+bs*0.12*hs);ctx.lineTo(hx-bs*0.18*hs,hy);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1.2*hs;ctx.stroke();
      ctx.strokeStyle='#e74c3c';ctx.lineWidth=1.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(hx+bs*0.14*hs,hy);ctx.lineTo(hx+bs*0.28*hs,hy-bs*0.1*hs);ctx.moveTo(hx+bs*0.22*hs,hy);ctx.lineTo(hx+bs*0.32*hs,hy+bs*0.08*hs);ctx.stroke();
      if(isEvolved){ctx.strokeStyle='rgba(255,0,0,0.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(bx,by-bs*0.1,bs*0.55,0,Math.PI*2);ctx.stroke();}
      return;
    }

    // ========== 🐢乌龟 ==========
    if(bodyType==='turtle'){
      const sdPs=this.passives.find(p=>p.type==='shellDefense');
      const sdReduce=sdPs?(1-hpR)*sdPs.maxReduce:0;
      const shellCol=`rgb(${Math.round(90-sdReduce*60)},${Math.round(122-sdReduce*60)},${Math.round(74-sdReduce*40)})`;
      ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.ellipse(bx,by+bs*0.08,bs*0.55,bs*0.42,0,0,Math.PI*2);ctx.fill();
      const shellGrad=ctx.createRadialGradient(bx-bs*0.1,by-bs*0.15,bs*0.05,bx,by,bs*0.55);
      shellGrad.addColorStop(0,'#9ab87a');shellGrad.addColorStop(0.5,shellCol);shellGrad.addColorStop(1,`rgb(${Math.round(58-sdReduce*40)},${Math.round(90-sdReduce*50)},${Math.round(42-sdReduce*30)})`);
      ctx.fillStyle=shellGrad;
      ctx.beginPath();const octR=bs*0.52;
      for(let i=0;i<8;i++){const a=Math.PI*2/8*i-Math.PI/8;const px=bx+Math.cos(a)*octR,py=by+Math.sin(a)*octR*0.78;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2.5;ctx.stroke();
      // 裂纹（低血量时）
      if(sdReduce>0.15){ctx.strokeStyle=`rgba(0,0,0,${sdReduce*0.5})`;ctx.lineWidth=1;
        for(let c=0;c<Math.floor(sdReduce*8);c++){const ca=Math.random()*Math.PI*2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(ca)*octR*(0.3+Math.random()*0.5),by+Math.sin(ca)*octR*(0.3+Math.random()*0.5));ctx.stroke();}
      }
      // 头
      const hxOff2=this.attackType==='bite'&&this.attackAnim>0?atkOffset:0;
      ctx.fillStyle='#7a9a5a';ctx.beginPath();ctx.ellipse(bx+hxOff2,by-bs*0.4,bs*0.18,bs*0.14,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='#222';ctx.beginPath();ctx.arc(bx+bs*0.08+hxOff2,by-bs*0.43,bs*0.04,0,Math.PI*2);ctx.fill();
      // 脚
      ctx.fillStyle='#7a9a5a';
      [[-bs*0.35,bs*0.15],[-bs*0.3,bs*0.35],[bs*0.3,bs*0.35],[bs*0.35,bs*0.15]].forEach(([lx,ly])=>{
        ctx.beginPath();ctx.ellipse(bx+lx,by+ly,bs*0.16,bs*0.08,-0.3,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1;ctx.stroke();
        for(let toe=-1;toe<=1;toe++){ctx.beginPath();ctx.moveTo(bx+lx,by+ly+bs*0.08);ctx.lineTo(bx+lx+toe*bs*0.05,by+ly+bs*0.14);ctx.stroke();}
      });
      // 免伤护盾显示

    }

    // ========== 以下全部用贝塞尔重绘，3D渐变+阶段外观 ==========
    const breath=1+Math.sin(t/500)*0.04;

    // === 🐻熊 ===
    if(id==='bear'){
      const isHib=this._hibernateV2;
      const bearScale=isHib?0.85:1;
      const bh=bs*0.38*breath*bearScale,bw=bs*0.48*bearScale;
      const bearColor=isHib?'#c8b090':this.color;
      const bgr=ctx.createLinearGradient(bx,by-bh,bx,by+bh);
      bgr.addColorStop(0,isHib?'#d8c0a0':'#c09060');bgr.addColorStop(0.4,bearColor);bgr.addColorStop(1,isHib?'#9b6a40':'#6b3a20');
      ctx.fillStyle=bgr;
      ctx.beginPath();
      ctx.moveTo(bx-bw*0.6,by+bh*0.8);
      ctx.quadraticCurveTo(bx-bw*1.05,by+bh*0.1,bx-bw*0.85,by-bh*0.5);
      ctx.quadraticCurveTo(bx-bw*0.35,by-bh*0.85,bx+bw*0.35,by-bh*0.85);
      ctx.quadraticCurveTo(bx+bw*0.85,by-bh*0.5,bx+bw*1.05,by+bh*0.1);
      ctx.quadraticCurveTo(bx+bw*0.6,by+bh*0.8,bx+bw*0.3,by+bh*0.9);
      ctx.quadraticCurveTo(bx-bw*0.3,by+bh*0.9,bx-bw*0.6,by+bh*0.8);
      ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=2;ctx.stroke();
      // 头
      const hgr=ctx.createRadialGradient(bx-bs*0.04,by-bh*0.75,bs*0.02,bx,by-bh*0.7,bs*0.22*bearScale);
      hgr.addColorStop(0,isHib?'#d8c0a0':'#c89868');hgr.addColorStop(1,isHib?'#a08050':'#8b6340');
      ctx.fillStyle=hgr;ctx.beginPath();ctx.arc(bx,by-bh*0.7,bs*0.2*bearScale,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1.5;ctx.stroke();
      // 耳朵
      ctx.fillStyle=isHib?'#a08050':'#8b5a38';
      [[-bs*0.12*bearScale,-bh*0.88],[bs*0.10*bearScale,-bh*0.88]].forEach(([ex,ey])=>{
        ctx.beginPath();ctx.arc(bx+ex,by+ey,bs*0.08*bearScale,0,Math.PI*2);ctx.fill();
      });
      // 攻击动画：右掌前挥
      const pp=this.attackType==='punch'&&this.attackAnim>0?atkOffset:0;
      if(pp>0){ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=3;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(bx+bw*0.6,by+bh*0.3);ctx.quadraticCurveTo(bx+bw*0.9,by+bh*0.1+pp*0.5,bx+bw*1.0+pp,by+bh*0.2);ctx.stroke();}
      // 眼睛
      if(!isHib){ctx.fillStyle=hpR<0.3?'#ff0000':'#1a0a00';ctx.beginPath();ctx.arc(bx-bs*0.04,by-bh*0.74,bs*0.035,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(bx+bs*0.08,by-bh*0.74,bs*0.035,0,Math.PI*2);ctx.fill();}
      else{ctx.fillStyle='#666';ctx.beginPath();ctx.arc(bx-bs*0.04,by-bh*0.74,bs*0.02,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(bx+bs*0.06,by-bh*0.74,bs*0.02,0,Math.PI*2);ctx.fill();}
      // 腿
      ctx.fillStyle=isHib?'#9b6a40':'#7a4a28';
      [[-bs*0.2,-bs*0.03,bs*0.12,bs*0.24]].forEach(lx=>{ctx.beginPath();ctx.ellipse(bx+lx,by+bh*0.7,bs*0.12,bs*0.15,0,0,Math.PI*2);ctx.fill();});
      if(isHib){ctx.font='14px serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('💤',bx,by-bh*1.1);}
      if(this.passives.some(p=>p.type==='rage')&&hpR<0.3){ctx.strokeStyle='rgba(255,70,30,0.5)';ctx.lineWidth=2.5;ctx.setLineDash([2,3]);ctx.lineDashOffset=t/50;ctx.beginPath();ctx.arc(bx,by-bh*0.3,bs*0.55,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
      return;
    }

    // === 🐺狼 ===
    if(id==='wolf'){
      const wh=bs*0.26*breath,ww=bs*0.52;
      const wolfCol=hpR>=0.7?'#d8d8d8':hpR>=0.3?'#a0a0a0':'#606060';
      const wgr=ctx.createLinearGradient(bx,by-wh,bx,by+wh);
      wgr.addColorStop(0,hpR>=0.7?'#e8e8e8':hpR>=0.3?'#c0c0c0':'#808080');
      wgr.addColorStop(0.4,wolfCol);wgr.addColorStop(1,hpR>=0.7?'#707070':hpR>=0.3?'#505050':'#303030');
      ctx.fillStyle=wgr;

      ctx.moveTo(bx,by-wh*1.0);
      ctx.quadraticCurveTo(bx+ww*0.8,by-wh*0.2,bx+ww*0.65,by+wh*0.7);
      ctx.quadraticCurveTo(bx+ww*0.2,by+wh*0.9,bx-ww*0.2,by+wh*0.9);

      ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=1.8;ctx.stroke();
      // 头
      ctx.fillStyle=hpR>=0.7?'#e0e0e0':hpR>=0.3?'#b0b0b0':'#707070';ctx.beginPath();ctx.ellipse(bx,by-wh*0.85,bs*0.15,bs*0.12,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c8c8c8';ctx.beginPath();ctx.moveTo(bx+bs*0.08,by-wh*0.82);ctx.quadraticCurveTo(bx+bs*0.22,by-wh*0.85,bx+bs*0.18,by-wh*0.75);
      ctx.quadraticCurveTo(bx+bs*0.10,by-wh*0.72,bx+bs*0.03,by-wh*0.78);ctx.fill();
      // 攻击动画：爪痕
      if(this.attackType==='slash'&&this.attackAnim>0){
        const sp=this.attackAnim/350;const swingDir=this.comboCount%2===0?1:-1;
        ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2.5;ctx.lineCap='round';
        for(let s=0;s<3;s++){const sx=bx+swingDir*bs*0.1,dy=by-wh*0.1-sp*bs*0.3+s*bs*0.06;ctx.beginPath();ctx.moveTo(sx,dy);ctx.lineTo(sx+swingDir*bs*0.2,dy-bs*0.1);ctx.stroke();}
      }
      // 耳朵
      ctx.fillStyle='#a0a0a0';
      [[-bs*0.1,-wh*0.95],[bs*0.02,-wh*0.93]].forEach(([ex,ey])=>{
        ctx.beginPath();ctx.moveTo(bx+ex,by+ey);ctx.lineTo(bx+ex-bs*0.08,by+ey-bs*0.18);ctx.lineTo(bx+ex+bs*0.08,by+ey-bs*0.16);ctx.closePath();ctx.fill();
      });
      // 眼睛
      ctx.fillStyle=hpR<0.3?'#ff0000':'#ffcc00';ctx.beginPath();ctx.arc(bx-bs*0.08,by-wh*0.89,bs*0.03,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(bx+bs*0.04,by-wh*0.87,bs*0.03,0,Math.PI*2);ctx.fill();
      // 蓬尾
      const tailSway=Math.sin(t/400)*bs*0.12;
      const tg=ctx.createLinearGradient(bx+ww*0.5,by-wh*0.6,bx+ww*1.1,by-wh*0.8);
      tg.addColorStop(0,wolfCol);tg.addColorStop(0.6,hpR>=0.7?'#c0c0c0':'#888');tg.addColorStop(1,hpR>=0.7?'#e8e8e8':'#999');
      ctx.fillStyle=tg;
      ctx.beginPath();ctx.moveTo(bx+ww*0.5,by-wh*0.1);
      ctx.quadraticCurveTo(bx+ww*0.85,by-wh*0.3+tailSway,bx+ww*1.05,by-wh*0.6+tailSway*0.7);
      ctx.quadraticCurveTo(bx+ww*0.95,by-wh*0.45+tailSway*0.5,bx+ww*0.55,by-wh*0.15);
      ctx.fill();
      // 血渍（三阶段）
      if(hpR<0.3){ctx.fillStyle='rgba(200,0,0,0.3)';ctx.beginPath();ctx.arc(bx+bs*0.12,by-wh*0.65,bs*0.04,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bx-bs*0.06,by-wh*0.68,bs*0.03,0,Math.PI*2);ctx.fill();}
      return;
    }

    // === 🐂牛 ===
    if(id==='bull'){
      const nh=bs*0.34*breath,nw=bs*0.50;
      const ragePct=(1-hpR)*0.8; // 狂暴比例
      const bullCol=`rgb(${Math.round(200+ragePct*55)},${Math.round(152-ragePct*100)},${Math.round(104-ragePct*70)})`;
      const ngr=ctx.createLinearGradient(bx,by-nh,bx,by+nh);
      ngr.addColorStop(0,bullCol);ngr.addColorStop(0.5,`rgb(${Math.round(184-ragePct*60)},${Math.round(104-ragePct*50)},${Math.round(64-ragePct*30)})`);ngr.addColorStop(1,`rgb(${Math.round(120-ragePct*40)},${Math.round(80-ragePct*30)},${Math.round(48-ragePct*20)})`);
      ctx.fillStyle=ngr;
      ctx.beginPath();
      ctx.moveTo(bx-nw*0.8,by+nh*0.75);
      ctx.quadraticCurveTo(bx-nw*1.05,by+nh*0.1,bx-nw*0.95,by-nh*0.4);
      ctx.quadraticCurveTo(bx-nw*0.35,by-nh*0.85,bx+nw*0.35,by-nh*0.85);
      ctx.quadraticCurveTo(bx+nw*0.95,by-nh*0.4,bx+nw*1.05,by+nh*0.1);
      ctx.quadraticCurveTo(bx+nw*0.8,by+nh*0.75,bx+nw*0.25,by+nh*0.85);

      // 头
