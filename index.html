      hngr.addColorStop(0,'#e0c098');hngr.addColorStop(1,bullCol);
      ctx.fillStyle=hngr;ctx.beginPath();
      ctx.moveTo(bx-bs*0.12,by-nh*0.58);ctx.lineTo(bx-bs*0.14,by-nh*0.92);ctx.quadraticCurveTo(bx,by-nh*1.02,bx+bs*0.14,by-nh*0.92);
      ctx.lineTo(bx+bs*0.12,by-nh*0.58);ctx.closePath();ctx.fill();
      // 角（发光）
      ctx.strokeStyle=ragePct>0.3?`rgba(255,200,50,${0.5+ragePct})`:'#f0e8d8';ctx.lineWidth=3.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(bx-bs*0.10,by-nh*0.78);ctx.bezierCurveTo(bx-bs*0.25,by-nh*1.2,bx-bs*0.15,by-nh*1.3,bx+bs*0.00,by-nh*1.1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(bx+bs*0.06,by-nh*0.78);ctx.bezierCurveTo(bx+bs*0.20,by-nh*1.15,bx+bs*0.28,by-nh*1.15,bx+bs*0.18,by-nh*0.98);ctx.stroke();
      // 攻击动画：低头前冲
      if(this.attackType==='charge'&&this.attackAnim>0){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.arc(bx-bs*0.1,by+nh*0.1,bs*0.12,0,Math.PI*2);ctx.fill();}
      ctx.fillStyle='#986840';
      [[-bs*0.18,-bs*0.03,bs*0.10,bs*0.24]].forEach(lx=>{ctx.beginPath();ctx.ellipse(bx+lx,by+nh*0.65,bs*0.12,bs*0.14,0,0,Math.PI*2);ctx.fill();});
      // 鼻孔冒气
      if(ragePct>0.2&&Math.random()<0.3){ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.arc(bx+bs*0.1,by-nh*0.8,2+ragePct*4,0,Math.PI*2);ctx.fill();}
      return;
    }

    // === 🦅鹰 ===
    if(id==='eagle'){
      const eh=bs*0.30*breath,ew=bs*0.35;
      // 俯冲倾斜
      const diveAngle=this.divePhase===3?(1-this.divePhaseTimer/(this.diveSkill?.diveTime||400))*0.8:0;
      const cosA=Math.cos(diveAngle),sinA=Math.sin(diveAngle);
      const egr=ctx.createLinearGradient(bx,by-eh,bx,by+eh);
      egr.addColorStop(0,'#f8f0e0');egr.addColorStop(0.3,'#e8d8c0');egr.addColorStop(0.7,'#5a3820');egr.addColorStop(1,'#3a2010');
      ctx.fillStyle=egr;
      ctx.beginPath();
      ctx.moveTo(bx,by-eh*0.9);
      ctx.quadraticCurveTo(bx+ew*0.7,by-eh*0.2,bx+ew*0.6,by+eh*0.65);
      ctx.quadraticCurveTo(bx+ew*0.15,by+eh*0.8,bx-ew*0.15,by+eh*0.8);
      ctx.quadraticCurveTo(bx-ew*0.6,by+eh*0.65,bx-ew*0.7,by-eh*0.2);
      ctx.quadraticCurveTo(bx*cosA+by*sinA,by-eh*0.88,bx,by-eh*0.9);
      ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1.5;ctx.stroke();
      // 地面黑影（盘旋/俯冲时）
      if(this.divePhase>=2){ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(this.diveLockX||bx,by+eh+bs*0.2,bs*0.5,bs*0.12,0,0,Math.PI*2);ctx.fill();}
      // 范围圈（盘旋时）
      if(this.divePhase===2&&this.diveSkill){ctx.strokeStyle='rgba(255,50,50,0.4)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.lineDashOffset=-t/20;ctx.beginPath();ctx.arc(this.diveLockX||bx,this.diveLockY||by,this.diveSkill.lockRange,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
      // 白头
      const hdr=ctx.createRadialGradient(bx,by-eh*0.75,bs*0.02,bx,by-eh*0.7,bs*0.15);
      hdr.addColorStop(0,'#ffffff');hdr.addColorStop(1,'#e8e0d0');
      ctx.fillStyle=hdr;ctx.beginPath();ctx.arc(bx,by-eh*0.7,bs*0.13,0,Math.PI*2);ctx.fill();
      // 翅（俯冲时半收拢）
      const flapMult=this.divePhase===3?0.3:this.divePhase===1?1.3:1;
      [-1,1].forEach(dir=>{
        ctx.fillStyle='#4a3020';ctx.beginPath();
        ctx.moveTo(bx+dir*ew*0.3,by-eh*0.2);
        ctx.quadraticCurveTo(bx+dir*ew*0.75*flapMult,by-eh*0.4-wingFlap*bs*flapMult,bx+dir*ew*1.2*flapMult,by-eh*0.6-wingFlap*bs*flapMult);
        ctx.quadraticCurveTo(bx+dir*ew*0.9*flapMult,by-eh*0.1,bx+dir*ew*0.5,by+eh*0.2);
        ctx.quadraticCurveTo(bx+dir*ew*0.4,by+eh*0.05,bx+dir*ew*0.3,by-eh*0.2);
        ctx.fill();
      });
      // 钩喙
      ctx.fillStyle='#f0b830';ctx.beginPath();
      ctx.moveTo(bx+bs*0.06,by-eh*0.78);ctx.lineTo(bx+bs*0.2,by-eh*0.72);ctx.quadraticCurveTo(bx+bs*0.24,by-eh*0.66,bx+bs*0.16,by-eh*0.60);
      ctx.lineTo(bx+bs*0.04,by-eh*0.64);ctx.closePath();ctx.fill();
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(bx-bs*0.01,by-eh*0.72,bs*0.035,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx-bs*0.02,by-eh*0.74,bs*0.015,0,Math.PI*2);ctx.fill();
      return;
    }

    // === 🐯老虎 ===
    if(id==='tiger'){
      const lh=bs*0.32*breath,lw=bs*0.46;
      const huntMode=this._hunting;
      const tgrCol=huntMode?`rgb(${Math.round(240+15)},${Math.round(120-30)},${Math.round(20-10)})`:'#e8b870';
      const lgr=ctx.createLinearGradient(bx,by-lh,bx,by+lh);
      lgr.addColorStop(0,huntMode?'#f0a030':'#f0c878');lgr.addColorStop(0.5,tgrCol);lgr.addColorStop(1,huntMode?'#803010':'#885830');
      ctx.fillStyle=lgr;
      ctx.beginPath();
      ctx.moveTo(bx,by-lh*1.05);
      ctx.quadraticCurveTo(bx+lw*0.7,by-lh*0.25,bx+lw*0.6,by+lh*0.75);
      ctx.quadraticCurveTo(bx+lw*0.15,by+lh*0.9,bx-lw*0.15,by+lh*0.9);
      ctx.quadraticCurveTo(bx-lw*0.6,by+lh*0.75,bx-lw*0.7,by-lh*0.25);
      ctx.quadraticCurveTo(bx*Math.cos(-0.02)+by*Math.sin(-0.02),by-lh*1.0,bx,by-lh*1.05);
      ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=2;ctx.stroke();
      // 条纹（猎杀形态更明显）
      ctx.strokeStyle=huntMode?'rgba(0,0,0,0.5)':'rgba(0,0,0,0.2)';ctx.lineWidth=huntMode?2.5:1.5;
      for(let st=0;st<6;st++){const sy=by-lh*0.8+st*lh*0.25;ctx.beginPath();ctx.moveTo(bx-lw*0.3,Math.max(by-lh*0.6,sy));ctx.lineTo(bx-bs*0.02,sy+4);ctx.lineTo(bx+lw*0.3,sy+2);ctx.stroke();}
      // 头
      const faceGr=ctx.createRadialGradient(bx-bs*0.02,by-lh*0.75,bs*0.02,bx,by-lh*0.72,bs*0.15);
      faceGr.addColorStop(0,huntMode?'#f0c060':'#f0d898');faceGr.addColorStop(1,huntMode?'#c87020':'#c89850');
      ctx.fillStyle=faceGr;ctx.beginPath();ctx.arc(bx,by-lh*0.72,bs*0.13,0,Math.PI*2);ctx.fill();
      // 眼睛（猎杀发光）
      if(huntMode){ctx.strokeStyle='rgba(255,200,50,0.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(bx-bs*0.06,by-lh*0.75,bs*0.04,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(bx+bs*0.06,by-lh*0.75,bs*0.04,0,Math.PI*2);ctx.stroke();}
      ctx.fillStyle=hpR<0.3?'#ff0000':'#ffcc00';ctx.beginPath();ctx.arc(bx-bs*0.07,by-lh*0.75,bs*0.025,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(bx+bs*0.05,by-lh*0.75,bs*0.025,0,Math.PI*2);ctx.fill();
      // 鼻子
      ctx.fillStyle='#4a2010';ctx.beginPath();ctx.moveTo(bx,by-lh*0.68);ctx.lineTo(bx-bs*0.04,by-lh*0.64);ctx.lineTo(bx+bs*0.04,by-lh*0.64);ctx.closePath();ctx.fill();
      // 尾巴（条纹环）
      const lsSway=Math.sin(t/380)*bs*0.1;
      ctx.strokeStyle=huntMode?'#c87020':'#c89850';ctx.lineWidth=3;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(bx+lw*0.55,by-lh*0.1);ctx.quadraticCurveTo(bx+lw*0.85,by-lh*0.5+lsSway,bx+lw*0.55,by-lh*0.4+lsSway*0.5);ctx.stroke();
      // 猎杀拖尾
      if(huntMode){for(let i=0;i<3;i++){const px=bx-this.vx*0.1+i*8,py=renderY-this.vy*0.1;ctx.fillStyle='rgba(240,160,48,0.2)';ctx.beginPath();ctx.arc(px+Math.random()*6,py+Math.random()*6,2,0,Math.PI*2);ctx.fill();}}
      return;
    }

    // === 🐗野猪 ===
    if(id==='boar'){
      const bh=bs*0.32*breath,bw=bs*0.48;
      const furyPs=this.passives.find(p=>p.type==='furyCharge');
      const furyPct=furyPs?Math.max(0,(1-hpR)*furyPs.speedBonus):0;
      const boarCol=`rgb(${Math.round(107+furyPct*100)},${Math.round(74-furyPct*40)},${Math.round(42-furyPct*20)})`;
      // 楔形身体（前高后低）
      const bgr=ctx.createLinearGradient(bx,by-bh,bx,by+bh);
      bgr.addColorStop(0,boarCol);bgr.addColorStop(1,`rgb(${Math.round(58-furyPct*20)},${Math.round(40-furyPct*15)},${Math.round(16-furyPct*5)})`);
      ctx.fillStyle=bgr;
      ctx.beginPath();
      ctx.moveTo(bx-bw*0.4,by+bh*0.7);
      ctx.quadraticCurveTo(bx-bw*0.9,by+bh*0.3,bx-bw*0.7,by-bh*0.3);
      ctx.quadraticCurveTo(bx-bw*0.3,by-bh*0.8,bx+bw*0.2,by-bh*0.75);
      ctx.quadraticCurveTo(bx+bw*0.7,by-bh*0.2,bx+bw*0.5,by+bh*0.5);
      ctx.quadraticCurveTo(bx+bw*0.2,by+bh*0.75,bx-bw*0.4,by+bh*0.7);
      ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=2;ctx.stroke();
      // 鬃毛脊线
      ctx.fillStyle='rgba(0,0,0,0.5)';
      for(let hi=0;hi<7;hi++){const hx=bx-bw*0.5+hi*bw*0.15,hy=by-bh*0.8+hi*bh*0.06;const hh=4+furyPct*6;ctx.beginPath();ctx.moveTo(hx-1,hy);ctx.lineTo(hx,hy-hh);ctx.lineTo(hx+1,hy);ctx.fill();}
      // 獠牙
      ctx.fillStyle=furyPct>0.3?'#ffe8c0':'#e8d8b0';ctx.beginPath();ctx.moveTo(bx+bs*0.08,by-bh*0.35);ctx.quadraticCurveTo(bx+bs*0.22,by-bh*0.15,bx+bs*0.10,by-bh*0.05);ctx.quadraticCurveTo(bx+bs*0.06,by-bh*0.15,bx+bs*0.05,by-bh*0.30);ctx.fill();
      ctx.beginPath();ctx.moveTo(bx+bs*0.06,by-bh*0.38);ctx.quadraticCurveTo(bx+bs*0.18,by-bh*0.20,bx+bs*0.08,by-bh*0.08);ctx.quadraticCurveTo(bx+bs*0.04,by-bh*0.18,bx+bs*0.04,by-bh*0.33);ctx.fill();
      // 头
      ctx.fillStyle=boarCol;ctx.beginPath();ctx.ellipse(bx+bs*0.05,by-bh*0.5,bs*0.14,bs*0.12,0,0,Math.PI*2);ctx.fill();
      // 眼
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(bx+bs*0.12,by-bh*0.55,bs*0.02,0,Math.PI*2);ctx.fill();
      // 短腿
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2;ctx.lineCap='round';
      [[-bs*0.15,-bs*0.05,bs*0.06,bs*0.18]].forEach(lx=>{ctx.beginPath();ctx.moveTo(bx+lx,by+bh*0.55);ctx.lineTo(bx+lx,by+bh*0.75);ctx.stroke();});
      // 撞击尘
      if(this.attackType==='charge'&&this.attackAnim>0){ctx.fillStyle='rgba(180,150,120,0.3)';ctx.beginPath();ctx.arc(bx-bs*0.2,by+bh*0.6,bs*0.1,0,Math.PI*2);ctx.fill();}
      return;
    }

    // === 🐘大象 ===
    if(id==='elephant'){
      const eh=bs*0.36*breath,ew=bs*0.56;
      const egr=ctx.createLinearGradient(bx,by-eh,bx,by+eh);
      egr.addColorStop(0,'#c8b8a8');egr.addColorStop(0.5,'#a89888');egr.addColorStop(1,'#706050');
      ctx.fillStyle=egr;
      ctx.beginPath();
      ctx.moveTo(bx-ew*0.85,by+eh*0.65);
      ctx.quadraticCurveTo(bx-ew*1.02,by+eh*0.05,bx-ew*0.9,by-eh*0.45);
      ctx.quadraticCurveTo(bx-ew*0.3,by-eh*0.85,bx+ew*0.3,by-eh*0.85);
      ctx.quadraticCurveTo(bx+ew*0.9,by-eh*0.45,bx+ew*1.02,by+eh*0.05);
      ctx.quadraticCurveTo(bx+ew*0.85,by+eh*0.65,bx+ew*0.2,by+eh*0.75);
      ctx.quadraticCurveTo(bx-ew*0.2,by+eh*0.75,bx-ew*0.85,by+eh*0.65);
      ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=2;ctx.stroke();
      // 攻击动画：前腿抬起
      const tramp=this.attackType==='trample'&&this.attackAnim>0?atkOffset*0.5:0;
      // 耳
      const earFlap=Math.sin(t/700)*0.08;
      [-1,1].forEach(dir=>{
        const earGr=ctx.createRadialGradient(bx+dir*ew*0.35,by-eh*0.4,bs*0.03,bx+dir*ew*0.35,by-eh*0.4,bs*0.26);
        earGr.addColorStop(0,'#d0c0b0');earGr.addColorStop(0.7,'#b8a898');earGr.addColorStop(1,'#908070');
        ctx.fillStyle=earGr;ctx.beginPath();ctx.ellipse(bx+dir*ew*0.35+earFlap*dir*10,by-eh*0.35,bs*0.22,bs*0.28,dir*0.25,0,Math.PI*2);ctx.fill();
      });
      // 象鼻
      const trunkSway=Math.sin(t/550)*bs*0.08;
      ctx.strokeStyle='#b8a898';ctx.lineWidth=bs*0.11;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(bx+bs*0.04,by-eh*0.7);ctx.quadraticCurveTo(bx+bs*0.06+trunkSway,by-eh*0.15,bx+bs*0.02+trunkSway*1.2,by+eh*0.4);ctx.stroke();
      // 象牙
      ctx.fillStyle='#fffef0';
      [-1,1].forEach(dir=>{ctx.beginPath();ctx.moveTo(bx+dir*bs*0.05,by-eh*0.45);ctx.quadraticCurveTo(bx+dir*bs*0.16,by-eh*0.3,bx+dir*bs*0.08,by-eh*0.12);ctx.quadraticCurveTo(bx+dir*bs*0.02,by-eh*0.2,bx+dir*bs*0.01,by-eh*0.35);ctx.fill();});
      // 柱腿
      ctx.fillStyle='#988878';
      [[-ew*0.4,-ew*0.08,ew*0.12,ew*0.36]].forEach(lx=>{ctx.beginPath();ctx.ellipse(bx+lx+tramp,by+eh*0.6-(lx<0?tramp:0),bs*0.14,bs*0.18,0,0,Math.PI*2);ctx.fill();});
      // 踩踏尘
      if(this.attackType==='trample'&&this.attackAnim>0){ctx.fillStyle='rgba(180,150,120,0.4)';ctx.beginPath();ctx.ellipse(bx-ew*0.3,by+eh*0.75,bs*0.15,bs*0.05,0,0,Math.PI*2);ctx.fill();}
      return;
    }

    // === 🐔鸡/鸟类 ===
    if(bodyType==='bird'){
      const ch=bs*0.32*breath,cw=bs*0.38;
      const cgr=ctx.createLinearGradient(bx,by-ch,bx,by+ch);
      if(id==='chicken'||this._chickPhase>=0){cgr.addColorStop(0,'#fffef8');cgr.addColorStop(0.5,'#faf0d8');cgr.addColorStop(1,'#e8d0a0');}
      else if(this.name&&this.name.includes('公鸡')){cgr.addColorStop(0,'#f0c8a0');cgr.addColorStop(0.5,'#d08050');cgr.addColorStop(1,'#8a3020');}
      else{cgr.addColorStop(0,'#fffef5');cgr.addColorStop(0.5,'#faf0d0');cgr.addColorStop(1,'#e8d0a0');}
      ctx.fillStyle=cgr;
      ctx.beginPath();
      ctx.moveTo(bx,by-ch*0.85);
      ctx.quadraticCurveTo(bx+cw*0.9,by-ch*0.1,bx+cw*0.75,by+ch*0.7);
      ctx.quadraticCurveTo(bx+cw*0.15,by+ch*0.85,bx-cw*0.15,by+ch*0.85);
      ctx.quadraticCurveTo(bx-cw*0.75,by+ch*0.7,bx-cw*0.9,by-ch*0.1);
      ctx.quadraticCurveTo(bx,by-ch*0.8,bx,by-ch*0.85);
      ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1.8;ctx.stroke();
      // 攻击动画：啄击（头部前伸）
      const peckOff=this.attackType==='peck'&&this.attackAnim>0?atkOffset*2:0;
      ctx.fillStyle='#fffef8';ctx.beginPath();ctx.arc(bx+peckOff*0.5,by-ch*0.68,bs*0.14,0,Math.PI*2);ctx.fill();
      // 鸡冠
      const combColor=this.name&&this.name.includes('公鸡')?'#c03020':'#e04030';
      ctx.fillStyle=combColor;ctx.beginPath();const combX=bx+peckOff*0.3,combY=by-ch*0.82;
      ctx.moveTo(combX-bs*0.10,combY);
      for(let c=0;c<5;c++){const cx=combX-bs*0.08+c*bs*0.04;ctx.quadraticCurveTo(cx,combY-bs*0.12,cx+bs*0.02,combY);}
      ctx.quadraticCurveTo(combX+bs*0.10,combY+bs*0.04,combX-bs*0.04,combY+bs*0.03);
      ctx.quadraticCurveTo(combX-bs*0.08,combY+bs*0.02,combX-bs*0.10,combY);
      ctx.fill();
      // 喙
      ctx.fillStyle='#f0a830';ctx.beginPath();ctx.moveTo(bx+bs*0.06+peckOff,by-ch*0.66);ctx.lineTo(bx+bs*0.18+peckOff,by-ch*0.62);ctx.lineTo(bx+bs*0.06+peckOff,by-ch*0.56);ctx.closePath();ctx.fill();
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(bx+bs*0.02+peckOff*0.5,by-ch*0.70,bs*0.03,0,Math.PI*2);ctx.fill();
      return;
    }

    // 通用fallback
    const gh=bs*0.26*breath,gw=bs*0.32;
    const ggr=ctx.createLinearGradient(bx,by-gh,bx,by+gh);
    ggr.addColorStop(0,this.color);ggr.addColorStop(1,this.bodyColor||this.color);
    ctx.fillStyle=ggr;
    ctx.beginPath();
    ctx.moveTo(bx,by-gh*0.85);
    ctx.quadraticCurveTo(bx+gw*0.8,by-gh*0.1,bx+gw*0.6,by+gh*0.65);
    ctx.quadraticCurveTo(bx+gw*0.1,by+gh*0.8,bx-gw*0.1,by+gh*0.8);
    ctx.quadraticCurveTo(bx-gw*0.6,by+gh*0.65,bx-gw*0.8,by-gh*0.1);
    ctx.quadraticCurveTo(bx,by-gh*0.8,bx,by-gh*0.85);
    ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1.5;ctx.stroke();
  }

  draw(ctx){
    if(this.dead)return;
    const bScale=1+this.scaleBob;
    const renderY=this.y-this.drawY;

    // === Buff持续视觉 ===
    if(this.speedBoostTimer>0&&!this.stunned){
      const spd=Math.hypot(this.vx,this.vy)||1;const nx=-(this.vx/spd),ny=-(this.vy/spd);
      ctx.strokeStyle='rgba(255,220,60,0.5)';ctx.lineWidth=2;ctx.lineCap='round';
      for(let i=0;i<3;i++){const lx=this.x+nx*(this.size*0.6+i*10)+ny*(i-1)*4,ly=renderY+ny*(this.size*0.6+i*10)-nx*(i-1)*4;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+nx*8,ly+ny*8);ctx.stroke();}
    }
    if(this.dmgBoostTimer>0&&!this.stunned){const pa=Date.now()/200;ctx.strokeStyle='rgba(255,100,20,0.4)';ctx.lineWidth=3;ctx.setLineDash([3,5]);ctx.lineDashOffset=pa*10;ctx.beginPath();ctx.arc(this.x,renderY,this.size+5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
    if(this._frozen&&this.stunned){ctx.fillStyle='rgba(100,200,255,0.3)';ctx.beginPath();ctx.arc(this.x,renderY,this.size+3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(200,240,255,0.6)';ctx.lineWidth=2.5;for(let i=0;i<3;i++){const a=Date.now()/300+i*Math.PI*2/3;ctx.beginPath();ctx.moveTo(this.x,renderY);ctx.lineTo(this.x+Math.cos(a)*(this.size+8),renderY+Math.sin(a)*(this.size+8));ctx.stroke();}}
    if(this._healFlash>0){ctx.strokeStyle='rgba(255,80,80,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(this.x,renderY,this.size+8,0,Math.PI*2);ctx.stroke();}
    if(this._speedFlash>0){ctx.strokeStyle='rgba(255,220,60,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(this.x,renderY,this.size+6,0,Math.PI*2);ctx.stroke();}
    if(this._powerFlash>0){ctx.strokeStyle='rgba(255,100,20,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(this.x,renderY,this.size+6,0,Math.PI*2);ctx.stroke();}
    if(this._shieldFlash>0){ctx.strokeStyle='rgba(68,170,255,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(this.x,renderY,this.size+8,0,Math.PI*2);ctx.stroke();}
    if(this._hibernateV2){ctx.font='14px serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('💤冬眠中',this.x,renderY-this.size-24);}
    if(this.stunned)for(let i=0;i<3;i++){const a=(Date.now()/300+i*Math.PI*2/3)%(Math.PI*2);ctx.font='11px serif';ctx.fillText('⭐',this.x+Math.cos(a)*(this.size+9)-5,renderY+Math.sin(a)*(this.size+5)-7);}
    if(this.shieldActive){const pulse=1+Math.sin(Date.now()/200)*0.18;ctx.strokeStyle='rgba(68,170,255,0.55)';ctx.lineWidth=3.5*pulse;ctx.beginPath();ctx.arc(this.x,renderY,(this.size+10)*pulse,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='rgba(68,170,255,0.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,renderY,(this.size+18)*pulse,0,Math.PI*2);ctx.stroke();}
    if(this._hunting&&this.hopActive){ctx.strokeStyle='rgba(240,160,48,0.5)';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.lineDashOffset=Date.now()/50;ctx.beginPath();ctx.arc(this.x,renderY,this.size+5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
    // 鹰俯冲地面黑影
    if(this.divePhase>=2&&this.diveSkill){ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(this.diveLockX||this.x,renderY+this.size*0.6,this.size*0.8,this.size*0.12,0,0,Math.PI*2);ctx.fill();
      if(this.divePhase===2){ctx.strokeStyle='rgba(255,80,80,0.4)';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.lineDashOffset=-Date.now()/30;ctx.beginPath();ctx.arc(this.diveLockX||this.x,renderY,this.diveSkill.lockRange,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}}

    this.drawBody(ctx,renderY,bScale);

    ctx.font=`bold ${this.isMinion?7:9}px "PingFang SC","Microsoft YaHei"`;ctx.fillStyle='#fff';ctx.fillText(this.displayName,this.x,renderY+this.size*0.65);
    const bw=Math.max(28,this.size*1.1),bh=this.isMinion?2.5:4.5,by_=renderY-this.size*0.55;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(this.x-bw/2,by_,bw,bh);
    const hpR=this.hp/this.maxHp;ctx.fillStyle=hpR>0.5?'#5cb85c':hpR>0.25?'#f0ad4e':'#d9534f';ctx.fillRect(this.x-bw/2,by_,bw*hpR,bh);
    ctx.font=`bold ${this.isMinion?6.5:8}px "PingFang SC"`;ctx.fillStyle='#fff';ctx.fillText(`${Math.ceil(this.hp)}/${this.maxHp}`,this.x,by_-2);
    if(this.weakenPct>0){ctx.font='9px serif';ctx.fillStyle='#8e44ad';ctx.fillText('🔻',this.x,renderY-this.size*0.6);}
    if(this.slowed){ctx.font='9px serif';ctx.fillStyle='#5dade2';ctx.fillText('🐌',this.x+this.size*0.5,renderY-5);}
    if(this.dotEffects.length>0){ctx.font='9px serif';ctx.fillStyle='#e74c3c';ctx.fillText('💔',this.x-this.size*0.5,renderY-3);}
    if(this.speedBoostTimer>0){ctx.font='bold 8px "PingFang SC"';ctx.fillStyle='#ffdd44';ctx.fillText('⚡'+(this.speedBoostTimer/1000).toFixed(1)+'s',this.x,renderY-this.size*0.7);}
    if(this.dmgBoostTimer>0){ctx.font='bold 8px "PingFang SC"';ctx.fillStyle='#ff6600';ctx.fillText('💪'+(this.dmgBoostTimer/1000).toFixed(1)+'s',this.x,renderY-this.size*0.7-(this.speedBoostTimer>0?10:0));}
    if(this.shieldActive){ctx.font='bold 8px "PingFang SC"';ctx.fillStyle='#44aaff';ctx.fillText('🛡️'+(this.shieldTimer/1000).toFixed(1)+'s',this.x,renderY-this.size*0.7-(this.speedBoostTimer>0?10:0)-(this.dmgBoostTimer>0?10:0));}
  }
}

// ==================== 蛋类 ====================
const EGG_STAGES=[{emoji:'🥚',name:'蛋',size:19,hp:1,time:22000,color:'#fff8e0'},{emoji:'🐤',name:'雏鸡',size:32,hp:5,time:11000,color:'#fffde0'},{emoji:'🐥',name:'待出',size:38,hp:8,time:11000,color:'#fff9c4'}];

class Egg{
  constructor(x,y,owner){this.x=x;this.y=y;this.owner=owner;this.stage=0;this.accTime=0;this.hp=EGG_STAGES[0].hp;this.maxHp=this.hp;this.flashTimer=0;this.hitCD=0;this.dead=false;this.bobOff=0;}
  get cur(){return EGG_STAGES[this.stage];}
  get size(){return this.cur.size;}
  update(dt){
    if(this.dead)return;this.accTime+=dt;this.bobOff=Math.sin(this.accTime/400)*1.5;if(this.hitCD>0)this.hitCD-=dt;if(this.flashTimer>0)this.flashTimer-=dt;
    if(this.stage<2&&this.accTime>=this.cur.time){this.accTime-=this.cur.time;this.stage++;if(this.stage<2){this.hp=EGG_STAGES[this.stage].hp;this.maxHp=this.hp;spawnFX('text',this.x,this.y-14,EGG_STAGES[this.stage].name+'!','#f4a460',1.2);}
      if(this.stage>=2){this.dead=true;const cfg={...CHICK_CFG};const chick=new Animal(cfg,this.x,this.owner.team,this.owner);chick.x=this.x;chick.y=this.y;chick._chickPhase=0;chick._chickTimer=0;chick.name='小鸡';chick.emoji='🐤';chick.hp=cfg.hp;chick.maxHp=cfg.hp;chick.isMinion=true;chick.ranged=false;animals.push(chick);spawnFX('text',this.x,this.y-16,'孵化!🐤','#ffd700',1.2);showComment('🐤 小鸡破壳而出！','#ffd700');}}
  }
  takeDmg(dmg){if(this.hitCD>0)return;this.hp-=dmg;this.flashTimer=100;this.hitCD=350;spawnFX('damage',this.x,this.y-8,dmg,'#ff9966');if(this.hp<=0){this.hp=0;this.dead=true;spawnFX('text',this.x,this.y-10,'蛋碎了!','#ff6b6b',1.1);}}
  draw(ctx){
    if(this.dead)return;const c=this.cur,s=c.size;const bgR=s+6;
    ctx.fillStyle=c.color;ctx.globalAlpha=0.7;ctx.beginPath();ctx.arc(this.x,this.y,bgR,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(this.x,this.y,bgR,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    ctx.font=`${s*1.2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.emoji,this.x,this.y+this.bobOff);
    ctx.font='bold 8px "PingFang SC"';ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillText(c.name,this.x,this.y-bgR-8);
  }
}

// ==================== 特效系统 ====================
function spawnSpark(x,y,count,life,colors,lifeMs,vel={vx:0,vy:0}){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2;const sp=3+Math.random()*life;effects.push({type:'spark',x,y,life:lifeMs,age:0,dead:false,data:{dx:Math.cos(a)*sp,dy:Math.sin(a)*sp,size:2+Math.random()*2,vx:vel.vx||0,vy:vel.vy||0,color:colors[Math.floor(Math.random()*colors.length)]}});}}
function spawnDust(x,y,radius,color,lifeMs,vel={vx:0,vy:0}){effects.push({type:'dust',x,y,life:lifeMs,age:0,dead:false,data:{radius,color,vx:vel.vx||0,vy:vel.vy||0}});}
function spawnFX(type,x,y,data,color,scale=1){const life=type==='ring'?(data.life||600):type==='projectile'?1500:3000;effects.push({type,x,y,data,color,scale,life,age:0,dead:false});}

function updateFX(dt){
  effects.forEach(e=>{e.age+=dt;if(e.age>=e.life){e.dead=true;return;}
    switch(e.type){
      case'damage':e.y-=32*dt/1000;break;case'text':e.y-=24*dt/1000;break;
      case'spark':if(e.data.vx!==undefined||e.data.vy!==undefined){e.x+=(e.data.vx||0)*dt/1000;e.y+=(e.data.vy||0)*dt/1000;}break;
      case'dust':if(e.data.vx!==undefined||e.data.vy!==undefined){e.x+=(e.data.vx||0)*dt/1000;e.y+=(e.data.vy||0)*dt/1000;}break;
      case'ring':break;
      case'projectile':
        if(e.data.target&&!e.data.target.dead){const t=e.data.target,dx=t.x-e.x,dy=t.y-e.y,dist=Math.sqrt(dx*dx+dy*dy)||1,sp=e.data.speed*60;e.x+=(dx/dist)*sp*dt/1000;e.y+=(dy/dist)*sp*dt/1000;if(dist<t.size*0.8){t.hp-=e.data.damage;if(t.hp<=0){t.hp=0;t.dead=true;}t.flashTimer=100;spawnFX('damage',t.x,t.y-16,e.data.damage,'#f4a460');e.dead=true;}}
        else if(e.data.vx!==undefined){e.x+=e.data.vx*dt/1000;e.y+=e.data.vy*dt/1000;if(e.x<arenaL-20||e.x>arenaR+20||e.y<arenaT-20||e.y>arenaB+20)e.dead=true;const nearby=animals.filter(a=>a.team!==e.data._team&&!a.dead&&Math.hypot(a.x-e.x,a.y-e.y)<a.size+8);if(nearby.length>0){const t=nearby[0];t.hp-=Math.round(e.data.damage*0.5)||3;t.flashTimer=100;spawnFX('damage',t.x,t.y-16,Math.round(e.data.damage*0.5)||3,'#999');e.dead=true;}}else{e.dead=true;}
        break;
    }
  });
  effects=effects.filter(e=>!e.dead);
  groundCracks.forEach(c=>{c.age+=dt;if(c.age>=c.life)c.dead=true;});groundCracks=groundCracks.filter(c=>!c.dead);
}

function drawFX(ctx){
  groundCracks.forEach(c=>{const a=1-c.age/c.life;ctx.strokeStyle=`rgba(139,90,43,${a*0.6})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+Math.cos(c.angle)*c.len,c.y+Math.sin(c.angle)*c.len);ctx.stroke();});
  mapHazards.forEach(h=>{if(h.phase==='warning'){const wAlpha=0.3+Math.sin(Date.now()/100)*0.3;ctx.fillStyle=`rgba(255,80,0,${wAlpha})`;ctx.beginPath();ctx.arc(h.x,h.y,h.radius*0.3,0,Math.PI*2);ctx.fill();}else{const a=1-h.age/h.life;const g=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.radius*a);g.addColorStop(0,'rgba(255,180,40,0.7)');g.addColorStop(0.5,'rgba(255,60,10,0.4)');g.addColorStop(1,'rgba(255,20,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(h.x,h.y,h.radius*a,0,Math.PI*2);ctx.fill();}});
  mapParticles.forEach(p=>{const a=1-p.age/p.life;ctx.fillStyle=`rgba(255,255,255,${a*0.5})`;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();});
  effects.forEach(e=>{const a=Math.max(0,1-e.age/e.life);ctx.globalAlpha=a;
    switch(e.type){
      case'damage':ctx.font=`bold ${Math.round(18*e.scale)}px "PingFang SC"`;ctx.fillStyle=e.color;ctx.textAlign='center';ctx.fillText(`-${e.data}`,e.x,e.y);break;
      case'text':ctx.font=`bold ${Math.round(14*e.scale)}px "PingFang SC"`;ctx.fillStyle=e.color;ctx.textAlign='center';ctx.fillText(e.data,e.x,e.y);break;
      case'projectile':ctx.font='16px serif';ctx.textAlign='center';ctx.fillText(e.data.emoji,e.x,e.y);break;
      case'spark':{const sp=1-e.age/e.life;const sx=e.x+e.data.dx*(1-sp),sy=e.y+e.data.dy*(1-sp),ex=e.x+e.data.dx,ey=e.y+e.data.dy;ctx.strokeStyle=e.data.color;ctx.lineWidth=e.data.size*sp;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle=e.data.color;ctx.globalAlpha=a*0.8;ctx.beginPath();ctx.arc(ex,ey,e.data.size*0.6,0,Math.PI*2);ctx.fill();}break;
      case'dust':{const dprog=e.age/e.life,dr=e.data.radius*(0.5+0.5*dprog);const dgrad=ctx.createRadialGradient(e.x,e.y,dr*0.1,e.x,e.y,dr);dgrad.addColorStop(0,e.data.color);dgrad.addColorStop(1,'transparent');ctx.fillStyle=dgrad;ctx.globalAlpha=a*0.6;ctx.beginPath();ctx.arc(e.x,e.y,dr,0,Math.PI*2);ctx.fill();}break;
      case'ring':{const prog=e.age/e.life,r=e.data.maxRadius*prog;ctx.strokeStyle=e.data.color||e.color;ctx.lineWidth=4*(1-prog);ctx.globalAlpha=a*0.5;ctx.beginPath();if(e.data.jagged){for(let i=0;i<24;i++){const aa=Math.PI*2/24*i,jr=r*(0.8+Math.random()*0.2);i===0?ctx.moveTo(e.x+Math.cos(aa)*jr,e.y+Math.sin(aa)*jr):ctx.lineTo(e.x+Math.cos(aa)*jr,e.y+Math.sin(aa)*jr);}ctx.closePath();}else{ctx.arc(e.x,e.y,r,0,Math.PI*2);}ctx.stroke();}break;
    }
    ctx.globalAlpha=1;
  });
  animals.forEach(a=>{if(!a.dead&&a.hopActive&&Math.random()<0.6){ctx.globalAlpha=0.5;const dg=ctx.createRadialGradient(a.x,a.y+a.size*0.35,2,a.x,a.y+a.size*0.35,8);dg.addColorStop(0,'#c4a882');dg.addColorStop(1,'transparent');ctx.fillStyle=dg;ctx.beginPath();ctx.arc(a.x-a.vx*0.15+(Math.random()-0.5)*14,a.y+a.size*0.35+(Math.random()-0.5)*10,5+Math.random()*8,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}});
}

// ==================== 主循环 ====================
function loop(ts){
  if(!lastTime)lastTime=ts;
  let dt=Math.min(ts-lastTime,100)*gameSpeed;lastTime=ts;
  ctx.clearRect(0,0,W,H);

  if(shakeTimer>0){shakeTimer-=dt;const r=shakeIntensity*(shakeTimer/shakeMax);shakeX=(Math.random()-0.5)*r*2;shakeY=(Math.random()-0.5)*r*2;if(shakeTimer<=0){shakeX=0;shakeY=0;shakeIntensity=0;}}
  ctx.save();if(shakeX||shakeY)ctx.translate(shakeX,shakeY);

  drawBG(ctx);

  if(gameState==='fighting'){
    mapTick(dt);
    animals.forEach(a=>a.update(dt));
    eggs.forEach(e=>e.update(dt));
    items.forEach(it=>it.update(dt));
    items=items.filter(it=>!it.dead);
    updateFX(dt);

    // 注释老化
    commentLog.forEach(c=>c.age+=dt);

    itemSpawnCD-=dt;
    if(itemSpawnCD<=0&&items.length<3){const ix=arenaL+40+Math.random()*(arenaR-arenaL-80),iy=arenaT+30+Math.random()*(arenaB-arenaT-60);items.push(new Item(ix,iy));itemSpawnCD=20000+Math.random()*20000;}

    // DOT with snake lifesteal
    animals.forEach(a=>{a.dotEffects.forEach(d=>{d.elapsed+=dt;d.tickAcc+=dt;if(d.tickAcc>=d.tick){d.tickAcc-=d.tick;
      let tickDmg=d.dmg;
      // 龟免伤对DOT生效
      const sd=a.passives.find(p=>p.type==='shellDefense');
      if(sd){const sdReduce=(1-a.hp/a.maxHp)*sd.maxReduce;tickDmg=Math.round(tickDmg*(1-sdReduce));}
      tickDmg=Math.max(1,tickDmg);
      a.hp-=tickDmg;if(a.hp<=0){a.hp=0;a.dead=true;}
      spawnFX('damage',a.x+(Math.random()-0.5)*12,a.y-12,tickDmg,'#e74c3c');
    }});a.dotEffects=a.dotEffects.filter(d=>d.elapsed<d.dur);});

    const alive=animals.filter(a=>!a.dead);

    for(const it of items){if(it.dead)continue;for(const a of alive){if(Math.hypot(a.x-it.x,a.y-(it.y+it.bob))<a.size+14){it.type.apply(a);it.dead=true;break;}}}

    // 大象践踏
    alive.forEach(a=>{const tram=a.passives.find(p=>p.type==='trample');if(!tram||a.stunned)return;const victims=alive.filter(e=>!e.dead&&e!==a&&e.size<a.size*0.7&&Math.hypot(e.x-a.x,e.y-a.y)<tram.radius);victims.forEach(v=>{v.hp-=tram.dps*dt/1000;v.flashTimer=50;if(v.hp<=0){v.hp=0;v.dead=true;}});});

    for(let i=0;i<alive.length;i++){
      for(let j=i+1;j<alive.length;j++){
        const a=alive[i],b=alive[j];if(a.team===b.team)continue;
        const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
        const bodyDist=a.size+b.size;
        if(dist<bodyDist){const ov=bodyDist-dist,nx=dx/dist,ny=dy/dist;a.x-=nx*ov*0.5;a.y-=ny*ov*0.5;b.x+=nx*ov*0.5;b.y+=ny*ov*0.5;if(!a.isMinion||a._chickPhase>=2||!a.owner||a.owner.dead){a._newDir();a.recoilTimer=RECOIL_TIME;}if(!b.isMinion||b._chickPhase>=2||!b.owner||b.owner.dead){b._newDir();b.recoilTimer=RECOIL_TIME;}}
        const atkDist=bodyDist+8;
        if(!a.dead&&!b.dead&&dist<atkDist){
          if(a.atkTimer<=0&&!a.ranged&&!a.stunned&&(a.recoilTimer<=0||a.divePhase>0)&&!(a._chickPhase===0)&&!a._hibernateV2){a.dealDmg(b);a.atkTimer=a.passives.some(p=>p.type==='frenzyCombo')?(a.hp/a.maxHp<0.3?700:a.hp/a.maxHp<0.7?900:1050):ATK_CD;}
          if(!b.dead&&b.atkTimer<=0&&!b.ranged&&!b.stunned&&(b.recoilTimer<=0||b.divePhase>0)&&!(b._chickPhase===0)&&!b._hibernateV2){b.dealDmg(a);b.atkTimer=b.passives.some(p=>p.type==='frenzyCombo')?(b.hp/b.maxHp<0.3?700:b.hp/b.maxHp<0.7?900:1050):ATK_CD;}
        }
        if(!a.dead&&!b.dead){if(!a.stunned&&!(a._chickPhase===0)&&!a._hibernateV2){if(a.ranged&&a.rangedTimer<=0&&dist<(a.rangedRange||160))a.rangedAttack(b);}if(!b.dead&&!b.stunned&&!(b._chickPhase===0)&&!b._hibernateV2){if(b.ranged&&b.rangedTimer<=0&&dist<(b.rangedRange||160))b.rangedAttack(a);}}
      }
    }

    alive.forEach(a=>{if(a.dead||a.stunned||a._hibernateV2)return;if(a.isMinion&&!a._canLay)return;const enemies=alive.filter(e=>e!==a&&!e.dead);a.skills.forEach(s=>{if(s.cdTimer<=0)a.useSkill(s,enemies);});});

    for(const egg of eggs){if(egg.dead)continue;for(const a of alive){if(a.team===egg.owner.team||a.dead||a.stunned)continue;if(Math.hypot(a.x-egg.x,a.y-egg.y)<a.size+egg.size){egg.takeDmg(a.effDmg());if(egg.dead)break;}}}

    animals=animals.filter(a=>!a.dead);eggs=eggs.filter(e=>!e.dead);
    const al=animals.filter(a=>!a.dead);
    const hasEgg=eggs.some(e=>!e.dead);
    if(al.length<=1&&!hasEgg){gameState='ended';winner=al.length===1?al[0]:null;document.getElementById('bf').disabled=false;
      if(winner){showComment(`🏆 ${winner.emoji}${winner.displayName} 成为最后幸存者！`,'#ffd700');showToast(`🏆 ${winner.displayName} 获胜！`,5000);}
      else{showComment('⚔️ 平局！无人生还','#aaa');}
    }
  }

  eggs.forEach(e=>e.draw(ctx));
  animals.forEach(a=>a.draw(ctx));
  items.forEach(it=>it.draw(ctx));
  drawFX(ctx);

  if(gameState==='ended'){const alpha=0.5+Math.sin(Date.now()/500)*0.3;ctx.globalAlpha=alpha;ctx.font='bold 26px "PingFang SC"';ctx.fillStyle='#ffd700';ctx.textAlign='center';if(winner)ctx.fillText(`${winner.emoji}${winner.displayName}获胜!`,W/2,H/2-8);else ctx.fillText(`平局!`,W/2,H/2-8);ctx.globalAlpha=1;}
  if(gameState==='idle'){ctx.globalAlpha=0.28;ctx.font='bold 14px "PingFang SC"';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('选择动物，点击开始对战',W/2,H/2);ctx.globalAlpha=1;}
  ctx.restore();
  frameId=requestAnimationFrame(loop);
}

// ==================== UI ====================
const CIRCLES=['①','②','③','④','⑤','⑥'];

function populateUI(){
  const asel=document.getElementById('asel'),keys=Object.keys(ANIMALS);
  asel.innerHTML='';keys.forEach(k=>{const a=ANIMALS[k];asel.innerHTML+=`<option value="${k}">${a.emoji}${a.name}</option>`;});
  const msel=document.getElementById('msel');
  msel.innerHTML='';Object.keys(MAPS).forEach(k=>{msel.innerHTML+=`<option value="${k}">${MAPS[k].name}</option>`;});
  msel.value='colosseum';
}

function renderTags(){
  const container=document.getElementById('tags');
  if(selectedAnimals.length===0){container.innerHTML='<span class="mute-tag">未选择动物(最少2只)</span>';return;}
  container.innerHTML=selectedAnimals.map((k,i)=>{
    const a=ANIMALS[k];let name=a.name;
    const sameKind=selectedAnimals.filter(x=>x===k).length;
    if(sameKind>1){let idx=0;for(let j=0;j<=i;j++)if(selectedAnimals[j]===k)idx++;name=a.name+CIRCLES[idx-1];}
    return `<span class="tag" onclick="removeAnimal(${i})">${a.emoji}${name}<span class="x">×</span></span>`;
  }).join('');
}

function addAnimal(){if(selectedAnimals.length>=6)return;const k=document.getElementById('asel').value;selectedAnimals.push(k);renderTags();}
function removeAnimal(i){selectedAnimals.splice(i,1);renderTags();}

function randBattle(){
  const keys=Object.keys(ANIMALS);
  const count=2+Math.floor(Math.random()*5);
  selectedAnimals=[];
  for(let i=0;i<count;i++)selectedAnimals.push(keys[Math.floor(Math.random()*keys.length)]);
  renderTags();
}

function getArenaScale(count){if(count<=3)return 1;if(count<=5)return 1.25;return 1.5;}

function startBattle(){
  if(selectedAnimals.length<2)return;
  currentMap=document.getElementById('msel').value;
  const count=selectedAnimals.length;
  arenaScale=getArenaScale(count);
  resize(arenaScale);initGrass();
  const nameCount={};animals=[];
  const cx=arenaL+(arenaR-arenaL)/2,cy=arenaT+(arenaB-arenaT)/2;
  const spawnR=Math.min(arenaR-arenaL,arenaB-arenaT)*0.35;
  for(let i=0;i<selectedAnimals.length;i++){
    const k=selectedAnimals[i];nameCount[k]=(nameCount[k]||0)+1;
    const cfg=ANIMALS[k];let dn=cfg.name;
    const sameKind=selectedAnimals.filter(x=>x===k).length;
    if(sameKind>1)dn=cfg.name+CIRCLES[nameCount[k]-1];
    const a=new Animal(cfg,0,i);a.displayName=dn;a.name=dn;
    const angle=Math.PI*2/count*i-Math.PI/2;
    a.x=cx+Math.cos(angle)*spawnR;a.y=cy+Math.sin(angle)*spawnR*0.7;
    animals.push(a);
  }
  eggs=[];effects=[];items=[];gameState='fighting';winner=null;lastTime=0;
  groundCracks=[];mapHazards=[];mapParticles=[];commentLog=[];
  itemSpawnCD=20000+Math.random()*20000;
  windTimer=0;windDir={x:1,y:0};
  mapTick._grassCD=0;mapTick._volCD=0;
  document.getElementById('bf').disabled=true;
  showComment(`⚔️ 大乱斗开始！${count}只动物争夺生存权`,'#ffd700');
  showToast('⚔️ 战斗开始！',2000);
}

function resetBattle(){
  animals=[];eggs=[];effects=[];items=[];gameState='idle';winner=null;lastTime=0;
  groundCracks=[];mapHazards=[];mapParticles=[];commentLog=[];
  arenaScale=1;resize(1);initGrass();
  document.getElementById('bf').disabled=false;
  updateCommentBar();
}

populateUI();
document.getElementById('bf').addEventListener('click',startBattle);
document.getElementById('bx').addEventListener('click',resetBattle);
document.getElementById('br').addEventListener('click',()=>{randBattle();resetBattle();});
document.getElementById('badd').addEventListener('click',addAnimal);
document.querySelectorAll('.speed-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.speed-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');gameSpeed=parseInt(b.dataset.s);}));
document.addEventListener('keydown',e=>{switch(e.key.toLowerCase()){case' ':e.preventDefault();if(gameState==='fighting')resetBattle();startBattle();break;case'r':resetBattle();break;case'f':randBattle();resetBattle();break;case'1':setSpd(1);break;case'2':setSpd(2);break;case'3':setSpd(3);break;case'4':setSpd(4);break;case'5':setSpd(5);break;case'6':setSpd(6);break;case'7':setSpd(7);break;case'8':setSpd(8);break;}});
function setSpd(s){gameSpeed=s;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.s)===s));}
frameId=requestAnimationFrame(loop);
</script>
