<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动物大战 v2.1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#3a2f28;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'PingFang SC','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none;padding:3px;touch-action:manipulation}
  .title{color:#f5deb3;font-size:clamp(14px,3.5vw,18px);margin:1px 0;letter-spacing:2px}
  #game{border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.5);max-width:100%;display:block}
  .panel{margin-top:3px;background:#4a3828;border-radius:10px;padding:5px 7px;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 8px rgba(0,0,0,0.3);width:100%;max-width:420px}
  .row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
  .row label{color:#d4c5b2;font-size:10px;white-space:nowrap}
  .row select{flex:1;min-width:50px;padding:5px 2px;border-radius:6px;border:1px solid #6b5a48;background:#5c4a38;color:#f5deb3;font-size:11px;font-family:inherit;-webkit-appearance:none;text-align:center}
  .btn{padding:7px 9px;border-radius:7px;border:none;cursor:pointer;font-size:11px;font-family:inherit;font-weight:bold;transition:all 0.15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;min-height:34px}
  .btn:active{transform:scale(0.95)}
  .btn-fight{background:linear-gradient(135deg,#d4745c,#b8533f);color:#fff;font-size:13px;padding:8px 14px;flex:1}
  .btn-reset{background:#5c4a38;color:#c4b5a2}
  .btn-random{background:linear-gradient(135deg,#7b6b5a,#5c4a38);color:#f5deb3}
  .speed-btn{padding:3px 6px;border-radius:5px;border:1px solid #6b5a48;background:transparent;color:#a09080;cursor:pointer;font-size:9px;font-family:inherit}
  .speed-btn.active{background:#e8a87c;color:#3a2f28;border-color:#e8a87c;font-weight:bold}
  .info{color:#8a7a6a;font-size:8px;text-align:center;letter-spacing:1px}
  .tag-row{display:flex;flex-wrap:wrap;gap:3px;min-height:20px;align-items:center}
  .tag{display:inline-flex;align-items:center;gap:2px;background:#5c4a38;color:#f5deb3;padding:2px 6px;border-radius:4px;font-size:10px;cursor:pointer}
  .tag:hover{background:#d4745c}
  .tag .x{color:#d4745c;font-weight:bold;margin-left:2px}
  .tag:hover .x{color:#fff}
  .mute-tag{color:#8a7a6a;font-size:9px}
</style>
</head>
<body>
<div class="title">⚔️ 动物大战</div>
<canvas id="game"></canvas>
<div class="panel">
  <div class="row">
    <label>🎯</label><select id="asel"></select>
    <button class="btn btn-random" id="badd" style="font-size:10px;padding:4px 8px;min-height:26px">+添加</button>
  </div>
  <div class="tag-row" id="tags"></div>
  <div class="row" style="margin-top:2px">
    <label>🗺️</label><select id="msel"></select>
  </div>
  <div class="row">
    <button class="btn btn-random" id="br">🎲随机</button>
    <button class="btn btn-fight" id="bf">⚡开始</button>
    <button class="btn btn-reset" id="bx">🔄重置</button>
  </div>
  <div class="row">
    <span style="color:#8a7a6a;font-size:9px">速度:</span>
    <button class="speed-btn" data-s="1">1x</button>
    <button class="speed-btn active" data-s="2">2x</button>
    <button class="speed-btn" data-s="3">3x</button>
    <button class="speed-btn" data-s="4">4x</button>
    <button class="speed-btn" data-s="6">6x</button>
  </div>
</div>
<div class="info">v2.1 · 空格开始 R重置 F随机 1-6调速 · 大乱斗</div>

<script>
// ==================== 画布 ====================
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,arenaL,arenaR,arenaT,arenaB,arenaScale=1;
const BASE_MAXW=420,RATIO=1.55;
function resize(scaleOverride){
  const sc=scaleOverride||arenaScale;
  const mw=Math.min(window.innerWidth-12,Math.floor(BASE_MAXW*sc)),ratio=RATIO;
  canvas.width=mw;canvas.height=Math.floor(mw*ratio);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.style.width=mw+'px';canvas.style.height=Math.floor(mw*ratio)+'px';
  if(dpr>1){canvas.width=mw*dpr;canvas.height=Math.floor(mw*ratio)*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  W=mw;H=Math.floor(mw*ratio);
  arenaL=14;arenaR=W-14;arenaT=50;arenaB=H-14;
}
window.addEventListener('resize',()=>resize());
window.addEventListener('orientationchange',()=>setTimeout(()=>resize(),300));
resize(1);

// ==================== 背景元素 ====================
let grassSpots=[],mapParticles=[],mapHazards=[];
function initGrass(){
  grassSpots=[];
  const rng=s=>{let x=Math.sin(s)*10000;return x-Math.floor(x);};
  for(let i=0;i<30;i++)grassSpots.push({x:arenaL+rng(i*7+1)*(arenaR-arenaL),y:arenaB-rng(i*13+3)*22,r:4+rng(i*17+5)*8});
}
initGrass();

// ==================== 地图定义 ====================
const MAPS={
  grassland:{name:'🌿草原',desc:'全场每2秒回血2HP',color:'#7a9a50',bgTop:'#b8d890',bgBot:'#6a8a3a'},
  volcano:{name:'🌋火山',desc:'随机喷发·命中扣15血+眩晕',color:'#8b4513',bgTop:'#5a3020',bgBot:'#2a1005'},
  ice:{name:'❄️冰原',desc:'移速+15%·碰墙滑行',color:'#a0c8e8',bgTop:'#c8ddf0',bgBot:'#7090a8'},
  wind:{name:'🌪️风谷',desc:'移速+20%·风向5秒切换',color:'#8a9a70',bgTop:'#b8c898',bgBot:'#5a7a40'},
  colosseum:{name:'🏛️竞技场',desc:'标准规则·无特殊效果',color:'#a09080',bgTop:'#d4c5a0',bgBot:'#8a7a58'}
};
let currentMap='colosseum';
let windDir={x:1,y:0},windTimer=0,windInterval=5000;

function drawBG(ctx){
  const m=MAPS[currentMap];
  const sky=ctx.createLinearGradient(0,0,0,arenaT+25);
  sky.addColorStop(0,m.bgTop);sky.addColorStop(1,m.bgTop);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const gnd=ctx.createLinearGradient(0,arenaT+6,0,H);
  gnd.addColorStop(0,m.bgTop);gnd.addColorStop(0.6,m.bgBot);gnd.addColorStop(1,'#2a1a0a');
  ctx.fillStyle=gnd;ctx.fillRect(0,arenaT+6,W,H-arenaT-6);

  if(currentMap==='grassland'){
    // 茂盛草地
    grassSpots.forEach(g=>{const gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r);gr.addColorStop(0,'#8ab84a');gr.addColorStop(1,'#5a8a30');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();});
    // 花朵点缀
    for(let i=0;i<12;i++){const fx=arenaL+((i*137+53)%(arenaR-arenaL)),fy=arenaT+10+((i*89+31)%(arenaB-arenaT-10));ctx.fillStyle=['#ffdd57','#ff88aa','#ffffff','#ffaa88','#ffcc44'][i%5];ctx.beginPath();ctx.arc(fx,fy,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(fx,fy,1.5,0,Math.PI*2);ctx.fill();}
    // 蝴蝶
    const bt=Date.now()/1500;
    for(let i=0;i<3;i++){const bx=arenaL+60+Math.sin(bt+i*2.1)*((arenaR-arenaL-120)*0.4),by=arenaT+20+Math.cos(bt*1.3+i*1.7)*30;ctx.fillStyle='#ff88cc';ctx.beginPath();ctx.arc(bx-3,by,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(bx+3,by,2.5,0,Math.PI*2);ctx.fill();}
  }else if(currentMap==='volcano'){
    // 焦土+岩浆纹
    const vt=Date.now()/3000;
    for(let i=0;i<8;i++){const cx=arenaL+((i*173+31)%(arenaR-arenaL)),cy=arenaB-10-((i*97+17)%(arenaB-arenaT)*0.5);const sg=ctx.createLinearGradient(cx-8,cy,cx+8,cy);sg.addColorStop(0,'rgba(255,120,20,0)');sg.addColorStop(0.5,'rgba(255,80,10,0.5)');sg.addColorStop(1,'rgba(255,120,20,0)');ctx.strokeStyle=sg;ctx.lineWidth=2.5+Math.sin(vt+i)*1;ctx.beginPath();ctx.moveTo(cx-10,cy);ctx.quadraticCurveTo(cx,cy-4+Math.sin(vt+i)*3,cx+10,cy);ctx.stroke();}
    // 火星飘散
    for(let i=0;i<6;i++){const sx=arenaL+((i*191+Date.now()/200)%(arenaR-arenaL)),sy=arenaT+15+((i*137+Date.now()/300)%(arenaB-arenaT-15));ctx.fillStyle='rgba(255,150,30,0.4)';ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();}
  }else if(currentMap==='ice'){
    // 冰面反光
    ctx.fillStyle='rgba(220,235,250,0.7)';ctx.fillRect(arenaL,arenaT+6,arenaR-arenaL,arenaB-arenaT-6);
    const it=Date.now()/2000;
    for(let i=0;i<8;i++){const ix=arenaL+((i*151+41)%(arenaR-arenaL)),iy=arenaT+15+((i*113+59)%(arenaB-arenaT-15));ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ix,iy-8);ctx.lineTo(ix+Math.sin(it+i)*2,iy);ctx.lineTo(ix,iy+8);ctx.moveTo(ix-8,iy);ctx.lineTo(ix,iy+Math.cos(it+i)*2);ctx.lineTo(ix+8,iy);ctx.stroke();}
  }else if(currentMap==='wind'){
    // 风吹草地 + 落叶
    const wt=Date.now()/600;
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
    for(let i=0;i<18;i++){const wx=arenaL+(i*29+wt*40)%(arenaR-arenaL),wy=arenaT+8+(i*33)%(arenaB-arenaT-8);ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx+Math.cos(wt+i*0.7)*22,wy+Math.sin(wt+i*0.7)*8);ctx.stroke();}
    // 落叶
    for(let i=0;i<5;i++){const lx=arenaL+(i*111+wt*60)%(arenaR-arenaL+60)-30,ly=arenaT+15+(i*67+Math.sin(wt+i)*30)%(arenaB-arenaT-15);ctx.fillStyle='rgba(180,160,100,0.5)';ctx.beginPath();ctx.ellipse(lx,ly,3,1.5,wt*0.3,0,Math.PI*2);ctx.fill();}
  }else{
    // 竞技场石板
    ctx.fillStyle='#c0b098';ctx.fillRect(arenaL,arenaT+6,arenaR-arenaL,arenaB-arenaT-6);
    ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;
    for(let y=arenaT+20;y<arenaB;y+=35)for(let x=arenaL+10;x<arenaR;x+=55){ctx.strokeRect(x,y,55,35);}
    ctx.fillStyle='#a09080';
    for(let x=arenaL+50;x<arenaR;x+=90){ctx.beginPath();ctx.arc(x,arenaT+22,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=2;ctx.stroke();}
  }
  // 围栏
  ctx.fillStyle='#5a3820';ctx.fillRect(arenaL-3,arenaT-2,arenaR-arenaL+6,2.5);
  for(let x=arenaL;x<=arenaR;x+=34){ctx.fillStyle='#4a2a10';ctx.fillRect(x-2.5,arenaT-6,5,14);ctx.fillStyle='#3a1a08';ctx.fillRect(x-1,arenaT-8,2,4);}
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.setLineDash([4,12]);ctx.strokeRect(arenaL,arenaT,arenaR-arenaL,arenaB-arenaT);ctx.setLineDash([]);
}

function mapTick(dt){
  if(currentMap==='grassland'){
    if(!mapTick._grassCD)mapTick._grassCD=0;
    mapTick._grassCD+=dt;
    while(mapTick._grassCD>=2000){
      mapTick._grassCD-=2000;
      animals.forEach(a=>{if(!a.dead){a.hp=Math.min(a.maxHp,a.hp+2);
        // 回血绿光
        for(let i=0;i<3;i++)spawnSpark(a.x+(Math.random()-0.5)*a.size,a.y+(Math.random()-0.5)*a.size,1,2+Math.random()*3,['#5cb85c','#8fdf8f'],400,{vx:(Math.random()-0.5)*10,vy:-8-Math.random()*6});
      }});
    }
  }else if(currentMap==='volcano'){
    if(!mapTick._volCD)mapTick._volCD=0;
    mapTick._volCD+=dt;
    if(mapTick._volCD>=7000+Math.random()*5000){
      mapTick._volCD=0;
      // 预告闪烁
      const ex=arenaL+40+Math.random()*(arenaR-arenaL-80),ey=arenaT+35+Math.random()*(arenaB-arenaT-70);
      mapHazards.push({x:ex,y:ey,life:1500,age:0,radius:45,phase:'warning'});
      // 0.5秒后喷发
      setTimeout(()=>{
        if(gameState!=='fighting')return;
        mapHazards.push({x:ex,y:ey,life:800,age:0,radius:48,phase:'erupt'});
        for(let j=0;j<16;j++)spawnSpark(ex,ey,2,4+Math.random()*10,['#ff4500','#ff8800','#ffaa00','#ffcc00'],1000,{vx:(Math.random()-0.5)*50,vy:-20-Math.random()*40});
        // 震屏
        triggerShake(6,300);
        animals.forEach(a=>{if(!a.dead&&Math.hypot(a.x-ex,a.y-ey)<48){a.hp-=15;if(a.hp<=0){a.hp=0;a.dead=true;}a.stunned=true;a.stunTimer=500;a.flashTimer=180;spawnFX('damage',a.x,a.y-18,15,'#ff4500');for(let i=0;i<6;i++)spawnSpark(a.x,a.y,2,3+Math.random()*6,['#ff4500','#ff8800'],500,{vx:(Math.random()-0.5)*25,vy:(Math.random()-0.5)*20-10});}});
      },500);
    }
  }else if(currentMap==='ice'){
    if(!mapTick._iceSnow)mapTick._iceSnow=0;
    mapTick._iceSnow+=dt;
    if(mapTick._iceSnow>400){mapTick._iceSnow=0;mapParticles.push({x:Math.random()*(arenaR-arenaL)+arenaL,y:arenaT,life:5000,age:0});}
  }else if(currentMap==='wind'){
    windTimer+=dt;
    if(windTimer>=windInterval){
      windTimer=0;
      const a=Math.random()*Math.PI*2;
      windDir={x:Math.cos(a),y:Math.sin(a)};
      const dirName=a<-2.3||a>2.3?'→':a<-0.7?'↑':a<0.7?'←':'↓';
      spawnFX('text',W/2,arenaT+35,'风向'+dirName,'#ffdd57');
      for(let i=0;i<8;i++)spawnSpark(W/2,arenaT+40,1,3+Math.random()*5,['#ffdd57','#ffe080'],500,{vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*25-10});
    }
  }
  mapParticles.forEach(p=>{p.age+=dt;p.y+=(currentMap==='ice'?0.4:1)*dt/1000;if(p.age>=p.life)p.dead=true;});
  mapParticles=mapParticles.filter(p=>!p.dead);
  mapHazards.forEach(h=>{h.age+=dt;if(h.age>=h.life)h.dead=true;});
  mapHazards=mapHazards.filter(h=>!h.dead);
}

// ==================== 动物数据 v2.1 ====================
// 全HP+20%, 龟回血 1.5→0.5
const ANIMALS={
  chicken:{id:'chicken',name:'母鸡',emoji:'🐔',bodyType:'bird',hp:144,speed:0.40,damage:4,size:48,color:'#faf0e0',bodyColor:'#e8d0a8',desc:'远程撒米🍚·下蛋→滚雪球',ranged:true,rangedDmg:7,rangedCD:2600,rangedRange:160,rangedEmoji:'🍚',rangedSpeed:4.5,rangedMiss:0.25,skills:[{name:'下蛋',emoji:'🥚',cd:28000,type:'lay_egg',desc:'下蛋→孵化→新生命'}]},
  bear:{id:'bear',name:'棕熊',emoji:'🐻',bodyType:'quad',hp:306,speed:0.34,damage:16,size:67,color:'#a07848',bodyColor:'#6b4a28',passives:[{type:'rage',threshold:0.3,dmgBonus:0.5,desc:'HP<30%伤害+50%'},{type:'hibernate',interval:14000,pause:1500,wakeDmg:0.8,desc:'偶尔冬眠→醒来重击'}],skills:[{name:'眩晕拍击',emoji:'💫',cd:9000,type:'stun',duration:1500,windup:900,smartRange:80,desc:'蓄力→拍晕1.5秒'}]},
  wolf:{id:'wolf',name:'狼',emoji:'🐺',bodyType:'quad',hp:174,speed:0.72,damage:9,size:51,color:'#c0c0c0',bodyColor:'#707070',passives:[{type:'loneWolf',radius:71,dmgBonus:0.25,desc:'无同伴时伤害+25%'}],skills:[{name:'流血撕咬',emoji:'🩸',cd:5000,type:'bleed',damage:6,duration:3500,tickInterval:700,desc:'命中后流血3.5秒'}]},
  bull:{id:'bull',name:'公牛',emoji:'🐂',bodyType:'quad',hp:282,speed:0.42,damage:11,size:61,color:'#d4b890',bodyColor:'#8a6040',passives:[{type:'grudge',maxStacks:5,dmgPerStack:0.1,decay:5000,desc:'每挨打伤害+10%(最高+50%)'}],skills:[{name:'冲撞',emoji:'💨',cd:6500,type:'hop',damage:22,hopDist:75,smartMinDist:50,desc:'跳步75px→下次攻击+22伤'}]},
  eagle:{id:'eagle',name:'鹰',emoji:'🦅',bodyType:'bird',hp:138,speed:0.72,damage:18,size:48,color:'#f0ead8',bodyColor:'#5a3a20',passives:[{type:'dodge',chance:0.18,desc:'18%闪避近战攻击'}],skills:[{name:'俯冲暴击',emoji:'⚡',cd:7500,type:'dive',multiplier:3.0,lockRange:200,diveSpeed:260,diveTime:900,desc:'锁定200px→俯冲3倍暴击·逃脱则自晕+双倍CD'}]},
  snake:{id:'snake',name:'蛇',emoji:'🐍',bodyType:'snake',hp:162,speed:0.56,damage:6,size:45,color:'#5dade2',bodyColor:'#3d8d52',passives:[{type:'contagion',radius:54,spreadDmg:4,duration:3000,desc:'击杀→毒溅射周围敌人'}],skills:[{name:'毒液',emoji:'🧪',cd:4200,type:'poison',damage:5,duration:4500,tickInterval:900,poisonCloud:true,desc:'命中后中毒4.5秒+毒雾'}]},
  lion:{id:'lion',name:'狮子',emoji:'🦁',bodyType:'quad',hp:234,speed:0.50,damage:14,size:61,color:'#e8b870',bodyColor:'#a07040',passives:[{type:'intimidate',radius:70,fleeChance:0.06,desc:'周围敌人6%/秒概率逃跑'}],skills:[{name:'咆哮',emoji:'🦁',cd:6500,type:'roar',weakenPct:0.35,duration:4000,ringRadius:130,smartRange:130,desc:'咆哮降敌35%攻击4秒+全体音波'}]},
  elephant:{id:'elephant',name:'大象',emoji:'🐘',bodyType:'quad',hp:432,speed:0.30,damage:15,size:77,color:'#b8a898',bodyColor:'#807060',passives:[{type:'unstoppable',desc:'免疫眩晕'},{type:'trample',radius:85,dps:0.8,desc:'碾压贴身小型敌人'}],skills:[{name:'地动山摇',emoji:'🌍',cd:9500,type:'quake',damage:12,stunDuration:1800,quakeRange:180,shakeIntensity:8,shakeTime:400,smartRange:180,desc:'范围180px·AOE12伤+眩晕+震动'}]},
  turtle:{id:'turtle',name:'乌龟',emoji:'🐢',bodyType:'turtle',hp:216,speed:0.30,damage:6,size:48,color:'#6b8e6b',bodyColor:'#5a7a4a',passives:[{type:'regeneration',delay:3000,hpPerSec:0.5,desc:'3秒不受击后回血0.5/秒'}],skills:[{name:'缩壳',emoji:'🐢',cd:7500,type:'shield',reducePct:0.7,duration:3500,desc:'减伤70%持续3.5秒'}]}
};

const CHICK_CFG={name:'小鸡',emoji:'🐤',bodyType:'bird',hp:18,speed:0.28,damage:0,size:26,color:'#faf0d0',bodyColor:'#e8d8a0',isMinion:true,ranged:false,_chickPhase:0};
const YOUNG_CFG={name:'青年鸡',emoji:'🐥',bodyType:'bird',hp:29,speed:0.32,damage:0,size:32,color:'#faf0d0',bodyColor:'#e8d8a0',isMinion:true,ranged:true,rangedDmg:4,rangedCD:3200,rangedRange:130,rangedEmoji:'🍚',rangedSpeed:4,rangedMiss:0.40,_chickPhase:1};
const HEN_CFG={name:'母鸡',emoji:'🐔',bodyType:'bird',hp:43,speed:0.36,damage:2,size:38,color:'#faf0e0',bodyColor:'#e8d0a8',isMinion:true,ranged:true,rangedDmg:6,rangedCD:3000,rangedRange:150,rangedEmoji:'🍚',rangedSpeed:4.2,rangedMiss:0.25,_chickPhase:2,_canLay:true,skills:[{name:'下蛋',emoji:'🥚',cd:30000,type:'lay_egg',desc:'下蛋→孵化→新生命'}]};
const ROOSTER_CFG={name:'公鸡',emoji:'🐓',bodyType:'bird',hp:68,speed:0.42,damage:8,size:42,color:'#e8a870',bodyColor:'#983828',isMinion:true,ranged:false,_chickPhase:2};

// ==================== 状态 ====================

function triggerShake(intensity,duration){
  if(shakeCD>0)return;
  shakeIntensity=Math.max(shakeIntensity,intensity);shakeMax=Math.max(shakeMax,duration);shakeTimer=Math.max(shakeTimer,duration);
  shakeCD=800;
}

function pickItemType(){
  const total=ITEM_TYPES.reduce((s,t)=>s+t.weight,0);
  let r=Math.random()*total;
  for(const t of ITEM_TYPES){r-=t.weight;if(r<=0)return t;}
  return ITEM_TYPES[0];
}

class Item{
  constructor(x,y){
    this.type=pickItemType();
    this.x=x;this.y=y;this.life=15000;this.age=0;this.dead=false;this.bob=0;
  }
  update(dt){this.age+=dt;this.bob=Math.sin(this.age/300)*3;if(this.age>=this.life)this.dead=true;}
  draw(ctx){
    const a=this.age>13000?1-(this.age-13000)/2000:1;
    ctx.globalAlpha=a;
    // 旋转光晕
    const rt=Date.now()/800;
    const glow=ctx.createRadialGradient(this.x,this.y+this.bob,3,this.x,this.y+this.bob,18);
    glow.addColorStop(0,this.type.color);glow.addColorStop(0.5,this.type.color+'88');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(this.x,this.y+this.bob,18,0,Math.PI*2);ctx.fill();
    // 外圈旋转
    ctx.strokeStyle=this.type.color;ctx.lineWidth=1.5;ctx.globalAlpha=a*0.7;ctx.setLineDash([4,3]);ctx.lineDashOffset=rt*30;
    ctx.beginPath();ctx.arc(this.x,this.y+this.bob,14,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    // 图标
    ctx.globalAlpha=a;ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(this.type.icon,this.x,this.y+this.bob);
    // 名称标签
    ctx.globalAlpha=a*0.8;ctx.font='bold 8px "PingFang SC"';ctx.fillStyle='#fff';
    ctx.fillText(this.type.name,this.x,this.y+this.bob+16);
    ctx.globalAlpha=1;
  }
}

// ==================== 动物类 ====================
class Animal{
  constructor(cfg,x,team,owner=null,displayName=null){
    Object.assign(this,cfg);this.maxHp=cfg.hp;
    this.x=x;this.y=arenaT+(arenaB-arenaT)*(0.2+Math.random()*0.6);
    this.team=team;this.owner=owner;
    this.displayName=displayName||cfg.name;
    const spd=cfg.speed*60*(0.92+Math.random()*0.16);
    const a=Math.random()*Math.PI*2;this.vx=Math.cos(a)*spd;this.vy=Math.sin(a)*spd;
    this.atkTimer=Math.random()*ATK_CD;this.dirTimer=Math.random()*DIR_MAX;
    this.stunned=false;this.stunTimer=0;this.flashTimer=0;this.dead=false;
    this.skills=(cfg.skills||[]).map(s=>({...s,cdTimer:Math.random()*s.cd*0.3}));
    this.rangedTimer=cfg.ranged?Math.random()*cfg.rangedCD:99999;
    this.dotEffects=[];this.shieldActive=false;this.shieldTimer=0;this.shieldReduce=0;
    this.weakenPct=0;this.weakenTimer=0;
    this.critNext=false;this.stunNext=false;this.bleedNext=false;this.poisonNext=false;
    this.slowed=false;this.slowPct=0;this.slowTimer=0;
    this.passives=cfg.passives||[];
    this.followOffsetX=(Math.random()-0.5)*this.size*0.6;this.followOffsetY=(Math.random()-0.5)*this.size*0.4+this.size*0.4;
    this.aliveTimer=0;
    this.grudgeStacks=0;this.grudgeTimer=0;
    this.lastHitTimer=3000;
    this.hibernateCD=0;this.hibernating=false;this.hibernateTimer=0;this.wakeReady=false;
    if(this.passives.some(p=>p.type==='hibernate')){
      const h=this.passives.find(p=>p.type==='hibernate');
      this.hibernateCD=h.interval*(0.15+Math.random()*0.15);
    }
    this._chickPhase=cfg._chickPhase;this._chickTimer=0;
    this._canLay=cfg._canLay||false;
    this.recoilTimer=0;this.stunImmune=0;
    this.windupTimer=0;this.windupMax=0;
    this.diveTimer=0;this.diveMax=0;this.diveTarget=null;this.diveSkill=null;this.diveLockX=0;this.diveLockY=0;
    this.drawY=0;this.scaleBob=0;
    this.hopTimer=0;this.hopActive=false;
    this.speedBoost=0;this.speedBoostTimer=0;
    this.dmgBoost=0;this.dmgBoostTimer=0;
    // 视觉闪烁
    this._healFlash=0;this._speedFlash=0;this._powerFlash=0;this._shieldFlash=0;this._poisonFlash=0;
    this._frozen=false;this._frozenTimer=0;
  }

  update(dt){
    if(this.dead)return;const rd=dt;
    this.aliveTimer+=rd;
    if(this._healFlash>0)this._healFlash-=rd;
    if(this._speedFlash>0)this._speedFlash-=rd;
    if(this._powerFlash>0)this._powerFlash-=rd;
    if(this._shieldFlash>0)this._shieldFlash-=rd;
    if(this._poisonFlash>0)this._poisonFlash-=rd;
    if(this._frozen){this._frozenTimer-=rd;if(this._frozenTimer<=0)this._frozen=false;}

    if(this._chickPhase===0){this._chickTimer+=rd;if(this._chickTimer>=10000)this._growTo(YOUNG_CFG);}
    else if(this._chickPhase===1){this._chickTimer+=rd;if(this._chickTimer>=12000)this._growTo(Math.random()<0.25?ROOSTER_CFG:HEN_CFG);}
    this.scaleBob=Math.sin(this.aliveTimer/600)*0.03;
    if(this.speedBoostTimer>0){this.speedBoostTimer-=rd;if(this.speedBoostTimer<=0)this.speedBoost=0;}
    if(this.dmgBoostTimer>0){this.dmgBoostTimer-=rd;if(this.dmgBoostTimer<=0)this.dmgBoost=0;}

    if(this.stunned){this.stunTimer-=rd;if(this.stunTimer<=0)this.stunned=false;if(this.stunned)return;}
    if(!this.shieldActive&&this.shieldTimer>0){this.shieldTimer-=rd;if(this.shieldTimer<=0){this.shieldReduce=0;}}
    if(this.shieldActive&&this.shieldTimer>0){this.shieldTimer-=rd;if(this.shieldTimer<=0){this.shieldActive=false;this.shieldReduce=0;}}
    if(this.weakenTimer>0){this.weakenTimer-=rd;if(this.weakenTimer<=0)this.weakenPct=0;}
    if(this.slowTimer>0){this.slowTimer-=rd;if(this.slowTimer<=0){this.slowed=false;this.slowPct=0;}}
    if(this.flashTimer>0)this.flashTimer-=rd;
    if(this.atkTimer>0)this.atkTimer-=rd;
    if(this.rangedTimer>0)this.rangedTimer-=rd;
    if(this.recoilTimer>0)this.recoilTimer-=rd;
    if(this.stunImmune>0)this.stunImmune-=rd;
    if(shakeCD>0)shakeCD-=rd;
    this.skills.forEach(s=>{if(s.cdTimer>0)s.cdTimer-=rd;});

    if(this.passives.some(p=>p.type==='hibernate')){
      const h=this.passives.find(p=>p.type==='hibernate');
      if(!this.hibernating){
        if(this.hibernateCD>0){this.hibernateCD-=rd;}else{this.hibernating=true;this.hibernateTimer=h.pause;this.hibernateCD=h.interval*(0.7+Math.random()*0.6);spawnFX('text',this.x,this.y-22,'冬眠💤','#aaa');}
      }else{
        this.hibernateTimer-=rd;
        if(this.hibernateTimer<=0){this.hibernating=false;this.wakeReady=true;this._newDir();spawnFX('text',this.x,this.y-22,'醒来!','#ff6b6b');triggerShake(3,200);}
      }
    }
    if(this.grudgeStacks>0){this.grudgeTimer-=rd;if(this.grudgeTimer<=0){this.grudgeStacks=0;}}
    if(this.passives.some(p=>p.type==='regeneration')){
      const reg=this.passives.find(p=>p.type==='regeneration');
      this.lastHitTimer-=rd;
      if(this.lastHitTimer<=0&&this.hp<this.maxHp){this.hp=Math.min(this.maxHp,this.hp+reg.hpPerSec*rd/1000);}
    }

    if(this.windupTimer>0){
      this.windupTimer-=rd;
      const prog=1-this.windupTimer/this.windupMax;
      this.scaleBob=prog*0.12;
      if(Math.random()<0.4)spawnSpark(this.x+(Math.random()-0.5)*this.size*0.5,this.y-this.size*0.7,3,4+Math.random()*6,SPARK_COLORS.hit,500,{vx:(Math.random()-0.5)*8,vy:-12-Math.random()*10});
      if(this.windupTimer<=0){this.stunNext=true;spawnFX('text',this.x,this.y-24,'拍击!','#ff6b6b');triggerShake(5,200);}
    }

    if(this.diveTimer>0){
      this.diveTimer-=rd;const prog=1-this.diveTimer/this.diveMax;let diveAborted=false;
      if(this.diveTarget&&!this.diveTarget.dead&&prog>0.3){
        const escDist=Math.hypot(this.diveTarget.x-this.diveLockX,this.diveTarget.y-this.diveLockY);
        if(escDist>this.diveSkill.lockRange*0.6){
          diveAborted=true;this.diveTimer=0;this.drawY=0;
          const sk=this.skills.find(s=>s.type==='dive');if(sk)sk.cdTimer=sk.cd*2;
          this.stunned=true;this.stunTimer=1500;this.stunImmune=STUN_IMMUN;
          spawnFX('text',this.x,this.y-20,'扑空!','#ff6b6b');
          for(let i=0;i<10;i++)spawnSpark(this.x,this.y,3,3+Math.random()*8,['#ff6b6b','#ff8888'],600,{vx:(Math.random()-0.5)*45,vy:(Math.random()-0.5)*35-15});
          this.diveTarget=null;this.diveSkill=null;
        }
      }
      if(!diveAborted){
        const dx=this.diveLockX-this.x,dy=this.diveLockY-this.y,dist=Math.hypot(dx,dy)||1;
        const spd=this.speed*this.diveSkill.diveSpeed*(0.5+prog*0.5);
        this.vx+=(dx/dist)*spd*0.25;this.vy+=(dy/dist)*spd*0.25;
        const mag=Math.hypot(this.vx,this.vy);if(mag>spd){this.vx=this.vx/mag*spd;this.vy=this.vy/mag*spd;}
        if(Math.random()<0.7)spawnSpark(this.x-this.vx*0.08,this.y-this.vy*0.08,1,2+Math.random()*4,SPARK_COLORS.sky,350,{vx:-this.vx*0.15,vy:-this.vy*0.15});
        if(prog<0.35)this.drawY=-this.size*(prog/0.35)*0.9;else this.drawY=-this.size*0.9*(1-(prog-0.35)/0.65);
        if(dist<this.size*1.2||this.diveTimer<=0){
          const hit=this.diveTarget&&!this.diveTarget.dead&&Math.hypot(this.diveTarget.x-this.x,this.diveTarget.y-this.y)<this.size+this.diveTarget.size+10;
          if(!hit){this.stunned=true;this.stunTimer=1500;this.stunImmune=STUN_IMMUN;const sk=this.skills.find(s=>s.type==='dive');if(sk)sk.cdTimer=sk.cd*2;spawnFX('text',this.x,this.y-20,'扑空!','#ff6b6b');triggerShake(3,150);for(let i=0;i<8;i++)spawnDust(this.x,this.y,4+Math.random()*6,'#8a7a58',500);}
          this.diveTimer=0;this.drawY=0;this.diveTarget=null;this.diveSkill=null;
          if(!this.stunned)this._newDir();
        }
      }
    }

    if(this.hopTimer>0){this.hopTimer-=rd;if(this.hopTimer<=0){this.vx*=0.25;this.vy*=0.25;this.hopActive=false;}}
    if(this.hibernating){this.vx*=0.9;this.vy*=0.9;this.x+=this.vx*rd/1000;this.y+=this.vy*rd/1000;this._clampToArena();return;}
    if(this.isMinion&&this.owner&&!this.owner.dead&&this._chickPhase<2){this._followOwner();}

    let spdMult=1;if(this.slowed)spdMult*=(1-this.slowPct);
    if(this.speedBoost>0)spdMult*=(1+this.speedBoost);
    if(currentMap==='ice')spdMult*=1.15;
    if(currentMap==='wind')spdMult*=1.20;
    const curSpd=Math.sqrt(this.vx*this.vx+this.vy*this.vy)||1;
    const maxSpd=this.speed*60*spdMult;
    if(curSpd>maxSpd&&this.diveTimer<=0&&!this.hopActive){this.vx=this.vx/curSpd*maxSpd;this.vy=this.vy/curSpd*maxSpd;}
    if(currentMap==='wind'){this.vx+=windDir.x*20*rd/1000;this.vy+=windDir.y*20*rd/1000;}
    this.x+=this.vx*rd/1000;this.y+=this.vy*rd/1000;
    this._clampToArena();
  }

  _growTo(cfg){
    const ox=this.x,oy=this.y,oteam=this.team,oowner=this.owner,odn=this.displayName;
    Object.assign(this,cfg);this.maxHp=cfg.hp;this.hp=cfg.hp;
    this.x=ox;this.y=oy;this.team=oteam;this.owner=oowner;this.displayName=odn;
    this.skills=(cfg.skills||[]).map(s=>({...s,cdTimer:Math.random()*s.cd*0.3}));
    this.rangedTimer=cfg.ranged?Math.random()*cfg.rangedCD:99999;
    this._chickPhase=cfg._chickPhase;this._chickTimer=0;this._canLay=cfg._canLay||false;
    this.isMinion=cfg.isMinion!==false;this.atkTimer=300;this.flashTimer=200;this.drawY=0;
    spawnFX('text',this.x,this.y-20,cfg.name+'!','#ffd700');
  }

  _followOwner(){
    const ox=this.owner.x+this.followOffsetX,oy=this.owner.y+this.followOffsetY;
    const dx=ox-this.x,dy=oy-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    const spd=this.speed*60;
    if(dist>this.size*1.2){this.vx+=(dx/dist)*spd*0.12;this.vy+=(dy/dist)*spd*0.12;const mag=Math.sqrt(this.vx*this.vx+this.vy*this.vy);if(mag>spd){this.vx=this.vx/mag*spd;this.vy=this.vy/mag*spd;}}
    else if(dist>this.size*0.3){this.vx+=(dx/dist)*spd*0.04;this.vy+=(dy/dist)*spd*0.04;}
    this._clampToArena();
  }

  _newDir(){
    const spd=this.speed*60*(0.92+Math.random()*0.16);
    const a=Math.random()*Math.PI*2;this.vx=Math.cos(a)*spd;this.vy=Math.sin(a)*spd;
  }

  _clampToArena(){
    const r=this.size;let bounced=false;
    if(this.x<arenaL+r){this.x=arenaL+r;bounced=true;}
    if(this.x>arenaR-r){this.x=arenaR-r;bounced=true;}
    if(this.y<arenaT+r){this.y=arenaT+r;bounced=true;}
    if(this.y>arenaB-r){this.y=arenaB-r;bounced=true;}
    if(bounced&&currentMap!=='ice')this._newDir();
    else if(bounced&&currentMap==='ice'){
      if(this.x<=arenaL+r||this.x>=arenaR-r)this.vx*=-0.7;
      if(this.y<=arenaT+r||this.y>=arenaB-r)this.vy*=-0.7;
    }
  }

  effDmg(){
    let d=this.damage;
    if(this.stunNext)d=Math.round(d*0.45);
    if(this.weakenPct>0)d*=(1-this.weakenPct);
    const rage=this.passives.find(p=>p.type==='rage');
    if(rage&&this.hp/this.maxHp<rage.threshold)d*=(1+rage.dmgBonus);
    if(this.wakeReady){d*=(1+(this.passives.find(p=>p.type==='hibernate')?.wakeDmg||0.8));this.wakeReady=false;}
    if(this.grudgeStacks>0){const gr=this.passives.find(p=>p.type==='grudge');d*=(1+this.grudgeStacks*(gr?.dmgPerStack||0.1));}
    if(this.dmgBoost>0)d*=(1+this.dmgBoost);
    if(this.diveTimer>0)d*=this.diveSkill?.multiplier||3.0;
    if(this.hopActive)d*=1.8;
    if(this.critNext){d*=this.skills.find(s=>s.type==='crit')?.multiplier||2;this.critNext=false;}
    else if(Math.random()<BASE_CRIT){d*=2;this._baseCrit=true;}
    else this._baseCrit=false;
    return Math.round(Math.max(1,d));
  }

  onHit(){this.lastHitTimer=3000;if(this.passives.some(p=>p.type==='grudge')){const gr=this.passives.find(p=>p.type==='grudge');this.grudgeStacks=Math.min(gr.maxStacks,this.grudgeStacks+1);this.grudgeTimer=gr.decay;}}

  onKill(){
    const cont=this.passives.find(p=>p.type==='contagion');
    if(cont){
      const nearby=animals.filter(a=>!a.dead&&a!==this&&Math.hypot(a.x-this.x,a.y-this.y)<cont.radius);
      nearby.forEach(a=>{a.dotEffects.push({dmg:cont.spreadDmg,dur:cont.duration,tick:1000,elapsed:0,tickAcc:0});spawnFX('text',a.x,a.y-20,'毒爆!','#8e44ad');
        for(let i=0;i<10;i++)spawnSpark(a.x+(Math.random()-0.5)*24,a.y+(Math.random()-0.5)*24,3,3+Math.random()*7,SPARK_COLORS.poison,700,{vx:(Math.random()-0.5)*35,vy:(Math.random()-0.5)*30-25});});
    }
  }

  dealDmg(target){
    if(target.passives.some(p=>p.type==='dodge')){
      const dodge=target.passives.find(p=>p.type==='dodge');
      if(Math.random()<dodge.chance){spawnFX('text',target.x,target.y-20,'闪避!','#87CEEB');return;}
    }
    const willStun=this.stunNext,willBleed=this.bleedNext,willPoison=this.poisonNext;
    let dmg=this.effDmg();
    if(target.shieldActive)dmg=Math.round(dmg*(1-target.shieldReduce));
    if(target.shieldActive){const refl=0.25;const rdmg=Math.round(dmg*refl);this.hp-=rdmg;this.flashTimer=100;spawnFX('damage',this.x,this.y-16,rdmg,'#6b8e6b');if(this.hp<=0){this.hp=0;this.dead=true;}}
    const tUnstop=target.passives.some(p=>p.type==='unstoppable');
    if(willStun&&!tUnstop&&target.stunImmune<=0){
      target.stunned=true;target.stunTimer=this.skills.find(s=>s.type==='stun')?.duration||1500;target.stunImmune=STUN_IMMUN;
      spawnFX('text',target.x,target.y-24,'眩晕!','#ffd700');triggerShake(5,200);
      for(let i=0;i<4;i++)spawnSpark(target.x,target.y,3,3+Math.random()*6,SPARK_COLORS.gold,400,{vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*15-10});
    }else if(willStun&&tUnstop){spawnFX('text',target.x,target.y-24,'免疫!','#b0a090');this.stunNext=false;}
    else if(willStun&&target.stunImmune>0){spawnFX('text',target.x,target.y-24,'抵抗!','#aaa');this.stunNext=false;}
    this.stunNext=false;
    if(willBleed){target.dotEffects.push({dmg:this.skills.find(s=>s.type==='bleed')?.damage||6,dur:this.skills.find(s=>s.type==='bleed')?.duration||3500,tick:this.skills.find(s=>s.type==='bleed')?.tickInterval||700,elapsed:0,tickAcc:0});spawnFX('text',target.x,target.y-24,'流血!','#e74c3c');
      for(let i=0;i<14;i++)spawnSpark(target.x+(Math.random()-0.5)*30,target.y+(Math.random()-0.5)*25,4,2+Math.random()*7,SPARK_COLORS.bleed,550,{vx:(Math.random()-0.5)*60,vy:(Math.random()-0.5)*50-30});}
    this.bleedNext=false;
    if(willPoison){target.dotEffects.push({dmg:this.skills.find(s=>s.type==='poison')?.damage||5,dur:this.skills.find(s=>s.type==='poison')?.duration||4500,tick:this.skills.find(s=>s.type==='poison')?.tickInterval||900,elapsed:0,tickAcc:0});spawnFX('text',target.x,target.y-24,'中毒!','#8e44ad');
      if(this.skills.find(s=>s.type==='poison')?.poisonCloud){for(let i=0;i<18;i++)spawnSpark(target.x+(Math.random()-0.5)*40,target.y+(Math.random()-0.5)*40,3,3+Math.random()*10,SPARK_COLORS.poison,900,{vx:(Math.random()-0.5)*35,vy:(Math.random()-0.5)*35-25});}}
    this.poisonNext=false;
    target.hp-=dmg;target.flashTimer=100;target.onHit();target.atkTimer=Math.min(target.atkTimer,150);
    const dx=target.x-this.x,dy=target.y-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    target.vx+=(dx/dist)*KB*18;target.vy+=(dy/dist)*KB*12;
    if(this.hopActive){this.hopActive=false;spawnFX('text',target.x,target.y-30,'撞击!','#cd853f');triggerShake(4,200);for(let i=0;i<6;i++)spawnSpark(target.x,target.y,3,4+Math.random()*8,SPARK_COLORS.quake,350,{vx:(Math.random()-0.5)*35,vy:(Math.random()-0.5)*25-10});}
    const wasDive=this.diveTimer>0;
    if(wasDive){spawnFX('text',target.x,target.y-30,'俯冲!','#ffd700');triggerShake(8,300);this.diveTimer=0;this.drawY=0;this._newDir();
      for(let i=0;i<18;i++)spawnSpark(target.x+(Math.random()-0.5)*40,target.y+(Math.random()-0.5)*35,4,4+Math.random()*12,SPARK_COLORS.gold,500,{vx:(Math.random()-0.5)*60,vy:(Math.random()-0.5)*50-20});}
    for(let i=0;i<4;i++)spawnSpark(target.x+(Math.random()-0.5)*20,target.y+(Math.random()-0.5)*15,2,3+Math.random()*6,SPARK_COLORS.hit,350,{vx:(Math.random()-0.5)*25,vy:(Math.random()-0.5)*20-10});
    spawnFX('damage',target.x,target.y-16,dmg,this._baseCrit||wasDive?'#ff6b6b':'#fff',this._baseCrit||wasDive?1.4:1);
    if(this._baseCrit){spawnFX('text',target.x,target.y-30,'暴击!','#ffd700');for(let i=0;i<6;i++)spawnSpark(target.x,target.y,4,5+Math.random()*10,SPARK_COLORS.gold,400,{vx:(Math.random()-0.5)*35,vy:(Math.random()-0.5)*25-18});}
    if(target.hp<=0){target.hp=0;target.dead=true;this.onKill();}
  }

  useSkill(skill,enemies){
    if(this.isMinion&&!this._canLay)return;
    if(skill.smartRange&&enemies.filter(e=>!e.dead&&Math.hypot(e.x-this.x,e.y-this.y)<skill.smartRange).length===0)return;
    skill.cdTimer=skill.cd;
    const t=enemies.length>0?enemies[0]:null;
    switch(skill.type){
      case'stun':
        if(skill.windup){this.windupTimer=skill.windup;this.windupMax=skill.windup;spawnFX('text',this.x,this.y-20,'蓄力...','#ff6b6b');}
        else{this.stunNext=true;spawnFX('text',this.x,this.y-20,skill.name+'!','#ff6b6b');}
        break;
      case'bleed':this.bleedNext=true;spawnFX('text',this.x,this.y-20,skill.name+'!','#e74c3c');break;
      case'poison':this.poisonNext=true;spawnFX('text',this.x,this.y-20,skill.name+'!','#8e44ad');break;
      case'crit':this.critNext=true;spawnFX('text',this.x,this.y-20,skill.name+'!','#ffd700');break;
      case'dive':
        if(t&&!t.dead){
          const ld=Math.hypot(t.x-this.x,t.y-this.y);
          if(ld>skill.lockRange){skill.cdTimer=skill.cd;spawnFX('text',this.x,this.y-20,'太远!','#999');break;}
          this.diveTimer=skill.diveTime;this.diveMax=skill.diveTime;this.diveTarget=t;this.diveSkill=skill;
          this.diveLockX=t.x;this.diveLockY=t.y;spawnFX('text',this.x,this.y-20,'锁定!','#87CEEB');
          spawnFX('ring',t.x,t.y,{maxRadius:24,color:'#87CEEB',life:900},'#87CEEB');
        }
        break;
      case'hop':
        if(t){
          if(skill.smartMinDist&&Math.hypot(t.x-this.x,t.y-this.y)<skill.smartMinDist){skill.cdTimer=skill.cd*0.3;break;}
          const dx=t.x-this.x,dy=t.y-this.y,dist=Math.hypot(dx,dy)||1;
          this.vx=(dx/dist)*this.speed*130;this.vy=(dy/dist)*this.speed*110;
          this.hopTimer=350;this.hopActive=true;
          for(let i=0;i<8;i++)spawnDust(this.x,this.y+this.size*0.3,4+Math.random()*8,'#c4a882',550,{vx:(Math.random()-0.5)*25,vy:5+Math.random()*12});
        }
        spawnFX('text',this.x,this.y-20,skill.name+'!','#cd853f');
        break;
      case'roar':
        if(t){t.weakenPct=skill.weakenPct;t.weakenTimer=skill.duration;spawnFX('text',t.x,t.y-20,'攻击↓','#8e44ad');}
        if(skill.ringRadius){
          for(let i=0;i<3;i++)setTimeout(()=>{if(gameState==='fighting')spawnFX('ring',this.x,this.y,{maxRadius:skill.ringRadius*(0.4+i*0.3),color:'#e8a87c',life:500+i*150,jagged:true},'#e8a87c');},i*150);
        }
        spawnFX('text',this.x,this.y-20,'咆哮!','#e8a87c');triggerShake(4,200);
        for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2;spawnSpark(this.x,this.y,1,2+Math.random()*4,SPARK_COLORS.quake,600,{vx:Math.cos(a)*(20+Math.random()*60),vy:Math.sin(a)*(20+Math.random()*60)});}
        enemies.forEach(e=>{if(e!==t&&!e.dead){e.weakenPct=skill.weakenPct*0.6;e.weakenTimer=skill.duration*0.6;}});
        break;
      case'quake':
        if(skill.shakeIntensity)triggerShake(skill.shakeIntensity,skill.shakeTime);
        const qr=skill.quakeRange||180;
        for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2,d=qr*(0.2+Math.random()*0.8);groundCracks.push({x:this.x+Math.cos(a)*d,y:this.y+Math.sin(a)*d,life:skill.shakeTime,age:0,len:15+Math.random()*25,angle:Math.random()*Math.PI*2});}
        for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2,d=qr*(0.1+Math.random()*0.9);spawnDust(this.x+Math.cos(a)*d,this.y+Math.sin(a)*d,5+Math.random()*12,'#8a7a58',skill.shakeTime,{vx:(Math.random()-0.5)*15,vy:-10-Math.random()*20});}
        enemies.forEach(e=>{if(Math.hypot(e.x-this.x,e.y-this.y)>qr)return;const dd=skill.damage||0;e.hp-=dd;if(e.hp<=0){e.hp=0;e.dead=true;}e.flashTimer=120;
          const eu=e.passives.some(p=>p.type==='unstoppable');if(!eu&&e.stunImmune<=0){e.stunned=true;e.stunTimer=skill.stunDuration;e.stunImmune=STUN_IMMUN;}
          spawnFX('damage',e.x,e.y-16,dd,'#cd853f');for(let i=0;i<4;i++)spawnSpark(e.x+(Math.random()-0.5)*20,e.y+(Math.random()-0.5)*15,2,3+Math.random()*6,SPARK_COLORS.quake,400,{vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*15-8});});
        spawnFX('text',this.x,this.y-20,skill.name+'!','#cd853f');
        break;
      case'shield':this.shieldActive=true;this.shieldTimer=skill.duration;this.shieldReduce=skill.reducePct;spawnFX('text',this.x,this.y-20,'缩壳!','#6b8e6b');
        for(let i=0;i<8;i++)spawnSpark(this.x+(Math.random()-0.5)*this.size,this.y+(Math.random()-0.5)*this.size,2,3+Math.random()*5,SPARK_COLORS.green,500,{vx:(Math.random()-0.5)*15,vy:(Math.random()-0.5)*15-5});
        break;
      case'lay_egg':eggs.push(new Egg(this.x,this.y,this));spawnFX('text',this.x,this.y-20,'下蛋!','#f4a460');break;
    }
  }

  rangedAttack(target){if(!target||target.dead)return;this.rangedTimer=this.rangedCD;const missChance=this.rangedMiss||0;const miss=Math.random()<missChance;let pdata;if(miss){const a=Math.random()*Math.PI*2,sp=this.rangedSpeed*55;pdata={emoji:this.rangedEmoji,damage:0,target:null,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1000,_team:this.team};}else{pdata={emoji:this.rangedEmoji,damage:this.rangedDmg,speed:this.rangedSpeed,target:target,_team:this.team};}spawnFX('projectile',this.x,this.y-6,pdata,miss?'#999':'#f4a460');if(miss)spawnFX('text',this.x,this.y-16,'偏了','#999');}

  // ==================== v2.1: 美观灵动的身体绘制 ====================
  drawBody(ctx,renderY,bScale){
    const s=this.size,bs=s*bScale;
    const bx=this.x,by=renderY+s*0.18;
    const bodyType=this.bodyType||'quad';
    const id=this.id||'';
    const t=this.aliveTimer;
    const wingFlap=Math.sin(t/150)*0.35;

    // 地面阴影
    ctx.fillStyle='rgba(0,0,0,0.16)';
    ctx.beginPath();ctx.ellipse(bx,renderY+s*0.43+2,bs*0.44,bs*0.1,0,0,Math.PI*2);ctx.fill();

    // ========== 🐍蛇: 保留原设计 (圆润分段) ==========
    if(bodyType==='snake'){
      ctx.lineCap='round';ctx.lineJoin='round';
      const segCount=8;
      for(let i=segCount-1;i>=0;i--){
        const frac=i/segCount;
        const sx=bx+Math.sin(t/350+i*1.2)*bs*0.18;
        const sy=by-bs*0.45+frac*bs*0.85;
        const sw=bs*0.32*(1-frac*0.65);
        ctx.fillStyle=`hsl(${120+frac*20},${50-frac*20}%,${35-frac*8}%)`;
        ctx.beginPath();
        for(let j=0;j<6;j++){const a=Math.PI*2/6*j;const px=sx+Math.cos(a)*sw,py=sy+Math.sin(a)*sw*0.8;j===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
        ctx.closePath();ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=0.8;ctx.stroke();
      }
      const hx=bx+Math.sin(t/350)*bs*0.15,hy=by-bs*0.45;
      ctx.fillStyle='#3d8d52';ctx.beginPath();
      ctx.moveTo(hx,hy-bs*0.25);ctx.lineTo(hx+bs*0.18,hy);ctx.lineTo(hx,hy+bs*0.12);ctx.lineTo(hx-bs*0.18,hy);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1.2;ctx.stroke();
      ctx.strokeStyle='#e74c3c';ctx.lineWidth=1.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(hx+bs*0.14,hy);ctx.lineTo(hx+bs*0.28,hy-bs*0.1);ctx.moveTo(hx+bs*0.22,hy);ctx.lineTo(hx+bs*0.32,hy+bs*0.08);ctx.stroke();
      // 鳞片光泽
      ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
      for(let i=0;i<segCount-1;i++){const frac=i/segCount;ctx.beginPath();ctx.arc(bx+Math.sin(t/350+i*1.2)*bs*0.18,by-bs*0.45+frac*bs*0.85,bs*0.3*(1-frac*0.65)*0.85,0,Math.PI*2);ctx.stroke();}
      return;
    }

    // ========== 🐢乌龟: 保留原设计 ==========
    if(bodyType==='turtle'){
      ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.ellipse(bx,by+bs*0.08,bs*0.55,bs*0.42,0,0,Math.PI*2);ctx.fill();
      const shellGrad=ctx.createRadialGradient(bx-bs*0.1,by-bs*0.15,bs*0.05,bx,by,bs*0.55);
      shellGrad.addColorStop(0,'#9ab87a');shellGrad.addColorStop(0.5,this.bodyColor);shellGrad.addColorStop(1,'#3a5a2a');
      ctx.fillStyle=shellGrad;
      ctx.beginPath();const octR=bs*0.52;
      for(let i=0;i<8;i++){const a=Math.PI*2/8*i-Math.PI/8;const px=bx+Math.cos(a)*octR,py=by+Math.sin(a)*octR*0.78;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2.5;ctx.stroke();
      ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1.2;
      for(let i=0;i<4;i++){const a=Math.PI*2/4*i-Math.PI/4;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a)*octR*0.85,by+Math.sin(a)*octR*0.65);ctx.stroke();}
      ctx.fillStyle='#7a9a5a';ctx.beginPath();ctx.ellipse(bx,by-bs*0.4,bs*0.18,bs*0.14,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='#222';ctx.beginPath();ctx.arc(bx+bs*0.08,by-bs*0.43,bs*0.04,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#7a9a5a';
      [[-bs*0.35,bs*0.15],[-bs*0.3,bs*0.35],[bs*0.3,bs*0.35],[bs*0.35,bs*0.15]].forEach(([lx,ly])=>{
        ctx.beginPath();ctx.ellipse(bx+lx,by+ly,bs*0.16,bs*0.08,-0.3,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1;ctx.stroke();
        ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;
        for(let toe=-1;toe<=1;toe++){ctx.beginPath();ctx.moveTo(bx+lx,by+ly+bs*0.08);ctx.lineTo(bx+lx+toe*bs*0.05,by+ly+bs*0.14);ctx.stroke();}
      });
      return;
    }

    // ========== 以下全部用贝塞尔曲线重绘, 追求美观灵动 ==========

    // 通用呼吸动画
    const breath=1+Math.sin(t/500)*0.04;

    if(id==='bear'){
      // 🐻 棕熊: 圆润可爱+力量感, 贝塞尔曲体
      const bh=bs*0.38*breath,bw=bs*0.48;
      // 身体渐层
      const bgr=ctx.createLinearGradient(bx,by-bh,bx,by+bh);
      bgr.addColorStop(0,'#c09060');bgr.addColorStop(0.4,'#a07848');bgr.addColorStop(1,'#6b3a20');
      ctx.fillStyle=bgr;
      // 身体: 圆润梯形(贝塞尔)
      ctx.beginPath();
      ctx.moveTo(bx-bw*0.6,by+bh*0.8);
      ctx.quadraticCurveTo(bx-bw*1.05,by+bh*0.1,bx-bw*0.85,by-bh*0.5);
      ctx.quadraticCurveTo(bx-bw*0.35,by-bh*0.85,bx+bw*0.35,by-bh*0.85);
      ctx.quadraticCurveTo(bx+bw*0.85,by-bh*0.5,bx+bw*1.05,by+bh*0.1);
      ctx.quadraticCurveTo(bx+bw*0.6,by+bh*0.8,bx+bw*0.3,by+bh*0.9);
      ctx.quadraticCurveTo(bx-bw*0.3,by+bh*0.9,bx-bw*0.6,by+bh*0.8);
      ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=2;ctx.stroke();
      // 肩峰
      const shgr=ctx.createRadialGradient(bx-bs*0.06,by-bh*0.6,bs*0.05,bx-bs*0.06,by-bh*0.6,bs*0.22);
      shgr.addColorStop(0,'#b08050');shgr.addColorStop(1,'#8b6040');
      ctx.fillStyle=shgr;ctx.beginPath();ctx.ellipse(bx-bs*0.08,by-bh*0.5,bs*0.2,bs*0.13,-0.15,0,Math.PI*2);ctx.fill();
      // 头部
      const hgr=ctx.createRadialGradient(bx-bs*0.04,by-bh*0.75,bs*0.02,bx,by-bh*0.7,bs*0.22);
      hgr.addColorStop(0,'#c89868');hgr.addColorStop(1,'#8b6340');
      ctx.fillStyle=hgr;ctx.beginPath();ctx.arc(bx,by-bh*0.7,bs*0.2,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1.5;ctx.stroke();
      // 耳朵(圆润三角)
      ctx.fillStyle='#8b5a38';
      [[-bs*0.12,-bh*0.88],[bs*0.10,-bh*0.88]].forEach(([ex,ey])=>{
        ctx.beginPath();ctx.arc(bx+ex,by+ey,bs*0.08,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#d4a080';ctx.beginPath();ctx.arc(bx+ex,by+ey,bs*0.04,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#8b5a38';
      });
      // 眼睛
      ctx.fillStyle='#1a0a00';ctx.beginPath();ctx.arc(bx-bs*0.04,by-bh*0.74,bs*0.035,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(bx+bs*0.08,by-bh*0.74,bs*0.035,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx-bs*0.02,by-bh*0.76,bs*0.015,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(bx+bs*0.10,by-bh*0.76,bs*0.015,0,Math.PI*2);ctx.fill();
      // 鼻子
      ctx.fillStyle='#2a1000';ctx.beginPath();ctx.ellipse(bx+bs*0.02,by-bh*0.64,bs*0.05,bs*0.035,0,0,Math.PI*2);ctx.fill();
      // 粗腿+爪
      ctx.fillStyle='#7a4a28';
      [[-bs*0.2,-bs*0.03,bs*0.12,bs*0.24]].forEach(lx=>{
        ctx.beginPath();ctx.ellipse(bx+lx,by+bh*0.7,bs*0.12,bs*0.15,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1.5;ctx.stroke();
        // 爪尖
        ctx.fillStyle='#3a1800';
        for(let c=-1;c<=1;c++){ctx.beginPath();ctx.arc(bx+lx+c*bs*0.05,by+bh*0.83,bs*0.025,0,Math.PI*2);ctx.fill();}
        ctx.fillStyle='#7a4a28';
      });
      // 小圆尾
      ctx.fillStyle='#6b3a20';ctx.beginPath();ctx.arc(bx+bw*0.5,by-bh*0.1,bs*0.08,0,Math.PI*2);ctx.fill();
      // 狂暴状态
      if(this.passives.some(p=>p.type==='rage')&&this.hp/this.maxHp<0.3){
        ctx.strokeStyle='rgba(255,70,30,0.5)';ctx.lineWidth=2.5;ctx.setLineDash([2,3]);ctx.lineDashOffset=t/50;
        ctx.beginPath();ctx.arc(bx,by-bh*0.3,bs*0.55,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      }
      return;
    }

    if(id==='wolf'){
      // 🐺 狼: 流线型敏捷身材, 贝塞尔曲线

      ctx.fillStyle='#988878';
      [[-ew*0.4,-ew*0.08,ew*0.12,ew*0.36]].forEach(lx=>{
        ctx.beginPath();ctx.ellipse(bx+lx,by+eh*0.6,bs*0.14,bs*0.18,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1.5;ctx.stroke();
        // 趾甲
        ctx.fillStyle='#d0c8c0';
        for(let t=0;t<3;t++){ctx.beginPath();ctx.arc(bx+lx+(t-1)*bs*0.06,by+eh*0.75,bs*0.03,0,Math.PI*2);ctx.fill();}
        ctx.fillStyle='#988878';
      });
      // 小尾
      ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(bx+ew*0.8,by-eh*0.1);ctx.quadraticCurveTo(bx+ew*1.0,by-eh*0.2,bx+ew*0.7,by+eh*0.1);ctx.stroke();
      return;
    }

    // ===== 鸡(bird类): 圆润可爱+鸡冠+喙+爪 =====
    if(bodyType==='bird'){
      const ch=bs*0.32*breath,cw=bs*0.38;
      // 羽毛渐层
      const cgr=ctx.createLinearGradient(bx,by-ch,bx,by+ch);
      if(id==='chicken'||this._chickPhase>=0){
        cgr.addColorStop(0,'#fffef8');cgr.addColorStop(0.5,'#faf0d8');cgr.addColorStop(1,'#e8d0a0');
      }else if(this.name&&this.name.includes('公鸡')){
        cgr.addColorStop(0,'#f0c8a0');cgr.addColorStop(0.5,'#d08050');cgr.addColorStop(1,'#8a3020');
      }else{
        cgr.addColorStop(0,'#fffef5');cgr.addColorStop(0.5,'#faf0d0');cgr.addColorStop(1,'#e8d0a0');
      }
      ctx.fillStyle=cgr;
      // 梨形身体(上窄下宽的贝塞尔椭圆)
      ctx.beginPath();
      ctx.moveTo(bx,by-ch*0.85);
      ctx.quadraticCurveTo(bx+cw*0.9,by-ch*0.1,bx+cw*0.75,by+ch*0.7);
      ctx.quadraticCurveTo(bx+cw*0.15,by+ch*0.85,bx-cw*0.15,by+ch*0.85);
      ctx.quadraticCurveTo(bx-cw*0.75,by+ch*0.7,bx-cw*0.9,by-ch*0.1);
      ctx.quadraticCurveTo(bx,by-ch*0.8,bx,by-ch*0.85);
      ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1.8;ctx.stroke();
      // 翅膀(圆润)
      ctx.fillStyle=this.bodyColor;ctx.globalAlpha=0.5;
      [-1,1].forEach(dir=>{
        ctx.beginPath();
        ctx.ellipse(bx+dir*bs*0.12,by-ch*0.05+wingFlap*bs*0.15,bs*0.16,bs*0.11,dir*0.3,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;ctx.stroke();
      });
      ctx.globalAlpha=1;
      // 头部
      ctx.fillStyle='#fffef8';ctx.beginPath();ctx.arc(bx,by-ch*0.68,bs*0.14,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1.2;ctx.stroke();
      // 鸡冠(锯齿/波浪)
      const combColor=this.name&&this.name.includes('公鸡')?'#c03020':'#e04030';
      ctx.fillStyle=combColor;
      ctx.beginPath();
      const combX=bx,combY=by-ch*0.82;
      ctx.moveTo(combX-bs*0.10,combY);
      for(let c=0;c<5;c++){const cx=combX-bs*0.08+c*bs*0.04;ctx.quadraticCurveTo(cx,combY-bs*0.12,cx+bs*0.02,combY);}
      ctx.quadraticCurveTo(combX+bs*0.10,combY+bs*0.04,combX-bs*0.04,combY+bs*0.03);
      ctx.quadraticCurveTo(combX-bs*0.08,combY+bs*0.02,combX-bs*0.10,combY);
      ctx.fill();
      // 肉垂
      ctx.beginPath();ctx.arc(bx+bs*0.02,by-ch*0.55,bs*0.05,0,Math.PI*2);ctx.fill();
      // 三角喙
      ctx.fillStyle='#f0a830';ctx.beginPath();
      ctx.moveTo(bx+bs*0.06,by-ch*0.66);ctx.lineTo(bx+bs*0.18,by-ch*0.62);ctx.lineTo(bx+bs*0.06,by-ch*0.56);ctx.closePath();ctx.fill();
      // 眼睛
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(bx+bs*0.02,by-ch*0.70,bs*0.03,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx+bs*0.01,by-ch*0.71,bs*0.012,0,Math.PI*2);ctx.fill();
      // 鸡爪(两节+趾)
      ctx.strokeStyle='#e8a030';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';
      [-1,1].forEach(dir=>{
        const lx=bx+dir*bs*0.06,ly=by+ch*0.7;
        ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+dir*bs*0.03,ly+bs*0.08);ctx.stroke();
        ctx.beginPath();ctx.moveTo(lx+dir*bs*0.03,ly+bs*0.08);ctx.lineTo(lx+dir*bs*0.04,ly+bs*0.14);ctx.moveTo(lx+dir*bs*0.03,ly+bs*0.08);ctx.lineTo(lx-dir*bs*0.02,ly+bs*0.13);ctx.moveTo(lx+dir*bs*0.03,ly+bs*0.08);ctx.lineTo(lx+dir*bs*0.07,ly+bs*0.12);ctx.stroke();
      });
      return;
    }

    // fallthrough: 通用小鸟(小鸡等)
    const gh=bs*0.26*breath,gw=bs*0.32;
    const ggr=ctx.createLinearGradient(bx,by-gh,bx,by+gh);
    ggr.addColorStop(0,this.color);ggr.addColorStop(1,this.bodyColor||this.color);
    ctx.fillStyle=ggr;
    ctx.beginPath();
    ctx.moveTo(bx,by-gh*0.85);
    ctx.quadraticCurveTo(bx+gw*0.8,by-gh*0.1,bx+gw*0.6,by+gh*0.65);
    ctx.quadraticCurveTo(bx+gw*0.1,by+gh*0.8,bx-gw*0.1,by+gh*0.8);
    ctx.quadraticCurveTo(bx-gw*0.6,by+gh*0.65,bx-gw*0.8,by-gh*0.1);
    ctx.quadraticCurveTo(bx,by-gh*0.8,bx,by-gh*0.85);
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=2;ctx.lineCap='round';
    [-bs*0.2,-bs*0.05,bs*0.08,bs*0.2].forEach(lx=>{ctx.beginPath();ctx.moveTo(bx+lx,by+gh*0.55);ctx.lineTo(bx+lx,by+gh+bs*0.08);ctx.stroke();});
  }

  draw(ctx){
    if(this.dead)return;
    const bScale=1+this.scaleBob+(this.windupTimer>0?(1-this.windupTimer/this.windupMax)*0.1:0);
    const renderY=this.y-this.drawY;

    // ===== 道具Buff持续视觉反馈 =====
    // 加速: 身后风线
    if(this.speedBoostTimer>0&&!this.stunned){
      const spd=Math.hypot(this.vx,this.vy)||1;
      const nx=-(this.vx/spd),ny=-(this.vy/spd);
      ctx.strokeStyle='rgba(255,220,60,0.5)';ctx.lineWidth=2;ctx.lineCap='round';
      for(let i=0;i<3;i++){
        const lx=this.x+nx*(this.size*0.6+i*10)+ny*(i-1)*4,ly=renderY+ny*(this.size*0.6+i*10)-nx*(i-1)*4;
        ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+nx*8,ly+ny*8);ctx.stroke();
      }
    }
    // 加攻: 红色光晕
    if(this.dmgBoostTimer>0&&!this.stunned){
      const pa=Date.now()/200;
      ctx.strokeStyle='rgba(255,100,20,0.4)';ctx.lineWidth=3;ctx.setLineDash([3,5]);ctx.lineDashOffset=pa*10;
      ctx.beginPath();ctx.arc(this.x,renderY,this.size+5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    }
    // 冻结: 冰晶覆层
    if(this._frozen&&this.stunned){
      ctx.fillStyle='rgba(100,200,255,0.3)';ctx.beginPath();ctx.arc(this.x,renderY,this.size+3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(200,240,255,0.6)';ctx.lineWidth=2.5;
      for(let i=0;i<3;i++){const a=Date.now()/300+i*Math.PI*2/3;ctx.beginPath();ctx.moveTo(this.x,renderY);ctx.lineTo(this.x+Math.cos(a)*(this.size+8),renderY+Math.sin(a)*(this.size+8));ctx.stroke();}
    }
    // 闪烁反馈(刚拾取道具)
    if(this._healFlash>0){ctx.strokeStyle='rgba(255,80,80,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(this.x,renderY,this.size+8,0,Math.PI*2);ctx.stroke();}
    if(this._speedFlash>0){ctx.strokeStyle='rgba(255,220,60,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(this.x,renderY,this.size+6,0,Math.PI*2);ctx.stroke();}
    if(this._powerFlash>0){ctx.strokeStyle='rgba(255,100,20,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(this.x,renderY,this.size+6,0,Math.PI*2);ctx.stroke();}
    if(this._shieldFlash>0){ctx.strokeStyle='rgba(68,170,255,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(this.x,renderY,this.size+8,0,Math.PI*2);ctx.stroke();}

    if(this.hibernating){ctx.font='12px serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('💤',this.x,renderY-this.size-16);}
    if(this.stunned)for(let i=0;i<3;i++){const a=(Date.now()/300+i*Math.PI*2/3)%(Math.PI*2);ctx.font='11px serif';ctx.fillText('⭐',this.x+Math.cos(a)*(this.size+9)-5,renderY+Math.sin(a)*(this.size+5)-7);}
    if(this.shieldActive){
      const pulse=1+Math.sin(Date.now()/200)*0.18;
      ctx.strokeStyle='rgba(68,170,255,0.55)';ctx.lineWidth=3.5*pulse;ctx.beginPath();ctx.arc(this.x,renderY,(this.size+10)*pulse,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='rgba(68,170,255,0.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,renderY,(this.size+18)*pulse,0,Math.PI*2);ctx.stroke();
    }
    if(this.critNext){ctx.strokeStyle='rgba(255,215,0,0.5)';ctx.lineWidth=2.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(this.x,renderY,this.size+6,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
    if(this.windupTimer>0){const wp=1-this.windupTimer/this.windupMax;ctx.font=`${18+wp*20}px serif`;ctx.fillStyle='#ff6b6b';ctx.textAlign='center';ctx.fillText('🐾',this.x,renderY-this.size*0.7-wp*25);}
    if(this.diveTimer>0&&this.diveTimer/this.diveMax<0.65){const spd=Math.hypot(this.vx,this.vy);ctx.strokeStyle='rgba(135,206,235,0.5)';ctx.lineWidth=2;for(let i=0;i<3;i++){const lx=this.x-this.vx/spd*(this.size+10+i*8),ly=renderY-this.vy/spd*(this.size+10+i*8);ctx.beginPath();ctx.moveTo(lx-5,ly);ctx.lineTo(lx+5,ly);ctx.stroke();}}
    if(this.hopActive){ctx.strokeStyle='rgba(205,133,63,0.5)';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(this.x,renderY,this.size+5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}

    this.drawBody(ctx,renderY,bScale);

    if(this._chickPhase===0){ctx.font='7px "PingFang SC"';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillText('崽',this.x,renderY+this.size*0.55);}
    else if(this._chickPhase===1){ctx.font='7px "PingFang SC"';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillText('青年',this.x,renderY+this.size*0.55);}
    ctx.font=`bold ${this.isMinion?7:9}px "PingFang SC","Microsoft YaHei"`;ctx.fillStyle='#fff';ctx.fillText(this.displayName,this.x,renderY+this.size*0.65);

    const bw=Math.max(28,this.size*1.1),bh=this.isMinion?2.5:4.5,by=renderY-this.size*0.55;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(this.x-bw/2,by,bw,bh);
    const hpR=this.hp/this.maxHp;ctx.fillStyle=hpR>0.5?'#5cb85c':hpR>0.25?'#f0ad4e':'#d9534f';ctx.fillRect(this.x-bw/2,by,bw*hpR,bh);
    ctx.font=`bold ${this.isMinion?6.5:8}px "PingFang SC"`;ctx.fillStyle='#fff';ctx.fillText(`${Math.ceil(this.hp)}/${this.maxHp}`,this.x,by-2);
    if(this.weakenPct>0){ctx.font='9px serif';ctx.fillStyle='#8e44ad';ctx.fillText('🔻',this.x,renderY-this.size*0.6);}
    if(this.slowed){ctx.font='9px serif';ctx.fillStyle='#5dade2';ctx.fillText('🐌',this.x+this.size*0.5,renderY-5);}
    if(this.dotEffects.length>0){ctx.font='9px serif';ctx.fillStyle='#e74c3c';ctx.fillText('💔',this.x-this.size*0.5,renderY-3);}
    if(this.grudgeStacks>=3){ctx.font='9px serif';ctx.fillStyle='#ff6600';ctx.fillText('💢'.repeat(Math.min(5,this.grudgeStacks)),this.x-this.size*0.4,renderY+this.size*0.5);}
    // 道具buff倒计时显示
    if(this.speedBoostTimer>0){ctx.font='bold 8px "PingFang SC"';ctx.fillStyle='#ffdd44';ctx.fillText('⚡'+(this.speedBoostTimer/1000).toFixed(1)+'s',this.x,renderY-this.size*0.7);}
    if(this.dmgBoostTimer>0){ctx.font='bold 8px "PingFang SC"';ctx.fillStyle='#ff6600';ctx.fillText('💪'+(this.dmgBoostTimer/1000).toFixed(1)+'s',this.x,renderY-this.size*0.7-10);}
    if(this.shieldActive){ctx.font='bold 8px "PingFang SC"';ctx.fillStyle='#44aaff';ctx.fillText('🛡️'+(this.shieldTimer/1000).toFixed(1)+'s',this.x,renderY-this.size*0.7-(this.dmgBoostTimer>0?20:0));}
  }
}

// ==================== 蛋类 ====================
const EGG_STAGES=[{emoji:'🥚',name:'蛋',size:19,hp:1,time:22000,color:'#fff8e0'},{emoji:'🐤',name:'雏鸡',size:32,hp:5,time:11000,color:'#fffde0'},{emoji:'🐥',name:'待出',size:38,hp:8,time:11000,color:'#fff9c4'}];

class Egg{
  constructor(x,y,owner){this.x=x;this.y=y;this.owner=owner;this.stage=0;this.accTime=0;this.hp=EGG_STAGES[0].hp;this.maxHp=this.hp;this.flashTimer=0;this.hitCD=0;this.dead=false;this.bobOff=0;}
  get cur(){return EGG_STAGES[this.stage];}
  get size(){return this.cur.size;}
  update(dt){
    if(this.dead)return;this.accTime+=dt;this.bobOff=Math.sin(this.accTime/400)*1.5;if(this.hitCD>0)this.hitCD-=dt;if(this.flashTimer>0)this.flashTimer-=dt;
    if(this.stage<2&&this.accTime>=this.cur.time){this.accTime-=this.cur.time;this.stage++;if(this.stage<2){this.hp=EGG_STAGES[this.stage].hp;this.maxHp=this.hp;spawnFX('text',this.x,this.y-14,EGG_STAGES[this.stage].name+'!','#f4a460');}
      if(this.stage>=2){this.dead=true;const cfg={...CHICK_CFG};const chick=new Animal(cfg,this.x,this.owner.team,this.owner);chick.x=this.x;chick.y=this.y;chick._chickPhase=0;chick._chickTimer=0;chick.name='小鸡';chick.emoji='🐤';chick.hp=cfg.hp;chick.maxHp=cfg.hp;chick.isMinion=true;chick.ranged=false;animals.push(chick);spawnFX('text',this.x,this.y-16,'孵化!🐤','#ffd700');}}
  }
  takeDmg(dmg){if(this.hitCD>0)return;this.hp-=dmg;this.flashTimer=100;this.hitCD=350;spawnFX('damage',this.x,this.y-8,dmg,'#ff9966');if(this.hp<=0){this.hp=0;this.dead=true;spawnFX('text',this.x,this.y-10,'蛋碎了!','#ff6b6b');}}
  draw(ctx){
    if(this.dead)return;const c=this.cur,s=c.size;const bgR=s+6;
    ctx.fillStyle=c.color;ctx.globalAlpha=0.7;ctx.beginPath();ctx.arc(this.x,this.y,bgR,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(this.x,this.y,bgR,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,0,0,0.1)';ctx.beginPath();ctx.ellipse(this.x,this.y+bgR+1,bgR*0.45,2,0,0,Math.PI*2);ctx.fill();
    ctx.font=`${s*1.2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.emoji,this.x,this.y+this.bobOff);
    ctx.font='bold 8px "PingFang SC"';ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillText(c.name,this.x,this.y-bgR-8);
    const bbw=s*2.0,bbh=3,bby=this.y+bgR+4;ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(this.x-bbw/2,bby,bbw,bbh);ctx.fillStyle='#ff8c55';ctx.fillRect(this.x-bbw/2,bby,bbw*(this.hp/this.maxHp),bbh);
    if(this.stage<2){const pbw=s*2.0,pbh=4,pby=bby+5;ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(this.x-pbw/2,pby,pbw,pbh);const p=this.accTime/c.time;const grad=ctx.createLinearGradient(this.x-pbw/2,0,this.x+pbw/2,0);grad.addColorStop(0,'#ffd700');grad.addColorStop(1,'#ffaa00');ctx.fillStyle=grad;ctx.fillRect(this.x-pbw/2,pby,pbw*p,pbh);ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.strokeRect(this.x-pbw/2,pby,pbw,pbh);}
  }
}

// ==================== 特效系统 ====================
function spawnSpark(x,y,count,life,colors,lifeMs,vel={vx:0,vy:0}){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2;const sp=3+Math.random()*life;effects.push({type:'spark',x,y,life:lifeMs,age:0,dead:false,data:{dx:Math.cos(a)*sp,dy:Math.sin(a)*sp,size:2+Math.random()*2,vx:vel.vx||0,vy:vel.vy||0,color:colors[Math.floor(Math.random()*colors.length)]}});}}
function spawnDust(x,y,radius,color,lifeMs,vel={vx:0,vy:0}){effects.push({type:'dust',x,y,life:lifeMs,age:0,dead:false,data:{radius,color,vx:vel.vx||0,vy:vel.vy||0}});}
function spawnFX(type,x,y,data,color,scale=1){const life=type==='ring'?(data.life||600):type==='projectile'?1500:1000;effects.push({type,x,y,data,color,scale,life,age:0,dead:false});}

function updateFX(dt){
  effects.forEach(e=>{e.age+=dt;if(e.age>=e.life){e.dead=true;return;}
    switch(e.type){
      case'damage':e.y-=32*dt/1000;break;case'text':e.y-=24*dt/1000;break;
      case'spark':if(e.data.vx!==undefined||e.data.vy!==undefined){e.x+=(e.data.vx||0)*dt/1000;e.y+=(e.data.vy||0)*dt/1000;}break;
      case'dust':if(e.data.vx!==undefined||e.data.vy!==undefined){e.x+=(e.data.vx||0)*dt/1000;e.y+=(e.data.vy||0)*dt/1000;}break;
      case'ring':break;
      case'projectile':
        if(e.data.target&&!e.data.target.dead){const t=e.data.target,dx=t.x-e.x,dy=t.y-e.y,dist=Math.sqrt(dx*dx+dy*dy)||1,sp=e.data.speed*60;e.x+=(dx/dist)*sp*dt/1000;e.y+=(dy/dist)*sp*dt/1000;if(dist<t.size*0.8){t.hp-=e.data.damage;if(t.hp<=0){t.hp=0;t.dead=true;}t.flashTimer=100;spawnFX('damage',t.x,t.y-16,e.data.damage,'#f4a460');e.dead=true;}}
        else if(e.data.vx!==undefined){e.x+=e.data.vx*dt/1000;e.y+=e.data.vy*dt/1000;if(e.x<arenaL-20||e.x>arenaR+20||e.y<arenaT-20||e.y>arenaB+20)e.dead=true;const nearby=animals.filter(a=>a.team!==e.data._team&&!a.dead&&Math.hypot(a.x-e.x,a.y-e.y)<a.size+8);if(nearby.length>0){const t=nearby[0];t.hp-=Math.round(e.data.damage*0.5)||3;t.flashTimer=100;spawnFX('damage',t.x,t.y-16,Math.round(e.data.damage*0.5)||3,'#999');e.dead=true;}}else{e.dead=true;}
        break;
    }
  });
  effects=effects.filter(e=>!e.dead);
  groundCracks.forEach(c=>{c.age+=dt;if(c.age>=c.life)c.dead=true;});groundCracks=groundCracks.filter(c=>!c.dead);
}

function drawFX(ctx){
  groundCracks.forEach(c=>{const a=1-c.age/c.life;ctx.strokeStyle=`rgba(139,90,43,${a*0.6})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+Math.cos(c.angle)*c.len,c.y+Math.sin(c.angle)*c.len);ctx.stroke();});
  mapHazards.forEach(h=>{
    if(h.phase==='warning'){
      const a=1-h.age/h.life;const wAlpha=0.3+Math.sin(Date.now()/100)*0.3;
      ctx.fillStyle=`rgba(255,80,0,${wAlpha})`;ctx.beginPath();ctx.arc(h.x,h.y,h.radius*0.3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=`rgba(255,120,20,${wAlpha*1.5})`;ctx.lineWidth=2.5;ctx.setLineDash([4,4]);ctx.lineDashOffset=Date.now()/50;
      ctx.beginPath();ctx.arc(h.x,h.y,h.radius*0.6,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    }else{
      const a=1-h.age/h.life;
      const g=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.radius*a);
      g.addColorStop(0,'rgba(255,180,40,0.7)');g.addColorStop(0.5,'rgba(255,60,10,0.4)');g.addColorStop(1,'rgba(255,20,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(h.x,h.y,h.radius*a,0,Math.PI*2);ctx.fill();
    }
  });
  mapParticles.forEach(p=>{const a=1-p.age/p.life;ctx.fillStyle=`rgba(255,255,255,${a*0.5})`;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();});
  effects.forEach(e=>{const a=Math.max(0,1-e.age/e.life);ctx.globalAlpha=a;
    switch(e.type){
      case'damage':ctx.font=`bold ${Math.round(18*e.scale)}px "PingFang SC"`;ctx.fillStyle=e.color;ctx.textAlign='center';ctx.fillText(`-${e.data}`,e.x,e.y);break;
      case'text':ctx.font=`bold ${Math.round(14*e.scale)}px "PingFang SC"`;ctx.fillStyle=e.color;ctx.textAlign='center';ctx.fillText(e.data,e.x,e.y);break;
      case'projectile':ctx.font='16px serif';ctx.textAlign='center';ctx.fillText(e.data.emoji,e.x,e.y);break;
      case'spark':{const sp=1-e.age/e.life;const sx=e.x+e.data.dx*(1-sp),sy=e.y+e.data.dy*(1-sp),ex=e.x+e.data.dx,ey=e.y+e.data.dy;ctx.strokeStyle=e.data.color;ctx.lineWidth=e.data.size*sp;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle=e.data.color;ctx.globalAlpha=a*0.8;ctx.beginPath();ctx.arc(ex,ey,e.data.size*0.6,0,Math.PI*2);ctx.fill();}break;
      case'dust':{const dprog=e.age/e.life,dr=e.data.radius*(0.5+0.5*dprog);const dgrad=ctx.createRadialGradient(e.x,e.y,dr*0.1,e.x,e.y,dr);dgrad.addColorStop(0,e.data.color);dgrad.addColorStop(1,'transparent');ctx.fillStyle=dgrad;ctx.globalAlpha=a*0.6;ctx.beginPath();ctx.arc(e.x,e.y,dr,0,Math.PI*2);ctx.fill();}break;
      case'ring':{const prog=e.age/e.life,r=e.data.maxRadius*prog;ctx.strokeStyle=e.data.color||e.color;ctx.lineWidth=4*(1-prog);ctx.globalAlpha=a*0.5;ctx.beginPath();if(e.data.jagged){for(let i=0;i<24;i++){const aa=Math.PI*2/24*i,jr=r*(0.8+Math.random()*0.2);i===0?ctx.moveTo(e.x+Math.cos(aa)*jr,e.y+Math.sin(aa)*jr):ctx.lineTo(e.x+Math.cos(aa)*jr,e.y+Math.sin(aa)*jr);}ctx.closePath();}else{ctx.arc(e.x,e.y,r,0,Math.PI*2);}ctx.stroke();}break;
    }
    ctx.globalAlpha=1;
  });
  animals.forEach(a=>{if(!a.dead&&a.hopActive&&Math.random()<0.6){ctx.globalAlpha=0.5;const dg=ctx.createRadialGradient(a.x,a.y+a.size*0.35,2,a.x,a.y+a.size*0.35,8);dg.addColorStop(0,'#c4a882');dg.addColorStop(1,'transparent');ctx.fillStyle=dg;ctx.beginPath();ctx.arc(a.x-a.vx*0.15+(Math.random()-0.5)*14,a.y+a.size*0.35+(Math.random()-0.5)*10,5+Math.random()*8,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}});
}

// ==================== 主循环 ====================
function loop(ts){
  if(!lastTime)lastTime=ts;
  let dt=Math.min(ts-lastTime,100)*gameSpeed;lastTime=ts;
  ctx.clearRect(0,0,W,H);

  if(shakeTimer>0){shakeTimer-=dt;const r=shakeIntensity*(shakeTimer/shakeMax);shakeX=(Math.random()-0.5)*r*2;shakeY=(Math.random()-0.5)*r*2;if(shakeTimer<=0){shakeX=0;shakeY=0;shakeIntensity=0;}}
  ctx.save();if(shakeX||shakeY)ctx.translate(shakeX,shakeY);

  drawBG(ctx);

  if(gameState==='fighting'){
    mapTick(dt);
    animals.forEach(a=>a.update(dt));
    eggs.forEach(e=>e.update(dt));
    items.forEach(it=>it.update(dt));
    items=items.filter(it=>!it.dead);
    updateFX(dt);

    // 道具刷新
    itemSpawnCD-=dt;
    if(itemSpawnCD<=0&&items.length<3){
      const ix=arenaL+40+Math.random()*(arenaR-arenaL-80),iy=arenaT+30+Math.random()*(arenaB-arenaT-60);
      items.push(new Item(ix,iy));
      itemSpawnCD=20000+Math.random()*20000;
    }

    // DOT
    animals.forEach(a=>{a.dotEffects.forEach(d=>{d.elapsed+=dt;d.tickAcc+=dt;if(d.tickAcc>=d.tick){d.tickAcc-=d.tick;a.hp-=d.dmg;if(a.hp<=0){a.hp=0;a.dead=true;}spawnFX('damage',a.x+(Math.random()-0.5)*12,a.y-12,d.dmg,'#e74c3c');}});a.dotEffects=a.dotEffects.filter(d=>d.elapsed<d.dur);});

    const alive=animals.filter(a=>!a.dead);

    // 道具拾取
    for(const it of items){if(it.dead)continue;for(const a of alive){if(Math.hypot(a.x-it.x,a.y-(it.y+it.bob))<a.size+14){it.type.apply(a);it.dead=true;break;}}}

    // 狮子威慑
    alive.forEach(a=>{const intim=a.passives.find(p=>p.type==='intimidate');if(!intim||a.stunned)return;const foes=alive.filter(e=>!e.dead&&e!==a&&!e.stunned&&Math.hypot(e.x-a.x,e.y-a.y)<intim.radius);foes.forEach(f=>{if(Math.random()<intim.fleeChance*dt/1000){const dx=f.x-a.x,dy=f.y-a.y,dist=Math.hypot(dx,dy)||1;f.vx=(dx/dist)*f.speed*70;f.vy=(dy/dist)*f.speed*60;f.dirTimer=DIR_MIN+Math.random()*1000;spawnFX('text',f.x,f.y-16,'逃跑!','#e8a87c');}});});

    // 大象践踏
    alive.forEach(a=>{const tram=a.passives.find(p=>p.type==='trample');if(!tram||a.stunned)return;const victims=alive.filter(e=>!e.dead&&e!==a&&e.size<a.size*0.7&&Math.hypot(e.x-a.x,e.y-a.y)<tram.radius);victims.forEach(v=>{v.hp-=tram.dps*dt/1000;v.flashTimer=50;if(v.hp<=0){v.hp=0;v.dead=true;}});});

    // 碰撞+攻击
    for(let i=0;i<alive.length;i++){
      for(let j=i+1;j<alive.length;j++){
        const a=alive[i],b=alive[j];if(a.team===b.team)continue;
        const dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
        const bodyDist=a.size+b.size;
        if(dist<bodyDist){const ov=bodyDist-dist,nx=dx/dist,ny=dy/dist;a.x-=nx*ov*0.5;a.y-=ny*ov*0.5;b.x+=nx*ov*0.5;b.y+=ny*ov*0.5;if(!a.isMinion||a._chickPhase>=2||!a.owner||a.owner.dead){a._newDir();a.recoilTimer=RECOIL_TIME;}if(!b.isMinion||b._chickPhase>=2||!b.owner||b.owner.dead){b._newDir();b.recoilTimer=RECOIL_TIME;}}
        const atkDist=bodyDist+8;
        if(!a.dead&&!b.dead&&dist<atkDist){
          if(a.atkTimer<=0&&!a.ranged&&!a.stunned&&(a.recoilTimer<=0||a.diveTimer>0)&&!(a._chickPhase===0)){a.dealDmg(b);a.atkTimer=ATK_CD;}
          if(!b.dead&&b.atkTimer<=0&&!b.ranged&&!b.stunned&&(b.recoilTimer<=0||b.diveTimer>0)&&!(b._chickPhase===0)){b.dealDmg(a);b.atkTimer=ATK_CD;}
        }
        if(!a.dead&&!b.dead){if(!a.stunned&&!(a._chickPhase===0)){if(a.ranged&&a.rangedTimer<=0&&dist<(a.rangedRange||160))a.rangedAttack(b);}if(!b.dead&&!b.stunned&&!(b._chickPhase===0)){if(b.ranged&&b.rangedTimer<=0&&dist<(b.rangedRange||160))b.rangedAttack(a);}}
      }
    }

    // 技能
    alive.forEach(a=>{if(a.dead||a.stunned)return;if(a.isMinion&&!a._canLay)return;const enemies=alive.filter(e=>e!==a&&!e.dead);a.skills.forEach(s=>{if(s.cdTimer<=0)a.useSkill(s,enemies);});});

    // 蛋受击
    for(const egg of eggs){if(egg.dead)continue;for(const a of alive){if(a.team===egg.owner.team||a.dead||a.stunned)continue;if(Math.hypot(a.x-egg.x,a.y-egg.y)<a.size+egg.size){egg.takeDmg(a.effDmg());if(egg.dead)break;}}}

    animals=animals.filter(a=>!a.dead);eggs=eggs.filter(e=>!e.dead);

    const al=animals.filter(a=>!a.dead);
    const hasEgg=eggs.some(e=>!e.dead);
    if(al.length<=1&&!hasEgg){gameState='ended';winner=al.length===1?al[0]:null;document.getElementById('bf').disabled=false;}
    else if(al.length===0&&hasEgg){const tE=eggs.length,tA=animals.length;if(tE===0&&tA===0){gameState='ended';winner=null;}}
  }

  eggs.forEach(e=>e.draw(ctx));
  animals.forEach(a=>a.draw(ctx));
  items.forEach(it=>it.draw(ctx));
  drawFX(ctx);

  if(gameState==='ended'){
    const alpha=0.5+Math.sin(Date.now()/500)*0.3;
    ctx.globalAlpha=alpha;ctx.font='bold 26px "PingFang SC"';ctx.fillStyle='#ffd700';ctx.textAlign='center';
    if(winner)ctx.fillText(`${winner.emoji}${winner.displayName}获胜!`,W/2,H/2-8);
    else ctx.fillText(`平局!`,W/2,H/2-8);
    ctx.globalAlpha=1;
  }
  if(gameState==='idle'){ctx.globalAlpha=0.28;ctx.font='bold 14px "PingFang SC"';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('选择动物，点击开始对战',W/2,H/2);ctx.globalAlpha=1;}

  ctx.restore();
  frameId=requestAnimationFrame(loop);
}

// ==================== UI ====================
const CIRCLES=['①','②','③','④','⑤','⑥'];

function populateUI(){
  const asel=document.getElementById('asel'),keys=Object.keys(ANIMALS);
  asel.innerHTML='';keys.forEach(k=>{const a=ANIMALS[k];asel.innerHTML+=`<option value="${k}">${a.emoji}${a.name}</option>`;});
  const msel=document.getElementById('msel');
  msel.innerHTML='';Object.keys(MAPS).forEach(k=>{msel.innerHTML+=`<option value="${k}">${MAPS[k].name}</option>`;});
  msel.value='colosseum';
}

function renderTags(){
  const container=document.getElementById('tags');
  if(selectedAnimals.length===0){container.innerHTML='<span class="mute-tag">未选择动物(最少2只)</span>';return;}
  container.innerHTML=selectedAnimals.map((k,i)=>{
    const a=ANIMALS[k];let name=a.name;
    const sameKind=selectedAnimals.filter(x=>x===k).length;
    if(sameKind>1){let idx=0;for(let j=0;j<=i;j++)if(selectedAnimals[j]===k)idx++;name=a.name+CIRCLES[idx-1];}
    return `<span class="tag" onclick="removeAnimal(${i})">${a.emoji}${name}<span class="x">×</span></span>`;
  }).join('');
}

function addAnimal(){if(selectedAnimals.length>=6)return;const k=document.getElementById('asel').value;selectedAnimals.push(k);renderTags();}
function removeAnimal(i){selectedAnimals.splice(i,1);renderTags();}

function randBattle(){
  const keys=Object.keys(ANIMALS);
  const count=2+Math.floor(Math.random()*5);
  selectedAnimals=[];
  for(let i=0;i<count;i++)selectedAnimals.push(keys[Math.floor(Math.random()*keys.length)]);
  renderTags();
}

function getArenaScale(count){if(count<=3)return 1;if(count<=5)return 1.25;return 1.5;}

function startBattle(){
  if(selectedAnimals.length<2)return;
  currentMap=document.getElementById('msel').value;
  const count=selectedAnimals.length;
  arenaScale=getArenaScale(count);
  resize(arenaScale);
  initGrass();
  const nameCount={};
  animals=[];
  const cx=arenaL+(arenaR-arenaL)/2,cy=arenaT+(arenaB-arenaT)/2;
  const spawnR=Math.min(arenaR-arenaL,arenaB-arenaT)*0.35;
  for(let i=0;i<selectedAnimals.length;i++){
    const k=selectedAnimals[i];nameCount[k]=(nameCount[k]||0)+1;
    const cfg=ANIMALS[k];
    let dn=cfg.name;
    const sameKind=selectedAnimals.filter(x=>x===k).length;
    if(sameKind>1)dn=cfg.name+CIRCLES[nameCount[k]-1];
    const a=new Animal(cfg,0,i);
    a.displayName=dn;a.name=dn;
    const angle=Math.PI*2/count*i-Math.PI/2;
    a.x=cx+Math.cos(angle)*spawnR;a.y=cy+Math.sin(angle)*spawnR*0.7;
    animals.push(a);
  }
  eggs=[];effects=[];items=[];gameState='fighting';winner=null;lastTime=0;
  groundCracks=[];mapHazards=[];mapParticles=[];
  itemSpawnCD=20000+Math.random()*20000;
  windTimer=0;windDir={x:1,y:0};
  mapTick._grassCD=0;mapTick._volCD=0;
  document.getElementById('bf').disabled=true;
}

function resetBattle(){
  animals=[];eggs=[];effects=[];items=[];gameState='idle';winner=null;lastTime=0;
  groundCracks=[];mapHazards=[];mapParticles=[];
  arenaScale=1;resize(1);initGrass();
  document.getElementById('bf').disabled=false;
}

populateUI();
document.getElementById('bf').addEventListener('click',startBattle);
document.getElementById('bx').addEventListener('click',resetBattle);
document.getElementById('br').addEventListener('click',()=>{randBattle();resetBattle();});
document.getElementById('badd').addEventListener('click',addAnimal);
document.querySelectorAll('.speed-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.speed-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');gameSpeed=parseInt(b.dataset.s);}));
document.addEventListener('keydown',e=>{switch(e.key.toLowerCase()){case' ':e.preventDefault();if(gameState==='fighting')resetBattle();startBattle();break;case'r':resetBattle();break;case'f':randBattle();resetBattle();break;case'1':setSpd(1);break;case'2':setSpd(2);break;case'3':setSpd(3);break;case'4':setSpd(4);break;case'6':setSpd(6);break;}});
function setSpd(s){gameSpeed=s;document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.s)===s));}
frameId=requestAnimationFrame(loop);
</script>
